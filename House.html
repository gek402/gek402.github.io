@media screen and (min-width:600px){main:has(.study-layout){max-width:1320px}.study-layout{display:grid;grid-template-columns:minmax(165px,27%) minmax(0,1fr);gap:14px;align-items:start}.study-sidebar{position:sticky;top:var(--study-header,100px);max-height:calc(100dvh - var(--study-header,100px) - 18px);overflow:auto;margin:0;min-width:0;z-index:2;box-shadow:none}.study-index[open] .index-inner{max-height:none;overflow:visible}.study-index>summary{position:sticky;top:0}.study-main,.study-main .reading,.study-main .card{min-width:0;max-width:100%;overflow-wrap:anywhere}.study-sidebar .index-topic{font-size:.8rem}.study-sidebar .index-unit-label{min-width:0;overflow-wrap:anywhere}}

.study-layout .bar>span{background:#9fdfad!important;box-shadow:0 0 8px #9fdfad88}.study-layout .index-topic.seen,.study-layout .index-unit>summary.index-done{background:#d9f3df;color:#174b2c}.study-layout .index-topic.current,.study-layout .index-unit>summary.index-active{background:#fff0ad;color:#594500;border-color:#d9b94c}.study-layout .index-topic.current .here-label,.study-layout .index-topic.current .index-icon,.study-layout .index-unit>summary.index-active .index-icon,.study-layout .index-unit>summary.index-active small{color:#594500}.study-layout .index-topic.seen:not(.current) .index-icon,.study-layout .index-unit>summary.index-done:not(.index-active) .index-icon,.study-layout .index-unit>summary.index-done:not(.index-active) small{color:#174b2c}
</style></head><body><header><div class="top"><button class="brand" onclick="go('home')" aria-label="Ir al inicio"><span class="mark"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></span><span><strong>DR. H.O.U.S.E.</strong><small>Curso de enfermería</small></span></button><div class="grow"></div><nav class="nav" id="nav"></nav><button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" aria-pressed="false">Modo oscuro</button><span class="save-status" id="saveStatus"><span class="dot"></span>Avance guardado</span><button class="iconbtn" onclick="go('settings')" aria-label="Configuración" title="Configuración">⚙</button></div></header><main id="main" tabindex="-1"></main><nav class="bottomnav" id="bottomnav" aria-label="Navegación principal"></nav><footer>Grupo Educativo Kamina · Programa realizado por &quot;S&quot; G.G. · Material de estudio independiente · No sustituye la formación clínica supervisada.</footer><div id="toast" role="status" class="toast" hidden></div><input id="restoreInput" type="file" accept=".json,application/json" hidden><script>
const BANK=[{"id": 0, "t": 1, "ref": "1", "q": ["¿Quién fue conocida como la Dama de la Lámpara?", "¿Qué pionera se asocia con el cuidado nocturno de soldados heridos?", "En una exposición sobre la historia de la enfermería, se muestra una lámpara usada durante rondas nocturnas. ¿A quién representa?"], "a": "Florence Nightingale", "d": ["Virginia Henderson", "Clara Barton", "Dorothea Orem"], "e": "Pionera de la enfermería moderna; recorría hospitales por la noche con una lámpara."}, {"id": 1, "t": 1, "ref": "2", "q": ["¿Quién formuló las 14 necesidades básicas?", "¿Qué teórica relaciona la enfermería con la satisfacción de 14 necesidades?", "Un estudiante clasifica respirar, alimentarse y descansar dentro de un modelo de 14 necesidades. ¿A qué autora corresponde?"], "a": "Virginia Henderson", "d": ["Florence Nightingale", "Dorothea Orem", "Hildegard Peplau"], "e": "Henderson organizó el cuidado en torno a 14 necesidades básicas y a la independencia de la persona."}, {"id": 2, "t": 1, "ref": "3", "q": ["¿Qué NOM establece disposiciones para la práctica de enfermería?", "¿Qué norma debe identificar el estudiante al estudiar la práctica de enfermería en México?", "Un trabajo pide citar la norma mexicana específica sobre la práctica de enfermería, no la del expediente clínico ni vigilancia epidemiológica. ¿Cuál corresponde?"], "a": "NOM-019-SSA3-2013", "d": ["NOM-004-SSA3-2012", "NOM-087-SEMARNAT-SSA1-2002", "NOM-017-SSA2-2012"], "e": "La NOM-019-SSA3-2013 trata la práctica de enfermería en el Sistema Nacional de Salud mexicano; fue publicada en el DOF el 2 de septiembre de 2013."}, {"id": 3, "t": 1, "ref": "4", "q": ["¿Qué abarca el concepto de enfermería?", "¿Qué enfoque incluye a personas sanas y enfermas?", "Un equipo enseña hábitos saludables a personas sin enfermedad y cuida a pacientes enfermos. ¿Qué enfoque describe ambas actividades?"], "a": "Cuidado, promoción y prevención", "d": ["Solo tratamiento de enfermedades", "Solo administración de medicamentos", "Solo rehabilitación física"], "e": "La enfermería comprende cuidados autónomos y colaborativos a personas, familias y comunidades, sanas o enfermas; promoción, prevención y atención. Esta formulación amplia también se asocia al Consejo Internacional de Enfermeras."}, {"id": 4, "t": 1, "ref": "4", "q": ["¿A quién se dirige el cuidado de enfermería?", "¿Qué población contempla la definición amplia de enfermería?", "Una estudiante cree que la atención comunitaria no forma parte de enfermería. ¿Cuál es el alcance correcto?"], "a": "Personas, familias y comunidades", "d": ["Solo adultos hospitalizados", "Solo pacientes con cirugía", "Solo personas con discapacidad"], "e": "El cuidado no se restringe a una edad, enfermedad o entorno."}, {"id": 5, "t": 2, "ref": "5", "q": ["¿Cuántos músculos esqueléticos se mencionan aproximadamente?", "¿Qué cifra aproximada corresponde a músculos y no a huesos o vértebras?", "Un cuadro compara 206 huesos con los músculos esqueléticos. ¿Qué cifra aproximada debe colocar en la segunda columna?"], "a": "650", "d": ["206", "33", "120"], "e": "Se suelen mencionar unos 650 músculos esqueléticos; el número varía según la clasificación."}, {"id": 6, "t": 2, "ref": "6", "q": ["¿Cómo se llama la ciencia que estudia los músculos?", "¿Qué rama estudia la estructura y función muscular?", "Se prepara una investigación centrada en músculos esqueléticos y su organización. ¿Qué disciplina corresponde?"], "a": "Miología", "d": ["Osteología", "Histología", "Hematología"], "e": "La miología estudia el sistema muscular; la osteología estudia los huesos."}, {"id": 7, "t": 2, "ref": "7", "q": ["¿Cuáles son los tres tipos de tejido muscular?", "¿Qué clasificación distingue los músculos por estructura y control?", "Se comparan el bíceps, la pared intestinal y el miocardio. ¿Qué tres tejidos representan, respectivamente?"], "a": "Esquelético, liso y cardíaco", "d": ["Esquelético, óseo y nervioso", "Liso, epitelial y cardíaco", "Cardíaco, adiposo y óseo"], "e": "El esquelético es estriado y generalmente voluntario, el liso involuntario y no estriado, y el cardíaco estriado e involuntario."}, {"id": 8, "t": 2, "ref": "8", "q": ["¿Qué significa hipertrofia muscular?", "¿Cómo se denomina el crecimiento del volumen de las fibras existentes?", "Tras entrenamiento de fuerza, aumenta el tamaño de fibras sin que el cambio se defina por su número. ¿Qué fenómeno se describe?"], "a": "Aumento del tamaño de las fibras", "d": ["Disminución del tamaño de las fibras", "Pérdida de células sanguíneas", "Aumento del número de huesos"], "e": "La hipertrofia es el incremento de tamaño de las fibras musculares; no equivale a hiperplasia."}, {"id": 9, "t": 2, "ref": "9", "q": ["¿Qué característica corresponde al músculo cardíaco?", "¿Qué combinación distingue al miocardio del músculo liso y esquelético?", "Una muestra presenta estriaciones y células que se contraen sin control voluntario en el corazón. ¿Qué propiedades son compatibles?"], "a": "Estriado, involuntario y rítmico", "d": ["No estriado y voluntario", "Estriado y voluntario", "No estriado y sin contracción rítmica"], "e": "El miocardio posee células estriadas ramificadas, usualmente con un núcleo central (a veces dos), y contracción involuntaria rítmica."}, {"id": 10, "t": 2, "ref": "7", "q": ["¿Qué tejido muscular predomina en la pared intestinal?", "¿Qué tejido permite contracciones involuntarias sin estriaciones en vísceras?", "Un segmento intestinal desplaza su contenido mediante contracciones involuntarias. ¿Qué tipo muscular participa principalmente?"], "a": "Músculo liso", "d": ["Músculo cardíaco", "Músculo esquelético", "Tejido óseo"], "e": "El músculo liso genera movimientos involuntarios en vísceras, como el peristaltismo intestinal."}, {"id": 11, "t": 3, "ref": "10", "q": ["¿Cuál es la función principal del aparato digestivo?", "¿Qué proceso permite obtener nutrientes aprovechables a partir de alimentos?", "Un esquema sigue alimentos hasta moléculas que pasan al organismo. ¿Qué función general explica el proceso?"], "a": "Transformar alimentos y absorber nutrientes", "d": ["Producir eritrocitos", "Filtrar sangre y formar orina", "Regular la contracción cardíaca"], "e": "La digestión descompone alimentos, facilita la absorción y elimina residuos no absorbidos."}, {"id": 12, "t": 3, "ref": "11", "q": ["¿Dónde comienza la digestión?", "¿En qué lugar coinciden masticación y acción salival?", "Antes de que el alimento llegue al estómago, ya se fragmenta y comienza la digestión química. ¿Dónde?"], "a": "Boca", "d": ["Estómago", "Duodeno", "Esófago"], "e": "La digestión empieza en la boca por masticación y acción de la saliva."}, {"id": 13, "t": 3, "ref": "12", "q": ["¿Dónde se absorbe principalmente la glucosa de los alimentos?", "¿Qué órgano es el principal sitio de absorción de azúcares digeridos?", "Un nutriente simple atraviesa el epitelio hacia la sangre tras la digestión. ¿En qué órgano ocurre principalmente?"], "a": "Intestino delgado", "d": ["Intestino grueso", "Esófago", "Estómago"], "e": "La mayor absorción de nutrientes, incluidos monosacáridos, ocurre en el intestino delgado."}, {"id": 14, "t": 3, "ref": "13", "q": ["¿En qué cuadrante se encuentra principalmente el hígado?", "¿Qué cuadrante corresponde al hipocondrio derecho y gran parte del hígado?", "En un esquema de cuatro cuadrantes visto de frente, el hígado queda a la izquierda del observador. ¿Qué cuadrante del paciente es?"], "a": "Superior derecho", "d": ["Superior izquierdo", "Inferior derecho", "Inferior izquierdo"], "e": "El hígado ocupa principalmente el cuadrante superior derecho; en nueve regiones, hipocondrio derecho y parte del epigastrio."}, {"id": 15, "t": 3, "ref": "14", "q": ["¿Cómo se llaman los movimientos que impulsan el contenido digestivo?", "¿Qué movimiento propulsa el bolo o contenido intestinal?", "Aunque cambie la orientación corporal, ondas musculares desplazan el alimento. ¿Qué proceso lo explica?"], "a": "Peristaltismo", "d": ["Sístole", "Filtración", "Ovulación"], "e": "El peristaltismo son ondas coordinadas de contracción muscular que desplazan el contenido del tubo digestivo."}, {"id": 16, "t": 4, "ref": "15", "q": ["¿Cómo se divide el aparato reproductor femenino?", "¿Qué clasificación separa la vulva de ovarios y útero?", "Un esquema presenta la vulva en una categoría y el útero en otra. ¿Qué criterio de clasificación emplea?"], "a": "Genitales internos y externos", "d": ["Órganos superiores e inferiores exclusivamente", "Glándulas exocrinas y vasos", "Músculos lisos y estriados"], "e": "Los genitales internos incluyen ovarios, trompas, útero y vagina; los externos forman la vulva."}, {"id": 17, "t": 4, "ref": "16", "q": ["¿Cuál es un órgano genital interno femenino?", "¿Qué estructura alberga el endometrio y pertenece a genitales internos?", "Al etiquetar un esquema, una alumna debe escoger una estructura interna entre varias de la vulva. ¿Cuál?"], "a": "Útero", "d": ["Clítoris", "Labios mayores", "Monte del pubis"], "e": "El útero es interno; clítoris, labios y monte del pubis forman parte de genitales externos."}, {"id": 18, "t": 4, "ref": "16", "q": ["¿Cuál de estas estructuras pertenece a la vulva?", "¿Qué estructura es externa, a diferencia de ovarios y trompas?", "Un esquema separa genitales externos de estructuras pélvicas internas. ¿Cuál debe situarse en la sección externa?"], "a": "Clítoris", "d": ["Ovario", "Útero", "Trompa uterina"], "e": "La vulva comprende genitales externos como labios, clítoris, monte del pubis y vestíbulo."}, {"id": 19, "t": 4, "ref": "17", "q": ["¿Cuál es la función de las trompas uterinas?", "¿Qué estructura conecta funcionalmente el ovario con el útero y suele ser sitio de fecundación?", "Tras la ovulación, el ovocito es captado y desplazado hacia el útero. ¿Qué función describe ese proceso?"], "a": "Transportar el ovocito y posibilitar la fecundación", "d": ["Producir orina", "Producir espermatozoides", "Formar la capa funcional del endometrio"], "e": "Las trompas (salpinges) transportan el ovocito hacia el útero; la fecundación suele ocurrir en la ampolla tubárica."}, {"id": 20, "t": 4, "ref": "18", "q": ["¿Con qué frecuencia suele ocurrir la ovulación en un ciclo regular?", "¿Qué duración aproximada se usa como ejemplo de un ciclo menstrual?", "Al comparar ciclos de distinta duración, ¿qué formulación evita afirmar que todas las personas ovulan exactamente cada 28 días?"], "a": "Una vez por ciclo, unos 28 días como referencia", "d": ["Todos los días", "Cada 120 días", "Dos veces por semana"], "e": "Un ciclo de 28 días es un ejemplo, no una regla universal; la duración varía y puede haber ciclos sin ovulación."}, {"id": 21, "t": 4, "ref": "19", "q": ["¿Qué capas tiene el endometrio?", "¿Qué par de capas explica la regeneración endometrial después del sangrado?", "Una capa permanece y permite que se reconstruya otra que se desprende cíclicamente. ¿Qué capas son?"], "a": "Basal y funcional", "d": ["Epidermis y dermis", "Cortical y medular", "Serosa y cartílago"], "e": "La capa basal permanece y regenera la funcional; esta última se desprende durante la menstruación."}, {"id": 22, "t": 4, "ref": "20", "q": ["¿Qué ocurre en la ovulación?", "¿Qué evento distingue la ovulación de la menstruación?", "En un esquema del ciclo, un folículo libera su contenido hacia la trompa. ¿Qué evento representa?"], "a": "Liberación de un ovocito desde el ovario", "d": ["Desprendimiento de toda la pared uterina", "Formación de espermatozoides", "Filtración de sangre"], "e": "La ovulación libera un ovocito; en un ciclo de 28 días puede ocurrir alrededor del día 14, con variaciones."}, {"id": 23, "t": 4, "ref": "20", "q": ["¿Qué sucede durante la menstruación?", "¿Qué cambio uterino caracteriza el inicio de un nuevo ciclo menstrual?", "En el día 1 del ciclo se observa sangrado por cambios endometriales. ¿Qué proceso anatómico lo explica?"], "a": "Desprendimiento de la capa funcional endometrial", "d": ["Liberación de un ovocito", "Desprendimiento de la capa basal completa", "Producción de espermatozoides"], "e": "Si no se establece embarazo, el descenso hormonal favorece el desprendimiento de la capa funcional."}, {"id": 24, "t": 5, "ref": "21", "q": ["¿Qué órganos producen testosterona y espermatozoides?", "¿Qué gónadas tienen función endocrina y reproductiva?", "Un esquema pide localizar el órgano que combina producción de gametos y secreción de testosterona. ¿Cuál?"], "a": "Testículos", "d": ["Próstata", "Vesículas seminales", "Epidídimos"], "e": "Los testículos producen espermatozoides y testosterona; el epidídimo participa en maduración y almacenamiento."}, {"id": 25, "t": 5, "ref": "22", "q": ["¿Qué función tienen los conductos deferentes?", "¿Qué conducto continúa el trayecto desde el epidídimo hacia la vía eyaculadora?", "Un esquema muestra testículo, epidídimo y una vía que dirige los gametos hacia los conductos eyaculadores. ¿Qué función cumple esta última?"], "a": "Transportar espermatozoides hacia conductos eyaculadores", "d": ["Producir testosterona", "Filtrar la orina", "Producir espermatozoides"], "e": "Los deferentes conducen espermatozoides desde el epidídimo hacia los conductos eyaculadores."}, {"id": 26, "t": 5, "ref": "23", "q": ["¿Qué conducto lleva orina al exterior?", "¿Qué conducto se encuentra después de la vejiga en el recorrido urinario?", "Si se sigue la orina desde los riñones hasta salir del cuerpo, ¿cuál es el último conducto?"], "a": "Uretra", "d": ["Uréter", "Conducto deferente", "Epidídimo"], "e": "La uretra comunica la vejiga con el exterior; los uréteres conducen orina desde los riñones a la vejiga."}, {"id": 27, "t": 5, "ref": "24", "q": ["¿Cuál es el órgano copulador masculino?", "¿Qué órgano permite la salida de semen durante la eyaculación?", "Un esquema distingue el órgano copulador de las glándulas que aportan líquido seminal. ¿Cuál corresponde al primero?"], "a": "Pene", "d": ["Próstata", "Escroto", "Epidídimo"], "e": "El pene es el órgano copulador; deposita semen habitualmente en la vagina, no directamente en el útero."}, {"id": 28, "t": 5, "ref": "25", "q": ["¿Qué par corresponde a patologías del aparato reproductor masculino?", "¿Qué enfermedades afectan específicamente la próstata?", "Una actividad pide dos ejemplos, uno de crecimiento benigno de la próstata y otro de inflamación prostática. ¿Qué par es correcto?"], "a": "Hiperplasia prostática y prostatitis", "d": ["Gastritis y colitis", "Dermatitis y psoriasis", "Miocarditis y pericarditis"], "e": "La hiperplasia prostática benigna es crecimiento no maligno de la próstata; la prostatitis es inflamación. Otros ejemplos: varicocele y criptorquidia."}, {"id": 29, "t": 6, "ref": "26", "q": ["¿Cuál es la unidad estructural y funcional básica de los seres vivos?", "¿Qué nivel de organización antecede al tejido?", "Al ordenar célula, tejido, órgano y sistema de menor a mayor complejidad, ¿cuál debe ir primero?"], "a": "Célula", "d": ["Tejido", "Órgano", "Sistema"], "e": "La célula es la unidad básica estructural y funcional; los tejidos se forman por células y componentes asociados."}, {"id": 30, "t": 6, "ref": "27", "q": ["¿Cuáles son las funciones vitales celulares?", "¿Qué conjunto resume las funciones celulares generales?", "Una célula incorpora nutrientes, responde a una señal y se divide. ¿Qué tres funciones ejemplifica?"], "a": "Nutrición, relación y reproducción", "d": ["Filtración, sístole y digestión", "Ovulación, respiración y locomoción", "Coagulación, micción y circulación"], "e": "Las células obtienen nutrientes y energía, responden a estímulos y, según su tipo, pueden dividirse."}, {"id": 31, "t": 6, "ref": "28", "q": ["¿Qué célula carece de núcleo delimitado por membrana?", "¿Cómo se clasifica una bacteria por su organización celular?", "Una muestra presenta ADN en una región sin envoltura nuclear. ¿Qué organización celular describe?"], "a": "Procariota", "d": ["Eucariota animal", "Eucariota vegetal", "Neurona"], "e": "Las procariotas, como bacterias, no tienen núcleo membranoso; las eucariotas sí."}, {"id": 32, "t": 6, "ref": "31", "q": ["¿Cuánto vive aproximadamente un eritrocito?", "¿Qué duración ilustra la vida de los glóbulos rojos?", "Una tabla debe diferenciar el recambio intestinal rápido del recambio de eritrocitos. ¿Qué duración corresponde a estos últimos?"], "a": "120 días", "d": ["28 días", "3 días", "Toda la vida"], "e": "La vida celular depende del tipo: eritrocitos unos 120 días, epitelio intestinal pocos días y muchas neuronas décadas."}, {"id": 33, "t": 6, "ref": "32", "q": ["¿Qué par ejemplifica alteraciones celulares?", "¿Qué ejemplos se relacionan con proliferación descontrolada y alteración de eritrocitos?", "Un tema compara crecimiento celular anormal con una alteración hereditaria de la forma de glóbulos rojos. ¿Qué par encaja?"], "a": "Cáncer y anemia falciforme", "d": ["Gastritis y apendicitis", "Fractura y luxación", "Hipertensión y esguince"], "e": "El cáncer implica proliferación celular desregulada; la anemia falciforme altera la hemoglobina y la forma de eritrocitos."}, {"id": 34, "t": 7, "ref": "29", "q": ["¿Cuál es la capa más superficial de la piel?", "¿Qué capa está en contacto directo con el entorno?", "Una ilustración muestra tres niveles desde la superficie hacia el tejido adiposo. ¿Cuál va primero?"], "a": "Epidermis", "d": ["Dermis", "Hipodermis", "Periostio"], "e": "La epidermis es externa, la dermis está debajo y la hipodermis es tejido subcutáneo (asociado, no piel propiamente dicha en sentido estricto)."}, {"id": 35, "t": 7, "ref": "29", "q": ["¿Qué capa se encuentra debajo de la epidermis?", "¿Qué capa cutánea alberga vasos sanguíneos y tejido conectivo bajo la epidermis?", "En un dibujo se observa una capa externa sin vasos y otra debajo con vasos y nervios. ¿Cuál es la segunda?"], "a": "Dermis", "d": ["Hipodermis", "Endometrio", "Epidermis"], "e": "La dermis contiene tejido conectivo, vasos, terminaciones nerviosas y anexos cutáneos."}, {"id": 36, "t": 7, "ref": "29", "q": ["¿Qué tejido se sitúa bajo la dermis?", "¿Qué nivel subcutáneo contiene abundante grasa?", "Un esquema muestra una región adiposa debajo de la dermis que amortigua y aísla. ¿Cómo se denomina?"], "a": "Hipodermis", "d": ["Epidermis", "Endometrio", "Miocardio"], "e": "La hipodermis o tejido subcutáneo contribuye al aislamiento y amortiguación; suele contener tejido adiposo."}, {"id": 37, "t": 7, "ref": "30", "q": ["¿Qué pigmento contribuye principalmente al color de la piel?", "¿Qué sustancia producen los melanocitos?", "Se estudia el pigmento cutáneo que contribuye a proteger frente a radiación UV. ¿Cuál es?"], "a": "Melanina", "d": ["Insulina", "Queratina", "Colágeno"], "e": "La melanina es producida por melanocitos y participa en la pigmentación y protección frente a radiación UV."}, {"id": 38, "t": 7, "ref": "30", "q": ["¿Qué células producen melanina?", "¿Qué células se asocian directamente con la síntesis del pigmento cutáneo?", "Al distinguir célula productora y pigmento producido, ¿qué célula debe ir asociada a melanina?"], "a": "Melanocitos", "d": ["Eritrocitos", "Osteocitos", "Linfocitos"], "e": "Los melanocitos producen melanina; los queratinocitos reciben pigmento, entre otras funciones."}, {"id": 39, "t": 8, "ref": "33", "q": ["¿Qué integra el sistema cardiovascular?", "¿Qué conjunto permite transportar sangre por el organismo?", "Un sistema incluye una bomba muscular, conductos y fluido circulante. ¿Qué elementos son?"], "a": "Corazón, vasos sanguíneos y sangre", "d": ["Pulmones, tráquea y bronquios", "Riñones, vejiga y uréteres", "Timo, bazo y ganglios"], "e": "El corazón impulsa la sangre por arterias, venas y capilares."}, {"id": 40, "t": 8, "ref": "34", "q": ["¿Cuáles son las cuatro cavidades cardíacas?", "¿Qué distribución de cámaras permite recibir y expulsar sangre?", "Un esquema cardíaco tiene dos cámaras superiores receptoras y dos inferiores impulsoras. ¿Cómo se clasifican?"], "a": "Dos aurículas y dos ventrículos", "d": ["Cuatro aurículas", "Cuatro ventrículos", "Dos arterias y dos venas"], "e": "El corazón tiene aurículas derecha e izquierda y ventrículos derecho e izquierdo."}, {"id": 41, "t": 8, "ref": "35", "q": ["¿Qué sucede durante la diástole ventricular?", "¿Qué fase permite el llenado ventricular?", "En un ciclo cardíaco, la presión ventricular disminuye y entra sangre desde las aurículas. ¿Qué fase se representa?"], "a": "Relajación y llenado", "d": ["Contracción y eyección", "Cierre permanente de válvulas", "Formación de eritrocitos"], "e": "Durante la diástole ventricular, los ventrículos se relajan y se llenan de sangre."}, {"id": 42, "t": 8, "ref": "36", "q": ["¿Qué sucede durante la sístole ventricular?", "¿Qué fase impulsa sangre a las grandes arterias?", "La presión ventricular aumenta y se abren las válvulas de salida. ¿Qué fase general describe el esquema?"], "a": "Contracción y expulsión de sangre", "d": ["Relajación y llenado", "Producción de linfa", "Absorción intestinal"], "e": "La sístole ventricular es contracción; cuando la presión supera la arterial se abren las válvulas semilunares y se eyecta sangre."}, {"id": 43, "t": 8, "ref": "37", "q": ["¿Por qué válvulas sale sangre en la eyección ventricular?", "¿Qué válvulas se abren en la fase de eyección?", "Las válvulas auriculoventriculares están cerradas y la sangre sale hacia arteria pulmonar y aorta. ¿Qué par está abierto durante la eyección?"], "a": "Pulmonar y aórtica", "d": ["Mitral y tricúspide", "Mitral y aórtica", "Tricúspide y pulmonar"], "e": "Las válvulas semilunares pulmonar y aórtica permiten la salida de los ventrículos derecho e izquierdo respectivamente."}, {"id": 44, "t": 8, "ref": "38", "q": ["¿Cómo se llaman los glóbulos rojos?", "¿Qué células transportan la mayor parte del oxígeno sanguíneo?", "Un componente sanguíneo contiene hemoglobina y lleva oxígeno a los tejidos. ¿Cuál es?"], "a": "Eritrocitos", "d": ["Leucocitos", "Trombocitos", "Linfocitos"], "e": "Los eritrocitos o hematíes transportan oxígeno gracias a la hemoglobina y participan en el transporte de CO₂."}, {"id": 45, "t": 8, "ref": "39", "q": ["¿Qué color tiene normalmente la sangre más oxigenada?", "¿Qué aspecto diferencia la sangre con mayor oxigenación de la menos oxigenada?", "Un dibujo usa azul para una vena, pero la sangre real no es azul. ¿Qué color corresponde a la sangre más oxigenada?"], "a": "Rojo brillante", "d": ["Azul", "Verde", "Rojo más oscuro"], "e": "La sangre oxigenada es rojo brillante y la menos oxigenada rojo oscuro; arterias y venas se definen por dirección, con excepciones pulmonares a la regla de oxigenación."}, {"id": 46, "t": 8, "ref": "40", "q": ["¿Cuáles son los principales componentes de la sangre?", "¿Qué conjunto incluye la parte líquida y los elementos formes?", "Tras separar sangre, se distingue plasma y elementos formes. ¿Qué lista reúne sus componentes principales?"], "a": "Plasma, eritrocitos, leucocitos y plaquetas", "d": ["Linfa, neuronas y osteocitos", "Plasma, bilis y saliva", "Hormonas, cartílago y músculo"], "e": "La sangre tiene plasma (aprox. 55%) y elementos formes (aprox. 45%): eritrocitos, leucocitos y plaquetas."}, {"id": 47, "t": 9, "ref": "41", "q": ["¿Qué transporta el sistema linfático?", "¿Qué líquido circula por vasos linfáticos?", "El exceso de líquido intersticial entra a una red que lo devuelve a la circulación. ¿Qué líquido recibe ese nombre dentro de los vasos?"], "a": "Linfa", "d": ["Bilis", "Orina", "Jugo gástrico"], "e": "La red linfática devuelve líquido intersticial a la circulación y participa en la defensa inmunitaria."}, {"id": 48, "t": 9, "ref": "42", "q": ["¿Dónde maduran los linfocitos T?", "¿Qué órgano participa en la maduración de células T?", "Una célula T inmadura se somete a procesos de selección antes de circular. ¿Qué órgano se asocia con esto?"], "a": "Timo", "d": ["Bazo", "Hígado", "Páncreas"], "e": "El timo es un órgano linfoide donde maduran y se seleccionan linfocitos T."}, {"id": 49, "t": 9, "ref": "43", "q": ["¿Qué órgano filtra sangre y retira eritrocitos envejecidos?", "¿Qué órgano linfático actúa como filtro de la sangre?", "Un órgano linfoide elimina glóbulos rojos dañados y responde a antígenos sanguíneos. ¿Cuál es?"], "a": "Bazo", "d": ["Timo", "Tiroides", "Vesícula biliar"], "e": "El bazo filtra sangre, elimina eritrocitos viejos y participa en respuestas inmunes."}, {"id": 50, "t": 9, "ref": "44", "q": ["¿Qué linfocitos originan células productoras de anticuerpos?", "¿Qué población se vincula con la respuesta humoral específica?", "Una respuesta inmunitaria genera células plasmáticas que secretan anticuerpos. ¿De qué linfocitos proceden?"], "a": "Linfocitos B", "d": ["Linfocitos T citotóxicos", "Eritrocitos", "Plaquetas"], "e": "Los linfocitos B pueden diferenciarse en células plasmáticas productoras de anticuerpos."}, {"id": 51, "t": 9, "ref": "45", "q": ["¿Qué linfocitos coordinan respuestas o destruyen células infectadas según el subtipo?", "¿Qué población incluye subtipos colaboradores y citotóxicos?", "En una infección viral, ciertas células reconocen y eliminan células infectadas. ¿Qué grupo incluye ese subtipo?"], "a": "Linfocitos T", "d": ["Eritrocitos", "Plaquetas", "Osteoblastos"], "e": "Los T colaboradores coordinan respuestas; los T citotóxicos destruyen células infectadas o alteradas."}, {"id": 52, "t": 10, "ref": "46", "q": ["¿Qué produce el sistema endocrino para regular funciones corporales?", "¿Qué mensajeros regulan metabolismo, crecimiento y reproducción?", "Una glándula libera una sustancia a sangre que modifica la actividad de células distantes. ¿Qué tipo de señal es?"], "a": "Hormonas", "d": ["Bilis", "Orina", "Plaquetas"], "e": "Las glándulas endocrinas liberan hormonas que actúan como señales químicas y regulan funciones corporales."}, {"id": 53, "t": 10, "ref": "47", "q": ["¿Cuál de estas estructuras es una glándula endocrina?", "¿Qué órgano del cuello forma parte del sistema endocrino?", "Un esquema pide seleccionar una estructura que secreta hormonas a sangre, entre conductos y huesos. ¿Cuál?"], "a": "Tiroides", "d": ["Esófago", "Uréter", "Fémur"], "e": "Entre las estructuras endocrinas figuran hipófisis, pineal, tiroides, paratiroides, suprarrenales, páncreas y gónadas; el hipotálamo tiene función neuroendocrina."}, {"id": 54, "t": 10, "ref": "48", "q": ["¿Qué grupo se conoce popularmente como sustancias de la felicidad?", "¿Qué conjunto de sustancias se relaciona popularmente con el bienestar y la recompensa?", "Un estudiante prepara una ficha de las cuatro sustancias popularmente vinculadas con bienestar, sin clasificarlas todas como hormonas. ¿Qué lista corresponde?"], "a": "Dopamina, serotonina, endorfinas y oxitocina", "d": ["Insulina, glucagón, tiroxina y cortisol", "Estrógenos, progesterona, insulina y melatonina", "Adrenalina, aldosterona, glucagón y prolactina"], "e": "Se utiliza la expresión popular «hormonas de la felicidad» para estas sustancias; incluye neurotransmisores y neuropéptidos, no una clasificación endocrina formal."}, {"id": 55, "t": 10, "ref": "49", "q": ["¿Qué hormona ayuda a disminuir la glucosa sanguínea?", "¿Qué hormona favorece la entrada de glucosa a células sensibles?", "Después de una comida aumenta la glucosa sanguínea; una señal pancreática favorece su captación y almacenamiento. ¿Cuál?"], "a": "Insulina", "d": ["Glucagón", "Adrenalina", "Cortisol"], "e": "La insulina favorece la captación de glucosa en tejidos sensibles y su almacenamiento, contribuyendo a reducir la glucemia."}, {"id": 56, "t": 10, "ref": "50", "q": ["¿Cuáles son las gónadas femeninas?", "¿Qué glándulas combinan función reproductiva femenina y endocrina?", "Una estructura secreta hormonas sexuales y participa en la maduración de ovocitos. ¿Qué órgano es?"], "a": "Ovarios", "d": ["Trompas uterinas", "Útero", "Hipófisis"], "e": "Los ovarios producen ovocitos y hormonas sexuales, como estrógenos y progesterona."}, {"id": 57, "t": 10, "ref": "51", "q": ["¿Cuáles son las gónadas masculinas?", "¿Qué glándulas sexuales masculinas poseen función endocrina?", "Una glándula produce testosterona y también gametos masculinos. ¿Cuál?"], "a": "Testículos", "d": ["Próstata", "Suprarrenales", "Vesículas seminales"], "e": "Los testículos producen espermatozoides y testosterona."}, {"id": 58, "t": 10, "ref": "52", "q": ["¿Qué dos hormonas se destacan en la reproducción femenina?", "¿Qué par se relaciona especialmente con el ciclo ovárico y uterino?", "Un esquema vincula cambios ováricos y endometriales con dos hormonas sexuales. ¿Qué par corresponde?"], "a": "Estrógenos y progesterona", "d": ["Insulina y glucagón", "Adrenalina y cortisol", "Tiroxina y calcitonina"], "e": "Estrógenos y progesterona intervienen en regulación del ciclo y cambios endometriales; también existen en otros sexos."}, {"id": 59, "t": 10, "ref": "53", "q": ["¿Qué glándulas se ubican encima de los riñones?", "¿Qué glándulas endocrinas se localizan en el polo superior de cada riñón?", "En un esquema renal se observan dos estructuras glandulares encima de los riñones. ¿Cómo se denominan?"], "a": "Suprarrenales", "d": ["Paratiroides", "Hipófisis", "Pineal"], "e": "Las suprarrenales se sitúan sobre los riñones; no son parte del tejido renal."}, {"id": 60, "t": 11, "ref": "54", "q": ["¿Qué integra el sistema óseo o esquelético?", "¿Qué conjunto forma la estructura de sostén corporal?", "Un modelo incluye piezas rígidas, cartílago y uniones entre huesos. ¿Qué componentes representa?"], "a": "Huesos, cartílagos y articulaciones", "d": ["Arterias, venas y capilares", "Músculos, neuronas y glándulas", "Riñones, uréteres y vejiga"], "e": "El sistema esquelético proporciona soporte, protección y movimiento en conjunto con músculos y articulaciones."}, {"id": 61, "t": 11, "ref": "55", "q": ["¿Qué células forman hueso nuevo?", "¿Qué célula se especializa en sintetizar matriz ósea?", "En remodelación ósea, una célula deposita matriz después de la reabsorción. ¿Cuál es?"], "a": "Osteoblastos", "d": ["Osteoclastos", "Eritrocitos", "Melanocitos"], "e": "Osteoblastos forman matriz ósea; osteocitos mantienen tejido maduro y osteoclastos reabsorben hueso."}, {"id": 62, "t": 11, "ref": "55", "q": ["¿Qué células reabsorben tejido óseo?", "¿Qué célula retira matriz ósea durante el recambio?", "En un modelo de remodelación, una fase elimina matriz antigua antes de formar nueva. ¿Qué célula ejecuta la eliminación?"], "a": "Osteoclastos", "d": ["Osteoblastos", "Osteocitos", "Linfocitos B"], "e": "Los osteoclastos degradan matriz ósea durante la remodelación; los osteoblastos forman hueso."}, {"id": 63, "t": 11, "ref": "56", "q": ["¿Cuál es el hueso más largo del cuerpo?", "¿Qué hueso se extiende entre la cadera y la rodilla?", "En un esqueleto, se busca el hueso del muslo, más largo que tibia y húmero. ¿Cuál es?"], "a": "Fémur", "d": ["Húmero", "Tibia", "Radio"], "e": "El fémur se ubica en el muslo y es el hueso más largo del cuerpo humano."}, {"id": 64, "t": 11, "ref": "57", "q": ["¿Cómo se llama la primera vértebra cervical?", "¿Qué vértebra articula con el cráneo y corresponde a C1?", "En un modelo cervical, la vértebra inmediatamente inferior al cráneo está marcada C1. ¿Qué nombre recibe?"], "a": "Atlas", "d": ["Axis", "Sacro", "Cóccix"], "e": "Atlas es C1, sostiene el cráneo; axis es C2."}, {"id": 65, "t": 11, "ref": "58", "q": ["¿Cuántos huesos comprende el cráneo incluyendo la cara?", "¿Qué total resulta de reunir neurocráneo y esqueleto facial?", "Un modelo separa ocho huesos craneales de catorce faciales. ¿Cuál es el total de ambos grupos?"], "a": "22", "d": ["8", "14", "27"], "e": "El cráneo completo tiene 22 huesos: 8 del neurocráneo y 14 faciales, sin contar huesecillos del oído."}, {"id": 66, "t": 11, "ref": "58", "q": ["¿Qué hueso forma la frente?", "¿Qué hueso se localiza por encima de las órbitas en la frente?", "Al etiquetar el cráneo, la zona anterior superior de la cara, encima de los ojos, ¿qué hueso corresponde?"], "a": "Frontal", "d": ["Occipital", "Temporal", "Parietal"], "e": "Frontal: frente; parietales: techo y lados; temporales: región lateral; occipital: parte posterior; esfenoides y etmoides: base y zonas profundas."}, {"id": 67, "t": 11, "ref": "59", "q": ["¿Cuántos huesos tiene típicamente el esqueleto adulto?", "¿Qué cantidad de referencia se usa para el esqueleto adulto?", "Una ficha compara el número de huesos adultos con músculos y vértebras. ¿Qué cifra corresponde al esqueleto?"], "a": "206", "d": ["650", "33", "120"], "e": "El esqueleto adulto típico tiene 206 huesos; puede haber variaciones anatómicas."}, {"id": 68, "t": 11, "ref": "60", "q": ["¿Qué función tiene el sistema óseo?", "¿Qué función explica que el cráneo proteja al cerebro y las costillas al tórax?", "Una estructura sostiene el cuerpo y protege órganos; también almacena calcio. ¿Qué conjunto funcional la describe mejor?"], "a": "Soporte, protección y colaboración en movimiento", "d": ["Absorción intestinal de glucosa", "Producción de bilis", "Conducción de orina"], "e": "Además de soporte, protección y movimiento, almacena minerales y aloja médula que produce células sanguíneas."}, {"id": 69, "t": 11, "ref": "61", "q": ["¿Cuántas vértebras se describen típicamente antes de considerar fusiones?", "¿Qué total típico se obtiene contando segmentos sacros y coccígeos por separado?", "Una tabla suma 7 cervicales, 12 torácicas, 5 lumbares, 5 sacras y 4 coccígeas. ¿Cuál es el total de segmentos?"], "a": "33", "d": ["26", "206", "22"], "e": "7 cervicales, 12 torácicas, 5 lumbares, 5 sacras y típicamente 4 coccígeas. En el adulto se cuentan 26 huesos vertebrales incluyendo sacro y cóccix fusionados."}, {"id": 70, "t": 11, "ref": "62", "q": ["¿Cómo se agrupan los huesos de una mano?", "¿Qué grupos corresponden a muñeca, palma y dedos?", "En un modelo de mano se separan 8 huesos de muñeca, 5 de palma y 14 de dedos. ¿Qué grupos son?"], "a": "Carpo, metacarpo y falanges", "d": ["Tarso, metatarso y falanges", "Radio, cúbito y húmero", "Frontal, parietal y temporal"], "e": "Una mano tiene 27 huesos: 8 del carpo, 5 metacarpianos y 14 falanges. El pulgar tiene dos falanges."}, {"id": 71, "t": 12, "ref": "63", "q": ["¿Qué órganos realizan principalmente la filtración sanguínea para producir orina?", "¿Qué órganos forman orina y ayudan al equilibrio de líquidos?", "Una estructura del sistema urinario regula electrolitos y elimina desechos de la sangre, a diferencia de la vejiga. ¿Cuál?"], "a": "Riñones", "d": ["Uréteres", "Vejiga", "Uretra"], "e": "Los riñones filtran sangre y regulan agua, electrolitos y desechos; el resto de las vías transporta o almacena orina."}, {"id": 72, "t": 12, "ref": "64", "q": ["¿Cuál es la función principal de los riñones?", "¿Qué proceso distingue a los riñones de los órganos de transporte urinario?", "Un esquema distingue filtración y formación de orina de su almacenamiento y expulsión. ¿Qué función pertenece al riñón?"], "a": "Filtrar sangre y producir orina", "d": ["Almacenar orina", "Transportar orina al exterior", "Producir bilis"], "e": "Los riñones regulan también presión arterial y eritropoyesis; filtran, reabsorben y secretan sustancias para formar orina."}, {"id": 73, "t": 12, "ref": "63", "q": ["¿Qué conductos llevan orina de los riñones a la vejiga?", "¿Qué estructuras conectan riñones con vejiga?", "Al seguir el flujo urinario, ¿qué conductos aparecen inmediatamente después de los riñones y antes de la vejiga?"], "a": "Uréteres", "d": ["Uretra", "Conductos deferentes", "Arterias renales"], "e": "Los uréteres transportan orina hacia la vejiga, donde se almacena antes de salir por la uretra."}, {"id": 74, "t": 12, "ref": "63", "q": ["¿Qué órgano almacena temporalmente la orina?", "¿Qué estructura recibe orina de los uréteres?", "En el recorrido renal, la orina se acumula antes de salir. ¿Qué órgano funciona como reservorio?"], "a": "Vejiga urinaria", "d": ["Riñón", "Uréter", "Uretra"], "e": "La vejiga almacena orina; los riñones la forman y la uretra la conduce al exterior."}, {"id": 75, "t": 13, "ref": "V", "q": ["¿Cómo se llama la posición acostada boca arriba?", "¿Qué posición apoya la espalda en una superficie horizontal?", "En una ilustración la persona está horizontal, mirando al techo, sin inclinación de la camilla. ¿Qué posición representa?"], "a": "Decúbito supino o dorsal", "d": ["Decúbito prono", "Sims", "Genupectoral"], "e": "Supino: acostado sobre la espalda con cara hacia arriba.", "img": "supino"}, {"id": 76, "t": 13, "ref": "V", "q": ["¿Cómo se llama la posición acostada boca abajo?", "¿Qué posición apoya la cara anterior del tronco?", "Una figura está horizontal, con abdomen hacia la superficie y cabeza girada. ¿Cómo se clasifica?"], "a": "Decúbito prono o ventral", "d": ["Decúbito supino", "Fowler", "Litotomía"], "e": "Prono: acostado sobre la parte anterior del cuerpo.", "img": "prono"}, {"id": 77, "t": 13, "ref": "V", "q": ["¿Cómo se llama la posición acostada sobre un costado?", "¿Qué posición se describe por el lado del cuerpo apoyado?", "Un esquema muestra hombro y cadera del mismo lado apoyados; la persona no está semiprona. ¿Qué posición corresponde?"], "a": "Decúbito lateral", "d": ["Decúbito supino", "Trendelenburg", "Fowler"], "e": "Lateral: se apoya el costado derecho o izquierdo del cuerpo.", "img": "lateral"}, {"id": 78, "t": 13, "ref": "V", "q": ["¿Qué posición eleva el respaldo para dejar al paciente semisentado?", "¿Qué posición se caracteriza por la flexión del tronco respecto a la camilla?", "Una persona descansa con respaldo elevado, tronco semisentado y piernas apoyadas. ¿Qué familia de posición corresponde?"], "a": "Fowler", "d": ["Trendelenburg", "Decúbito prono", "Genupectoral"], "e": "Fowler: tronco elevado; semifowler suele corresponder a menor ángulo. Ambas posiciones se distinguen por el ángulo del respaldo.", "img": "fowler"}, {"id": 79, "t": 13, "ref": "V", "q": ["¿Qué posición es semiprona con la pierna superior flexionada?", "¿Qué postura lateral se distingue por flexión de la pierna superior y rotación hacia prono?", "Una figura está de lado, ligeramente hacia adelante, con la rodilla superior flexionada. ¿Qué posición es?"], "a": "Sims", "d": ["Decúbito supino", "Litotomía", "Fowler"], "e": "Sims o inglesa: posición lateral semiprona, con pierna superior flexionada.", "img": "sims"}, {"id": 80, "t": 13, "ref": "V", "q": ["¿Qué posición tiene piernas flexionadas y separadas en pierneras?", "¿Qué posición presenta apoyo dorsal y piernas elevadas en soportes?", "Un esquema muestra a una persona en supino con las piernas flexionadas, separadas y apoyadas en pierneras. ¿Qué postura representa?"], "a": "Litotomía o ginecológica", "d": ["Fowler", "Genupectoral", "Trendelenburg"], "e": "Litotomía: acostado boca arriba con caderas y rodillas flexionadas y piernas separadas, normalmente sostenidas.", "img": "litotomia"}, {"id": 81, "t": 13, "ref": "V", "q": ["¿Qué posición inclina el cuerpo con la cabeza más baja que los pies?", "¿Qué inclinación de una camilla produce descenso relativo de la cabeza?", "La camilla se inclina en bloque sin flexionar el tronco, dejando pies más altos que cabeza. ¿Qué postura es?"], "a": "Trendelenburg", "d": ["Antitrendelenburg", "Fowler", "Decúbito lateral"], "e": "Trendelenburg: cuerpo inclinado, cabeza más baja que los pies.", "img": "trend"}, {"id": 82, "t": 13, "ref": "V", "q": ["¿Qué posición inclina el cuerpo con la cabeza más alta que los pies?", "¿Qué postura invierte la inclinación de Trendelenburg?", "A diferencia de Fowler, toda la camilla se inclina sin doblar el tronco y la cabeza queda elevada. ¿Cuál es?"], "a": "Antitrendelenburg o Morestin", "d": ["Trendelenburg", "Litotomía", "Sims"], "e": "Antitrendelenburg: inclinación en bloque opuesta a Trendelenburg; cabeza más elevada."}, {"id": 83, "t": 13, "ref": "V", "q": ["¿Qué posición apoya rodillas y pecho, con cadera elevada?", "¿Qué posición combina apoyo de rodillas y tórax?", "Un esquema muestra a una persona arrodillada, con el pecho bajo y la cadera elevada. ¿Qué posición representa?"], "a": "Genupectoral", "d": ["Sims", "Fowler", "Supino"], "e": "Genupectoral o mahometana: apoyo de rodillas y pecho, con pelvis elevada.", "img": "genu"}, {"id": 84, "t": 14, "ref": "V", "q": ["¿Qué plano divide el cuerpo en derecha e izquierda?", "¿Qué plano separa porciones laterales derecha e izquierda?", "Una sección vertical atraviesa el cuerpo de adelante hacia atrás, separando ambos lados. ¿Qué plano es?"], "a": "Sagital", "d": ["Frontal", "Transversal", "Oblicuo"], "e": "El plano sagital divide derecha e izquierda; solo el sagital medio divide en mitades iguales."}, {"id": 85, "t": 14, "ref": "V", "q": ["¿Qué plano divide el cuerpo en anterior y posterior?", "¿Qué plano separa pecho y espalda en porciones anterior y posterior?", "Una sección vertical es paralela a la frente y divide el cuerpo en una porción ventral y otra dorsal. ¿Qué plano corresponde?"], "a": "Frontal o coronal", "d": ["Sagital", "Transversal", "Sagital medio"], "e": "El frontal o coronal separa parte anterior de posterior."}, {"id": 86, "t": 14, "ref": "V", "q": ["¿Qué plano divide el cuerpo en superior e inferior?", "¿Qué plano genera cortes horizontales del cuerpo?", "Una imagen tomográfica representa una sección horizontal del abdomen con estructuras arriba y abajo del corte. ¿Qué plano es?"], "a": "Transversal u horizontal", "d": ["Sagital", "Frontal", "Oblicuo"], "e": "El transversal divide porciones superior e inferior; es perpendicular al eje longitudinal del cuerpo."}, {"id": 87, "t": 14, "ref": "V", "q": ["¿Qué plano sagital divide en mitades derecha e izquierda iguales?", "¿Cómo se llama un corte sagital exactamente sobre la línea media?", "Dos cortes son verticales y separan derecha e izquierda; solo uno pasa por el centro exacto. ¿Qué nombre recibe ese corte?"], "a": "Sagital medio", "d": ["Parasagital", "Frontal", "Transversal"], "e": "El plano medio pasa por la línea media; otros planos sagitales pueden dividir porciones desiguales."}, {"id": 88, "t": 15, "ref": "V", "q": ["¿Qué región abdominal está arriba a la derecha del paciente?", "¿Qué región superior lateral se asocia con hígado y vesícula biliar?", "En una cuadrícula frontal, la casilla superior izquierda del observador corresponde al lado derecho del paciente. ¿Qué región es?"], "a": "Hipocondrio derecho", "d": ["Hipocondrio izquierdo", "Epigastrio", "Fosa ilíaca derecha"], "e": "El hipocondrio derecho se sitúa en la región superior derecha y contiene gran parte del hígado y vesícula biliar.", "region": 0}, {"id": 89, "t": 15, "ref": "V", "q": ["¿Qué región abdominal está arriba en el centro?", "¿Qué región se sitúa entre ambos hipocondrios?", "Una casilla está en la fila superior central del esquema de nueve regiones, por encima del ombligo. ¿Cuál?"], "a": "Epigastrio", "d": ["Mesogastrio", "Hipogastrio", "Flanco derecho"], "e": "El epigastrio está entre hipocondrios, asociado a parte del estómago y páncreas.", "region": 1}, {"id": 90, "t": 15, "ref": "V", "q": ["¿Qué región superior izquierda se asocia con el bazo?", "¿Qué región contiene el bazo principalmente?", "En una cuadrícula vista de frente, el bazo se proyecta en la casilla superior derecha del observador. ¿Qué región del paciente es?"], "a": "Hipocondrio izquierdo", "d": ["Hipocondrio derecho", "Fosa ilíaca izquierda", "Hipogastrio"], "e": "El hipocondrio izquierdo se asocia con bazo y parte del estómago.", "region": 2}, {"id": 91, "t": 15, "ref": "V", "q": ["¿Cómo se llama la región media derecha?", "¿Qué región se asocia al colon ascendente en el esquema de nueve regiones?", "La casilla derecha del paciente a la altura del ombligo corresponde a la región lateral media. ¿Cuál es?"], "a": "Flanco derecho", "d": ["Flanco izquierdo", "Epigastrio", "Fosa ilíaca derecha"], "e": "Flanco derecho o lumbar derecha: región media lateral derecha, asociada al colon ascendente.", "region": 3}, {"id": 92, "t": 15, "ref": "V", "q": ["¿Cómo se llama la región central a la altura del ombligo?", "¿Qué región se ubica entre ambos flancos?", "En la cuadrícula abdominal, la intersección de la fila central y columna central contiene el ombligo. ¿Qué región es?"], "a": "Mesogastrio o umbilical", "d": ["Epigastrio", "Hipogastrio", "Hipocondrio izquierdo"], "e": "El mesogastrio es la región umbilical central; contiene asas intestinales.", "region": 4}, {"id": 93, "t": 15, "ref": "V", "q": ["¿Cómo se llama la región media izquierda?", "¿Qué región lateral media se asocia con el colon descendente?", "Una etiqueta se coloca en la casilla media derecha del observador, a la altura umbilical. ¿Qué región del paciente corresponde?"], "a": "Flanco izquierdo", "d": ["Flanco derecho", "Fosa ilíaca izquierda", "Epigastrio"], "e": "Flanco izquierdo o lumbar izquierda: se asocia al colon descendente.", "region": 5}, {"id": 94, "t": 15, "ref": "V", "q": ["¿Qué región inferior derecha se asocia con el apéndice?", "¿En qué región se proyecta habitualmente el ciego?", "En la cuadrícula de nueve regiones, el apéndice suele proyectarse abajo del lado derecho del paciente. ¿Qué región es?"], "a": "Fosa ilíaca derecha", "d": ["Fosa ilíaca izquierda", "Hipogastrio", "Hipocondrio derecho"], "e": "La fosa ilíaca derecha o inguinal derecha se asocia con ciego y apéndice.", "region": 6}, {"id": 95, "t": 15, "ref": "V", "q": ["¿Qué región inferior está en la línea media?", "¿Qué región se encuentra entre las fosas ilíacas?", "En un esquema, la casilla inferior central está por debajo del ombligo y entre las regiones inguinales. ¿Cuál?"], "a": "Hipogastrio", "d": ["Epigastrio", "Mesogastrio", "Flanco izquierdo"], "e": "Hipogastrio o región púbica: zona inferior central asociada a vejiga y estructuras pélvicas.", "region": 7}, {"id": 96, "t": 15, "ref": "V", "q": ["¿Qué región inferior izquierda se asocia con colon sigmoide?", "¿Qué región inferior lateral se asocia al sigmoide?", "La casilla inferior derecha del observador, en una figura anterior, representa la región inferior izquierda del paciente. ¿Cuál?"], "a": "Fosa ilíaca izquierda", "d": ["Fosa ilíaca derecha", "Hipocondrio izquierdo", "Epigastrio"], "e": "La fosa ilíaca izquierda se asocia al colon sigmoide y estructuras pélvicas izquierdas.", "region": 8}, {"id": 97, "t": 1, "ref": "Ampliación", "q": ["¿Qué condiciones ambientales promovió Nightingale?", "¿Qué medidas relaciona su enfoque ambiental con el bienestar?", "En un caso de historia de enfermería, se estudian aire limpio y saneamiento. ¿Qué medidas ejemplifican su enfoque?"], "a": "Ventilación y limpieza", "d": ["Inmovilidad permanente", "Ayuno sistemático", "Aislamiento social indiscriminado"], "e": "Nightingale destacó el ambiente saludable, la higiene y la ventilación.", "supplemental": true}, {"id": 98, "t": 1, "ref": "Ampliación", "q": ["¿Qué objetivo central persigue el modelo de Henderson?", "¿Qué busca recuperar el cuidado cuando la persona conserva capacidades?", "Una estudiante reconoce que una persona puede vestirse sola con apoyo mínimo. ¿Qué objetivo del modelo está favoreciendo?"], "a": "Independencia de la persona", "d": ["Dependencia permanente", "Diagnóstico exclusivamente médico", "Aplicación uniforme de técnicas"], "e": "El modelo procura conservar o recuperar la independencia según las capacidades de cada persona.", "supplemental": true}, {"id": 99, "t": 1, "ref": "Ampliación", "q": ["¿Cómo se llama la finalidad de reducir riesgos de enfermedad?", "¿Qué dimensión del cuidado intenta evitar la aparición de problemas de salud?", "En educación sanitaria se explican hábitos para disminuir riesgos de infección. ¿Qué finalidad se trabaja principalmente?"], "a": "Prevención", "d": ["Rehabilitación", "Diagnóstico etiológico", "Tratamiento farmacológico"], "e": "La prevención procura reducir el riesgo de enfermedad; la rehabilitación busca recuperar capacidades.", "supplemental": true}, {"id": 100, "t": 1, "ref": "Ampliación", "q": ["¿Qué actividades permiten dar seguimiento al cuidado?", "¿Qué herramientas ayudan a evaluar cambios en el estado de una persona?", "Una enfermera compara observaciones de distintos días para valorar la evolución. ¿Qué elementos hacen posible esa comparación?"], "a": "Observación y registro", "d": ["Memorización sin aplicación", "Atención sin seguimiento", "Improvisación de procedimientos"], "e": "La observación sistemática y el registro permiten comunicar y valorar cambios.", "supplemental": true}, {"id": 101, "t": 2, "ref": "Ampliación", "q": ["¿Qué estructuras transmiten fuerza de muchos músculos al hueso?", "¿Qué conecta habitualmente un músculo esquelético con su inserción ósea?", "Al estudiar el movimiento del codo, se identifica la estructura que transmite tensión muscular al hueso. ¿Cuál es?"], "a": "Tendones", "d": ["Ligamentos", "Cartílago articular", "Médula ósea"], "e": "Los tendones son tejido conectivo que transmite la fuerza muscular; los ligamentos conectan huesos entre sí.", "supplemental": true}, {"id": 102, "t": 2, "ref": "Ampliación", "q": ["¿Cómo se llama la disminución del ángulo entre segmentos articulares?", "¿Qué movimiento acerca los segmentos de una articulación como el codo?", "Al llevar la mano hacia el hombro doblando el codo, ¿qué movimiento predomina?"], "a": "Flexión", "d": ["Extensión", "Abducción", "Rotación"], "e": "La flexión disminuye el ángulo articular; la extensión lo aumenta.", "supplemental": true}, {"id": 103, "t": 2, "ref": "Ampliación", "q": ["¿Qué nombre recibe la disminución del tamaño muscular?", "¿Cuál es la adaptación opuesta a la hipertrofia en cuanto al volumen de fibras?", "Tras un periodo de desuso se describe pérdida de volumen muscular. ¿Cómo se denomina ese cambio?"], "a": "Atrofia", "d": ["Hipertrofia", "Hiperplasia", "Contracción"], "e": "La atrofia implica reducción del tamaño del tejido o de sus células.", "supplemental": true}, {"id": 104, "t": 3, "ref": "Ampliación", "q": ["¿Qué sustancia producida por el hígado ayuda a dispersar grasas?", "¿Qué secreción facilita la emulsificación de lípidos intestinales?", "Al estudiar absorción de grasas, se distingue una sustancia que no es enzima y que produce el hígado. ¿Cuál es?"], "a": "Bilis", "d": ["Saliva", "Insulina", "Ácido clorhídrico"], "e": "La bilis emulsifica grasas y facilita su digestión; la vesícula la almacena y concentra.", "supplemental": true}, {"id": 105, "t": 3, "ref": "Ampliación", "q": ["¿Qué estructuras aumentan la superficie de absorción intestinal?", "¿Qué especializaciones permiten mayor contacto del epitelio intestinal con nutrientes?", "Una ilustración del intestino delgado muestra proyecciones superficiales repetidas. ¿Qué estructuras explican su capacidad de absorción?"], "a": "Vellosidades y microvellosidades", "d": ["Pliegues de la vejiga", "Alvéolos pulmonares", "Conductos pancreáticos"], "e": "Vellosidades y microvellosidades amplían la superficie de intercambio del intestino delgado.", "supplemental": true}, {"id": 106, "t": 3, "ref": "Ampliación", "q": ["¿Qué órgano transporta el bolo desde la faringe hacia el estómago?", "¿Por qué tubo avanza el alimento antes de llegar al estómago?", "Tras deglutir, el bolo sigue por un tubo muscular que utiliza peristaltismo. ¿Cuál?"], "a": "Esófago", "d": ["Tráquea", "Uréter", "Conducto deferente"], "e": "El esófago conduce el bolo a través de ondas musculares coordinadas.", "supplemental": true}, {"id": 107, "t": 3, "ref": "Ampliación", "q": ["¿Qué segmento digestivo recupera agua y participa en la formación de heces?", "¿Dónde se compacta el contenido intestinal no absorbido?", "Después de la absorción principal de nutrientes, el residuo entra en un órgano que recupera agua. ¿Cuál?"], "a": "Intestino grueso", "d": ["Esófago", "Vesícula biliar", "Páncreas"], "e": "El intestino grueso absorbe agua y electrolitos y contribuye a formar heces.", "supplemental": true}, {"id": 108, "t": 4, "ref": "Ampliación", "q": ["¿Qué hormona secreta especialmente el cuerpo lúteo?", "¿Qué señal hormonal favorece la transformación secretora endometrial tras la ovulación?", "En la fase lútea, ¿qué hormona ovárica predomina en la preparación secretora del endometrio?"], "a": "Progesterona", "d": ["Insulina", "Adrenalina", "Melatonina"], "e": "La progesterona producida por el cuerpo lúteo participa en la fase secretora del endometrio.", "supplemental": true}, {"id": 109, "t": 5, "ref": "Ampliación", "q": ["¿Dónde maduran funcionalmente los espermatozoides tras salir del testículo?", "¿Qué estructura conecta la salida testicular con el conducto deferente?", "En el recorrido reproductor, los gametos pasan por un conducto donde adquieren características funcionales. ¿Cuál?"], "a": "Epidídimo", "d": ["Próstata", "Uréter", "Vesícula biliar"], "e": "El epidídimo participa en maduración y almacenamiento de espermatozoides.", "supplemental": true}, {"id": 110, "t": 5, "ref": "Ampliación", "q": ["¿Qué células testiculares sintetizan testosterona?", "¿Qué células endocrinas se sitúan entre los túbulos seminíferos?", "Una ilustración señala tejido intersticial del testículo relacionado con LH y producción hormonal. ¿Qué células busca?"], "a": "Células de Leydig", "d": ["Células de Sertoli", "Osteoblastos", "Melanocitos"], "e": "Las células de Leydig producen testosterona y responden principalmente a LH.", "supplemental": true}, {"id": 111, "t": 5, "ref": "Ampliación", "q": ["¿En qué estructuras testiculares se forman espermatozoides?", "¿Dónde ocurre la espermatogénesis dentro del testículo?", "Un esquema distingue el sitio de formación de gametos del sitio de transporte. ¿Cuál corresponde a la formación?"], "a": "Túbulos seminíferos", "d": ["Conductos deferentes", "Uréteres", "Conductos biliares"], "e": "Los túbulos seminíferos alojan células germinales y de Sertoli.", "supplemental": true}, {"id": 112, "t": 5, "ref": "Ampliación", "q": ["¿Qué glándula rodea parte de la uretra masculina?", "¿Qué órgano puede afectar el flujo urinario cuando aumenta de tamaño?", "Se estudia una glándula que contribuye al semen y se relaciona anatómicamente con la uretra. ¿Cuál?"], "a": "Próstata", "d": ["Epidídimo", "Vejiga urinaria", "Escroto"], "e": "La próstata aporta secreciones al semen y rodea una porción de la uretra.", "supplemental": true}, {"id": 113, "t": 6, "ref": "Ampliación", "q": ["¿Qué orgánulo contribuye de forma importante a producir ATP?", "¿Qué estructura celular se relaciona con la respiración aeróbica?", "Una célula muscular necesita mantener actividad energética elevada. ¿Qué orgánulo contribuye a suministrar ATP?"], "a": "Mitocondria", "d": ["Lisosoma", "Aparato de Golgi", "Núcleo"], "e": "Las mitocondrias realizan procesos metabólicos que contribuyen a la síntesis de ATP.", "supplemental": true}, {"id": 114, "t": 6, "ref": "Ampliación", "q": ["¿Qué compartimento contiene la mayor parte del ADN de una célula humana nucleada?", "¿Dónde se conserva la información cromosómica en una célula eucariota típica?", "Un dibujo muestra cromosomas dentro de una estructura rodeada por una envoltura. ¿Qué estructura es?"], "a": "Núcleo", "d": ["Membrana plasmática", "Ribosoma", "Lisosoma"], "e": "El núcleo contiene los cromosomas en la mayoría de las células humanas.", "supplemental": true}, {"id": 115, "t": 6, "ref": "Ampliación", "q": ["¿Qué estructura regula el intercambio entre la célula y su entorno?", "¿Qué límite celular permite transporte selectivo de sustancias?", "Al estudiar difusión y transporte activo hacia el exterior celular, ¿qué estructura se analiza?"], "a": "Membrana plasmática", "d": ["Matriz ósea", "Pared intestinal", "Envoltura nuclear"], "e": "La membrana plasmática delimita la célula y regula intercambios con el medio.", "supplemental": true}, {"id": 116, "t": 6, "ref": "Ampliación", "q": ["¿Cómo se llama un mecanismo regulado de muerte celular?", "¿Qué proceso contribuye a retirar células mediante señales controladas?", "Durante el mantenimiento de un tejido, determinadas células se eliminan mediante un programa regulado. ¿Qué proceso describe?"], "a": "Apoptosis", "d": ["Hipertrofia", "Difusión", "Fecundación"], "e": "La apoptosis es una forma regulada de muerte celular importante en el equilibrio de tejidos.", "supplemental": true}, {"id": 117, "t": 7, "ref": "Ampliación", "q": ["¿Qué células predominan en la epidermis?", "¿Qué células forman gran parte de la barrera epitelial cutánea?", "Una muestra de la capa externa de la piel presenta células productoras de queratina. ¿Cómo se llaman?"], "a": "Queratinocitos", "d": ["Eritrocitos", "Osteoclastos", "Linfocitos B"], "e": "Los queratinocitos son el tipo celular predominante de la epidermis.", "supplemental": true}, {"id": 118, "t": 7, "ref": "Ampliación", "q": ["¿Qué fibras contribuyen a las propiedades mecánicas de la dermis?", "¿Qué componentes dérmicos se relacionan con resistencia y elasticidad?", "Al estudiar la capacidad de la piel para resistir tensión y recuperar forma, ¿qué proteínas destacan en la dermis?"], "a": "Colágeno y elastina", "d": ["Hemoglobina y fibrinógeno", "Insulina y glucagón", "Dopamina y serotonina"], "e": "Colágeno y elastina participan en resistencia y elasticidad del tejido conectivo.", "supplemental": true}, {"id": 119, "t": 7, "ref": "Ampliación", "q": ["¿Qué tejido bajo la dermis ayuda a aislar y amortiguar?", "¿Qué componente de la hipodermis contribuye a la protección mecánica y térmica?", "Un esquema muestra una capa profunda rica en grasa. ¿Qué tejido representa?"], "a": "Tejido adiposo subcutáneo", "d": ["Epidermis", "Capa córnea", "Lecho ungueal"], "e": "El tejido adiposo subcutáneo participa en aislamiento, amortiguación y reserva energética.", "supplemental": true}, {"id": 120, "t": 7, "ref": "Ampliación", "q": ["¿Qué función cutánea ayuda a regular la temperatura corporal?", "¿Qué proceso se favorece mediante sudoración y cambios del flujo sanguíneo cutáneo?", "Cuando el organismo disipa calor por la superficie corporal, ¿qué función de la piel participa?"], "a": "Termorregulación", "d": ["Hematopoyesis", "Espermatogénesis", "Filtración glomerular"], "e": "La piel contribuye a la regulación térmica mediante sudoración y cambios vasculares.", "supplemental": true}, {"id": 121, "t": 8, "ref": "Ampliación", "q": ["¿Qué vasos llevan sangre oxigenada de los pulmones a la aurícula izquierda?", "¿Por dónde regresa la sangre de la circulación pulmonar al corazón izquierdo?", "En un esquema se sigue la sangre desde los pulmones hasta la aurícula izquierda. ¿Qué vasos corresponden a ese tramo?"], "a": "Venas pulmonares", "d": ["Arterias pulmonares", "Venas cavas", "Arteria renal"], "e": "Las venas pulmonares conducen sangre desde los pulmones a la aurícula izquierda.", "supplemental": true}, {"id": 122, "t": 9, "ref": "Ampliación", "q": ["¿Qué estructuras examinan la linfa y contienen células inmunitarias?", "¿Qué órganos se encuentran distribuidos a lo largo de vasos linfáticos?", "Una figura muestra pequeños órganos interpuestos en el recorrido de la linfa. ¿Cuáles son?"], "a": "Ganglios linfáticos", "d": ["Válvulas cardíacas", "Túbulos renales", "Glándulas salivales"], "e": "Los ganglios linfáticos contienen células que participan en vigilancia y respuesta inmunitaria.", "supplemental": true}, {"id": 123, "t": 9, "ref": "Ampliación", "q": ["¿Qué célula derivada de linfocitos B secreta anticuerpos?", "¿Qué tipo celular realiza la secreción abundante de inmunoglobulinas?", "Un linfocito B activado se diferencia en una célula especializada en secretar anticuerpos. ¿Cuál?"], "a": "Célula plasmática", "d": ["Eritrocito maduro", "Plaqueta", "Osteocito"], "e": "Las células plasmáticas derivan de linfocitos B y producen anticuerpos.", "supplemental": true}, {"id": 124, "t": 9, "ref": "Ampliación", "q": ["¿Dónde se originan los precursores de linfocitos T?", "¿De qué tejido parten los precursores que después maduran en el timo?", "Un esquema distingue el origen de precursores T de su maduración tímica. ¿Qué tejido indica el origen?"], "a": "Médula ósea", "d": ["Páncreas", "Estómago", "Dermis"], "e": "Los precursores de linfocitos T se originan en la médula ósea y maduran en el timo.", "supplemental": true}, {"id": 125, "t": 9, "ref": "Ampliación", "q": ["¿Qué componente del bazo retira eritrocitos envejecidos?", "¿Qué región esplénica participa especialmente en el procesamiento de glóbulos rojos?", "Una descripción histológica del bazo menciona recuperación de componentes de eritrocitos. ¿Qué región se relaciona?"], "a": "Pulpa roja", "d": ["Pulpa blanca", "Corteza renal", "Corteza suprarrenal"], "e": "La pulpa roja esplénica participa en la eliminación de eritrocitos envejecidos.", "supplemental": true}, {"id": 126, "t": 10, "ref": "Ampliación", "q": ["¿Qué hormona pancreática ayuda a elevar la disponibilidad de glucosa durante el ayuno?", "¿Qué hormona contrarregula parte de los efectos de insulina?", "Durante el ayuno, ¿qué señal pancreática favorece la disponibilidad de glucosa a partir de reservas?"], "a": "Glucagón", "d": ["Insulina", "Melatonina", "Oxitocina"], "e": "El glucagón contribuye a mantener glucemia durante el ayuno, entre otros mecanismos mediante acciones hepáticas.", "supplemental": true}, {"id": 127, "t": 12, "ref": "Ampliación", "q": ["¿Cuál es la unidad funcional del riñón?", "¿Qué estructura integra filtración glomerular y procesamiento tubular?", "Un diagrama renal muestra glomérulo y túbulos asociados. ¿Cómo se llama esta unidad?"], "a": "Nefrona", "d": ["Alvéolo", "Vellosidad intestinal", "Osteona"], "e": "La nefrona comprende el corpúsculo renal y túbulos que procesan el filtrado.", "supplemental": true}, {"id": 128, "t": 12, "ref": "Ampliación", "q": ["¿Qué estructura renal inicia la filtración del plasma?", "¿En qué red capilar se forma el filtrado renal inicial?", "Una ilustración señala capilares dentro de la cápsula glomerular. ¿Qué estructura es?"], "a": "Glomérulo", "d": ["Vejiga", "Uréter", "Uretra"], "e": "El glomérulo es una red capilar en la que se produce la filtración inicial.", "supplemental": true}, {"id": 129, "t": 12, "ref": "Ampliación", "q": ["¿Qué proceso devuelve agua y sustancias útiles desde los túbulos a la sangre?", "¿Qué etapa permite recuperar parte del filtrado renal?", "En un esquema, glucosa y agua pasan del líquido tubular hacia el medio interno. ¿Qué proceso representa?"], "a": "Reabsorción tubular", "d": ["Secreción tubular", "Micción", "Peristaltismo"], "e": "La reabsorción tubular recupera sustancias desde el líquido tubular hacia la sangre.", "supplemental": true}, {"id": 130, "t": 12, "ref": "Ampliación", "q": ["¿Qué proceso traslada solutos desde el medio interno hacia el líquido tubular?", "¿Qué mecanismo complementa la filtración al incorporar determinadas sustancias al túbulo?", "En un diagrama renal se observa un soluto que se mueve desde la sangre hacia el líquido tubular. ¿Qué proceso es?"], "a": "Secreción tubular", "d": ["Reabsorción tubular", "Deglución", "Ventilación"], "e": "La secreción tubular incorpora sustancias al líquido tubular, mientras la reabsorción las recupera.", "supplemental": true}, {"id": 131, "t": 12, "ref": "Ampliación", "q": ["¿Qué conducto permite la salida de orina desde la vejiga?", "¿Qué estructura comunica la vejiga con el exterior?", "En el recorrido de la orina, se busca el conducto posterior al almacenamiento vesical. ¿Cuál es?"], "a": "Uretra", "d": ["Uréter", "Nefrona", "Glomérulo"], "e": "La uretra conduce la orina desde la vejiga hacia el exterior.", "supplemental": true}, {"id": 132, "t": 14, "ref": "Ampliación", "q": ["¿Qué término indica proximidad a la línea media?", "¿Cómo se describe una estructura más cercana al plano medio?", "Comparados con los hombros, los puntos próximos al esternón se sitúan en dirección principalmente ¿qué?"], "a": "Medial", "d": ["Lateral", "Distal", "Inferior"], "e": "Medial indica cercanía a la línea media de referencia.", "supplemental": true}, {"id": 133, "t": 14, "ref": "Ampliación", "q": ["¿Qué término indica alejamiento de la línea media?", "¿Cómo se describe una estructura ubicada hacia un costado respecto al plano medio?", "En posición anatómica, los hombros están a ambos lados del esternón. ¿Qué relación expresa esa ubicación?"], "a": "Lateral", "d": ["Medial", "Proximal", "Superior"], "e": "Lateral significa situado más lejos de la línea media.", "supplemental": true}, {"id": 134, "t": 14, "ref": "Ampliación", "q": ["¿Cómo se llama un plano sagital que no pasa por la línea media?", "¿Qué plano paralelo al sagital medio divide el cuerpo en porciones derechas e izquierdas desiguales?", "Se realiza un corte vertical de adelante hacia atrás, desplazado respecto al centro corporal. ¿Qué plano es?"], "a": "Parasagital", "d": ["Coronal", "Transversal", "Sagital medio"], "e": "Un plano parasagital es paralelo al sagital medio, pero no pasa por la línea media.", "supplemental": true}, {"id": 135, "t": 14, "ref": "Ampliación", "q": ["¿Qué porciones distingue un plano coronal?", "¿Qué regiones separa un corte frontal?", "Un corte vertical de lado a lado separa la parte de delante de la parte de atrás. ¿Qué porciones resultan?"], "a": "Anterior y posterior", "d": ["Derecha e izquierda", "Superior e inferior", "Proximal y distal"], "e": "El plano coronal separa porciones anterior y posterior.", "supplemental": true}, {"id": 136, "t": 14, "ref": "Ampliación", "q": ["¿Qué porciones separa el plano transversal?", "¿Qué regiones distingue un corte perpendicular al eje longitudinal corporal?", "En una serie de cortes axiales, se observan secciones a diferentes alturas. ¿Qué porciones divide cada corte?"], "a": "Superior e inferior", "d": ["Anterior y posterior", "Derecha e izquierda", "Medial y lateral"], "e": "El plano transversal divide el cuerpo en porciones superior e inferior.", "supplemental": true}];
const GUIDE=[{"n": 1, "q": "¿Qué enfermera pionera recibió el sobrenombre de la Dama de la Lámpara?", "a": "Florence Nightingale, pionera de la enfermería moderna; recorría hospitales por la noche con una lámpara.", "t": 1}, {"n": 2, "q": "¿Quién propuso un modelo de cuidado basado en catorce necesidades humanas?", "a": "Virginia Henderson organizó el cuidado en torno a 14 necesidades básicas y a la independencia de la persona.", "t": 1}, {"n": 3, "q": "Identifica la norma mexicana que regula la práctica de la enfermería.", "a": "La NOM-019-SSA3-2013 trata la práctica de enfermería en el Sistema Nacional de Salud mexicano; fue publicada en el DOF el 2 de septiembre de 2013.", "t": 1}, {"n": 4, "q": "Describe el propósito y el alcance de la enfermería.", "a": "Cuidados autónomos y en colaboración para personas, familias y comunidades, sanas o enfermas; promoción de la salud, prevención de enfermedad y cuidado de personas enfermas, con discapacidad o al final de la vida.", "t": 1}, {"n": 5, "q": "¿Cuál es la cantidad aproximada de músculos esqueléticos del cuerpo?", "a": "Se suelen mencionar unos 650 músculos esqueléticos; el número varía según la clasificación.", "t": 2}, {"n": 6, "q": "¿Cómo se denomina la disciplina que estudia los músculos?", "a": "La miología estudia el sistema muscular; la osteología estudia los huesos.", "t": 2}, {"n": 7, "q": "Clasifica el tejido muscular en sus tres tipos principales.", "a": "El esquelético es estriado y generalmente voluntario, el liso involuntario y no estriado, y el cardíaco estriado e involuntario. El músculo liso genera movimientos involuntarios en vísceras, como el peristaltismo intestinal.", "t": 2}, {"n": 8, "q": "Explica qué significa hipertrofia muscular.", "a": "La hipertrofia es el incremento de tamaño de las fibras musculares; no equivale a hiperplasia.", "t": 2}, {"n": 9, "q": "¿Qué distingue al músculo del corazón de los otros tejidos musculares?", "a": "El miocardio posee células estriadas ramificadas, usualmente con un núcleo central (a veces dos), y contracción involuntaria rítmica.", "t": 2}, {"n": 10, "q": "Explica para qué sirve el aparato digestivo.", "a": "La digestión descompone alimentos, facilita la absorción y elimina residuos no absorbidos.", "t": 3}, {"n": 11, "q": "¿En qué parte del cuerpo comienza la digestión de los alimentos?", "a": "La digestión empieza en la boca por masticación y acción de la saliva.", "t": 3}, {"n": 12, "q": "¿En qué órgano se absorben principalmente los azúcares de la dieta?", "a": "La mayor absorción de nutrientes, incluidos monosacáridos, ocurre en el intestino delgado.", "t": 3}, {"n": 13, "q": "¿En qué cuadrante abdominal se localiza la mayor parte del hígado?", "a": "El hígado ocupa principalmente el cuadrante superior derecho; en nueve regiones, hipocondrio derecho y parte del epigastrio.", "t": 3}, {"n": 14, "q": "Nombra el movimiento que impulsa el contenido a través del intestino.", "a": "El peristaltismo son ondas coordinadas de contracción muscular que desplazan el contenido del tubo digestivo.", "t": 3}, {"n": 15, "q": "¿Cuáles son las dos grandes divisiones de los genitales femeninos?", "a": "Los genitales internos incluyen ovarios, trompas, útero y vagina; los externos forman la vulva.", "t": 4}, {"n": 16, "q": "Enumera las estructuras internas y externas del aparato reproductor femenino.", "a": "Internos: ovarios, trompas uterinas, útero y vagina. Externos: monte del pubis, labios mayores y menores, clítoris y vestíbulo (orificios uretral y vaginal).", "t": 4}, {"n": 17, "q": "Explica el papel de las trompas uterinas en la reproducción.", "a": "Las trompas (salpinges) transportan el ovocito hacia el útero; la fecundación suele ocurrir en la ampolla tubárica.", "t": 4}, {"n": 18, "q": "¿Con qué frecuencia suele producirse la ovulación durante los ciclos menstruales?", "a": "Habitualmente un ovocito ovula una vez por ciclo; 28 días es una referencia, no una duración universal.", "t": 4}, {"n": 19, "q": "¿Cuáles son las dos capas principales del endometrio?", "a": "La capa basal permanece y regenera la funcional; esta última se desprende durante la menstruación.", "t": 4}, {"n": 20, "q": "Resume las fases del ciclo menstrual e indica cuándo ocurre la ovulación.", "a": "menstruación (día 1), fase folicular, ovulación alrededor del día 14, fase lútea y nuevo sangrado si no hay embarazo. No todos los ciclos duran 28 días.", "t": 4}, {"n": 21, "q": "¿Qué órganos producen los espermatozoides y la testosterona?", "a": "Los testículos producen espermatozoides y testosterona; el epidídimo participa en maduración y almacenamiento.", "t": 5}, {"n": 22, "q": "Describe la función de los conductos deferentes.", "a": "Los deferentes conducen espermatozoides desde el epidídimo hacia los conductos eyaculadores.", "t": 5}, {"n": 23, "q": "¿Cómo se llama el conducto que permite expulsar la orina al exterior?", "a": "La uretra comunica la vejiga con el exterior; los uréteres conducen orina desde los riñones a la vejiga.", "t": 5}, {"n": 24, "q": "Identifica el órgano copulador masculino y su función reproductiva.", "a": "El pene es el órgano copulador; deposita semen habitualmente en la vagina, no directamente en el útero.", "t": 5}, {"n": 25, "q": "Da dos ejemplos de enfermedades o alteraciones del aparato reproductor masculino.", "a": "La hiperplasia prostática benigna es crecimiento no maligno de la próstata; la prostatitis es inflamación. Otros ejemplos: varicocele y criptorquidia.", "t": 5}, {"n": 26, "q": "Define la célula como unidad de los seres vivos.", "a": "La célula es la unidad básica estructural y funcional; los tejidos se forman por células y componentes asociados.", "t": 6}, {"n": 27, "q": "Explica las funciones vitales generales de las células.", "a": "Las células obtienen nutrientes y energía, responden a estímulos y, según su tipo, pueden dividirse.", "t": 6}, {"n": 28, "q": "Distingue los tipos principales de células según su organización.", "a": "Procariotas (sin núcleo membranoso) y eucariotas (con núcleo membranoso; animales y vegetales).", "t": 6}, {"n": 29, "q": "Enumera la epidermis, la dermis y el tejido situado por debajo de ellas en orden anatómico.", "a": "Epidermis, dermis e hipodermis (tejido subcutáneo asociado).", "t": 7}, {"n": 30, "q": "¿Qué sustancia determina gran parte del color de la piel y qué células la producen?", "a": "La melanina es producida por melanocitos y participa en la pigmentación y protección frente a radiación UV. Los melanocitos producen melanina; los queratinocitos reciben pigmento, entre otras funciones.", "t": 7}, {"n": 31, "q": "¿Todas las células viven el mismo tiempo? Explica con ejemplos.", "a": "La vida celular depende del tipo: epitelio intestinal, pocos días; epidermis, semanas; eritrocitos, unos 120 días; muchas neuronas, décadas.", "t": 6}, {"n": 32, "q": "Da dos ejemplos de alteraciones relacionadas con las células.", "a": "El cáncer implica proliferación celular desregulada; la anemia falciforme altera la hemoglobina y la forma de eritrocitos.", "t": 6}, {"n": 33, "q": "Enumera los elementos que integran el sistema cardiovascular.", "a": "El corazón impulsa la sangre por arterias, venas y capilares.", "t": 8}, {"n": 34, "q": "Identifica las cuatro cámaras cardíacas.", "a": "Aurícula derecha, aurícula izquierda, ventrículo derecho y ventrículo izquierdo.", "t": 8}, {"n": 35, "q": "Describe lo que sucede en el corazón durante la diástole.", "a": "Durante la diástole ventricular, los ventrículos se relajan y se llenan de sangre.", "t": 8}, {"n": 36, "q": "Explica qué sucede durante la sístole ventricular.", "a": "La sístole ventricular es contracción; cuando la presión supera la arterial se abren las válvulas semilunares y se eyecta sangre.", "t": 8}, {"n": 37, "q": "¿Qué válvulas y vasos permiten la salida de sangre de los ventrículos durante su contracción?", "a": "Las válvulas semilunares pulmonar y aórtica permiten la salida de los ventrículos derecho e izquierdo respectivamente.", "t": 8}, {"n": 38, "q": "Indica el nombre alternativo de los glóbulos rojos y su función principal.", "a": "Los eritrocitos o hematíes transportan oxígeno gracias a la hemoglobina y participan en el transporte de CO₂.", "t": 8}, {"n": 39, "q": "Compara el color y la oxigenación habitual de la sangre arterial y venosa en la circulación sistémica.", "a": "En circulación sistémica, la sangre arterial suele ser rojo brillante y más rica en oxígeno; la venosa, rojo oscuro, con menos oxígeno y más CO₂. La sangre no es azul; hay excepciones pulmonares.", "t": 8}, {"n": 40, "q": "Enumera los componentes principales de la sangre.", "a": "La sangre tiene plasma (aprox. 55%) y elementos formes (aprox. 45%): eritrocitos, leucocitos y plaquetas.", "t": 8}, {"n": 41, "q": "Describe qué es la red linfática y cuál es su importancia.", "a": "La red linfática devuelve líquido intersticial a la circulación y participa en la defensa inmunitaria.", "t": 9}, {"n": 42, "q": "¿Qué papel tiene el timo en el sistema inmunitario?", "a": "El timo es un órgano linfoide donde maduran y se seleccionan linfocitos T.", "t": 9}, {"n": 43, "q": "Explica las funciones principales del bazo.", "a": "El bazo filtra sangre, elimina eritrocitos viejos y participa en respuestas inmunes.", "t": 9}, {"n": 44, "q": "¿Qué tipo de defensa proporcionan los linfocitos B?", "a": "Los linfocitos B pueden diferenciarse en células plasmáticas productoras de anticuerpos.", "t": 9}, {"n": 45, "q": "¿Cuáles son las funciones principales de los linfocitos T?", "a": "Los T colaboradores coordinan respuestas; los T citotóxicos destruyen células infectadas o alteradas.", "t": 9}, {"n": 46, "q": "Define el sistema endocrino y explica cómo se comunica con el organismo.", "a": "Las glándulas endocrinas liberan hormonas que actúan como señales químicas y regulan funciones corporales.", "t": 10}, {"n": 47, "q": "Identifica las principales glándulas y estructuras endocrinas.", "a": "Principales glándulas y estructuras endocrinas: hipotálam
