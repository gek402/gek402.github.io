como huesos accesorios. La cifra 206 es la referencia convencional del adulto típico. Para entenderla, ubica grupos óseos en lugar de memorizar un inventario sin organización.", "El sacro se forma por fusión de cinco segmentos; en el adulto se cuenta habitualmente como un hueso.", "206 = cifra típica adulta, no un número invariable para todas las personas."], "60": ["El esqueleto proporciona soporte y forma, protege órganos y permite movimiento mediante articulaciones y músculos. Sus minerales, especialmente calcio y fosfato, contribuyen a la resistencia y funcionan como reserva regulable. La médula ósea roja contiene células que producen eritrocitos, leucocitos y plaquetas; la médula amarilla contiene más tejido adiposo. Los huesos también se remodelan en respuesta a cargas y señales hormonales. El sistema óseo, por tanto, participa en funciones mecánicas y metabólicas.\n\nLos huesos protegen encéfalo, médula espinal y órganos torácicos, mientras actúan como palancas movidas por músculos. Su matriz almacena calcio y fosfato, que pueden intercambiarse con el medio interno bajo regulación hormonal. En la médula roja se forman células sanguíneas; la amarilla contiene abundante grasa. La forma y composición de cada hueso se relacionan con sus cargas y funciones. Un hueso largo de la extremidad y uno plano del cráneo tienen diseños distintos porque enfrentan demandas diferentes.", "El cráneo protege encéfalo, las costillas protegen órganos torácicos y la médula ósea produce células sanguíneas.", "Soporte, protección, movimiento, reserva mineral y formación sanguínea."], "61": ["La columna vertebral sostiene el tronco, protege la médula espinal y permite movilidad. Se organiza en 7 cervicales (cuello), 12 torácicas o dorsales (articuladas con costillas), 5 lumbares (zona baja), 5 sacras y habitualmente 4 coccígeas. En conjunto se reconocen 33 segmentos típicos; en el adulto, sacras y coccígeas se cuentan como sacro y cóccix, de modo que suelen reconocerse 26 huesos. Los discos intervertebrales entre muchas vértebras ayudan a distribuir cargas y permitir movilidad.\n\nLas vértebras cervicales son siete, las torácicas doce y las lumbares cinco. En la región sacra, cinco segmentos suelen fusionarse; el cóccix suele originarse de cuatro, con variaciones. Los discos intervertebrales entre muchas vértebras distribuyen cargas y permiten movilidad. El canal vertebral protege la médula espinal y estructuras nerviosas. No confundas número de segmentos con número de huesos independientes en el adulto: la fusión explica la diferencia entre 33 vértebras típicas y 26 piezas óseas vertebrales.", "Si preguntan segmentos, suma 7+12+5+5+4. Si preguntan huesos adultos tras fusión, 24 vértebras libres más sacro y cóccix.", "Cervical 7, torácica 12, lumbar 5, sacra 5, coccígea 4."], "62": ["Cada mano tiene típicamente 27 huesos. Los ocho del carpo forman la muñeca: escafoides, semilunar, piramidal, pisiforme, trapecio, trapezoide, grande y ganchoso. Los cinco metacarpianos forman la palma y se numeran desde pulgar hasta meñique. Las catorce falanges forman los dedos; cada dedo posee proximal, media y distal, excepto el pulgar, que posee proximal y distal. Articulaciones, tendones y músculos permiten combinar agarre fuerte con movimientos finos.\n\nLos huesos del carpo se organizan en dos filas y permiten movilidad de la muñeca. Los metacarpianos se numeran desde el pulgar hacia el meñique y forman el soporte de la palma. Las falanges corresponden a los dedos: proximal, media y distal, excepto el pulgar, que carece de falange media. Esta disposición permite agarre y movimientos finos, especialmente la oposición del pulgar. Para estudiar una imagen, identifica primero muñeca, palma y dedos y luego enumera los huesos de cada grupo.", "Cuenta falanges: cuatro dedos con tres huesos cada uno y un pulgar con dos, total 14.", "8 carpo + 5 metacarpo + 14 falanges = 27 por mano."], "63": ["El aparato urinario elimina sustancias de desecho y contribuye a mantener composición y volumen de líquidos corporales. Los riñones filtran sangre y ajustan el contenido del filtrado para formar orina. Cada uréter transporta orina a la vejiga mediante contracciones musculares; la vejiga la almacena y la uretra permite expulsarla. El agua y sustancias útiles pueden regresar a sangre durante la formación de orina. El sistema también participa en equilibrio ácido-base y electrolitos.\n\nEl aparato urinario contiene dos riñones, uréteres, vejiga y uretra. Los riñones forman orina; los uréteres la transportan mediante contracciones musculares; la vejiga la almacena temporalmente y la uretra permite su salida. Al regular agua y solutos, los riñones contribuyen al volumen sanguíneo y al equilibrio ácido-base. También participan en señalización hormonal. La eliminación urinaria no equivale a expulsar alimentos no digeridos por el intestino: elimina sustancias que fueron incorporadas o generadas en el medio interno.", "Sigue el recorrido de la orina desde donde se produce hasta donde sale: riñón, uréter, vejiga, uretra.", "Riñones producen; uréteres transportan; vejiga almacena; uretra expulsa."], "64": ["La nefrona es la unidad funcional renal. El glomérulo filtra parte del plasma hacia la cápsula glomerular. En los túbulos ocurre reabsorción de agua y sustancias útiles hacia la sangre y secreción de determinadas sustancias hacia el filtrado. El contenido restante forma orina y fluye a conductos colectores. Los riñones regulan electrolitos, equilibrio ácido-base y volumen; producen eritropoyetina, que estimula la formación de eritrocitos, y participan en regulación de presión arterial. Filtrar no equivale a eliminar todo el filtrado.\n\nLa filtración glomerular produce un líquido a partir del plasma, reteniendo normalmente células y gran parte de proteínas. En los túbulos, la reabsorción devuelve agua y sustancias útiles a la sangre y la secreción transfiere otros solutos hacia el líquido tubular. Los conductos colectores participan en la regulación de la concentración de orina. La hormona antidiurética y la aldosterona influyen en algunos de estos mecanismos. La orina final es resultado de procesos selectivos y no simplemente sangre filtrada sin modificación.", "La glucosa filtrada normalmente se recupera casi por completo; muchos desechos se eliminan en orina.", "Filtración → reabsorción y secreción → excreción."], "v75": ["El decúbito supino o dorsal describe una persona acostada sobre la espalda, con la superficie anterior del cuerpo orientada hacia arriba. El occipucio, espalda y parte posterior de extremidades se relacionan con la superficie de apoyo. La postura sirve como referencia anatómica para reconocer la orientación anterior y posterior. Las variantes pueden modificar la posición de brazos, piernas o cabeza sin dejar de ser supinas. En contextos de atención, su selección y adaptación dependen de las necesidades de la persona y de la supervisión profesional.\n\nPara reconocer esta postura, observa que la región posterior del tronco descansa sobre la superficie y que rostro, tórax y abdomen se orientan hacia arriba. La posición puede presentar variantes según flexión de extremidades, pero su referencia principal sigue siendo el apoyo dorsal. No es lo mismo que la posición anatómica estándar, que describe a una persona de pie. En una ilustración lateral, identifica primero la dirección del rostro y la superficie corporal apoyada antes de elegir el nombre.", "Observa una figura acostada con rostro hacia el techo y espalda apoyada. Aunque flexione las rodillas, sigue siendo supina si conserva esa orientación.", "Supino = dorsal = boca arriba."], "v76": ["En decúbito prono o ventral, la cara anterior del tronco se orienta hacia la superficie de apoyo. La espalda queda visible hacia arriba. Se diferencia del supino por cuál superficie corporal descansa sobre la camilla. La cabeza puede estar girada o apoyada de forma especializada según el contexto; esa variación no cambia la orientación principal. Existen variantes clínicas que requieren equipo y vigilancia, por lo que la identificación en imágenes no debe interpretarse como instrucción para colocar pacientes.\n\nEl apoyo ventral permite diferenciarla del decúbito dorsal, incluso cuando el dibujo se presenta desde arriba o con la cabeza girada. El giro del cuello por sí solo no define la postura: importa la orientación general del tórax y abdomen. Puede haber variaciones de brazos y piernas sin cambiar la clasificación básica. Cuando se emplean posturas en atención clínica, la selección requiere valorar respiración, movilidad y seguridad de la persona; el objetivo de este mini tema es identificar la forma anatómica.", "Si la espalda se ve arriba y el abdomen hacia la superficie, identifica prono, aunque la cabeza esté girada.", "Prono = ventral = boca abajo."], "v77": ["El decúbito lateral describe una persona acostada sobre uno de los costados. Se denomina derecho o izquierdo según el lado del paciente que se apoya, no según la posición del observador. Las extremidades pueden estar extendidas o ligeramente flexionadas. Su orientación principal es lateral, a diferencia de las posturas supina y prona. En atención sanitaria, las variantes de apoyo se seleccionan de acuerdo con la situación clínica y medidas de seguridad.\n\nEl lado se nombra según el costado del paciente que está apoyado, no según la ubicación de la figura en la pantalla. Una imagen puede mostrar caderas y rodillas extendidas o flexionadas; estas variaciones no cambian el decúbito si el tronco permanece lateral. En cambio, una rotación marcada hacia adelante puede aproximarse a Sims. Practica imaginar al paciente de frente y luego acostado de lado para reconocer cuál superficie corporal descansa en la cama.", "Si el hombro y la cadera derechos están abajo, se trata de decúbito lateral derecho.", "Nombra el lado apoyado, no el lado visible."], "v78": ["Fowler es una postura con el tronco elevado respecto a la superficie horizontal. Puede presentarse con piernas extendidas o rodillas flexionadas. Semifowler utiliza una elevación menor, habitualmente alrededor de 30 a 45 grados; Fowler suele describirse con un ángulo mayor, aunque las convenciones varían entre materiales. Lo importante al identificarla es observar la flexión o elevación del respaldo y del tronco. No es igual que antitrendelenburg, donde la superficie completa se inclina en bloque.\n\nLa característica de Fowler es elevar el tronco respecto a la horizontal, mientras la superficie inferior puede conservar una disposición distinta. Las denominaciones semifowler, Fowler y Fowler alta suelen distinguirse según el grado de elevación y las convenciones del material docente. No se identifica únicamente por tener las rodillas flexionadas. Si todo el cuerpo se inclina como un bloque sin doblarse a nivel de la cadera, puede corresponder a otra postura. Observa la articulación del respaldo en el esquema.", "En una imagen, si la espalda está elevada por un respaldo y el resto de la camilla permanece más horizontal, piensa en Fowler.", "Fowler eleva el tronco; antitrendelenburg inclina el cuerpo completo."], "v79": ["La posición de Sims, también llamada inglesa o semiprona, combina orientación lateral con cierto giro hacia la parte anterior. Habitualmente la pierna superior está flexionada y adelantada respecto a la inferior. Esto permite distinguirla de un decúbito lateral simple, en el que el tronco se mantiene más directamente sobre el costado. La figura suele mostrar asimetría de las piernas. La denominación puede encontrarse asociada a procedimientos supervisados, pero aquí se estudia la identificación visual.\n\nEn Sims el tronco se aproxima a una posición lateral con rotación anterior, y una de las piernas suele estar más flexionada que la otra. La asimetría de extremidades ayuda a distinguirla del decúbito lateral simple. No equivale a un prono completo, porque el apoyo se distribuye de forma diferente. En materiales de enfermería pueden aparecer variantes de la postura, por lo que conviene reconocer sus características principales en vez de memorizar un único dibujo con los mismos ángulos.", "Compara dos imágenes: una con ambas piernas alineadas de lado y otra con la pierna superior adelantada y tronco semiprono. La segunda corresponde a Sims.", "Sims = lateral semiprona con pierna superior flexionada."], "v80": ["La posición de litotomía, o ginecológica, parte de una orientación dorsal, con caderas y rodillas flexionadas y piernas separadas. Las extremidades inferiores pueden estar sostenidas por soportes especializados. Es una postura anatómica diferenciada por la configuración de pelvis y piernas, no por la orientación de la cabeza. Se utiliza en ciertos contextos de exploración y procedimientos; su aplicación clínica requiere supervisión, cuidado de articulaciones y protección de la dignidad de la persona.\n\nEn una ilustración de litotomía se aprecia la orientación dorsal del tronco y la disposición separada de extremidades inferiores flexionadas. Los soportes para piernas son una pista visual frecuente, aunque pueden variar según el contexto. La posición se diferencia de Fowler porque no se define por elevar el respaldo. También se distingue del supino básico por la disposición específica de las piernas. La identificación de la postura no autoriza realizar procedimientos ni movilizaciones sin capacitación y supervisión apropiadas.", "En una figura, reconoce espalda apoyada y ambas piernas flexionadas y separadas, normalmente sostenidas.", "Litotomía = dorsal con caderas y rodillas flexionadas y piernas separadas."], "v81": ["Trendelenburg se reconoce por la inclinación del cuerpo completo sobre una superficie, de manera que la cabeza queda más baja que los pies. La persona suele estar en orientación supina. A diferencia de Fowler, no se trata simplemente de flexionar el respaldo: se inclina el plano de apoyo. El término describe la orientación espacial, no una indicación universal de tratamiento. Su empleo clínico depende de valoración profesional y no debe reproducirse sin supervisión.\n\nTrendelenburg describe una inclinación con la cabeza situada a un nivel inferior al de los pies. El plano de apoyo suele inclinarse globalmente, lo que la diferencia de una postura en la que solo se modifica el respaldo o se elevan las piernas. Para distinguirla de la variante inversa, imagina una línea horizontal y compara ambos extremos del cuerpo. No deduzcas que una postura es un tratamiento universal a partir de su nombre: su uso clínico depende de indicaciones y protocolos.", "Imagina una camilla inclinada como una rampa: si el extremo de la cabeza está abajo, corresponde a Trendelenburg.", "Trendelenburg: cabeza abajo, pies arriba."], "v82": ["Antitrendelenburg, también llamada Morestin en algunos materiales, utiliza la inclinación inversa a Trendelenburg. El cuerpo se mantiene sobre un plano inclinado con la cabeza más elevada que los pies. A diferencia de Fowler, el tronco y las piernas siguen en gran medida el mismo plano. La diferencia entre ambas posturas se entiende observando si existe un ángulo localizado en el respaldo o una inclinación de toda la superficie. La aplicación clínica exige valoración y supervisión.\n\nLa inclinación inversa eleva la región cefálica con respecto a los pies mientras mantiene el cuerpo sobre una superficie inclinada. Se diferencia de Fowler porque en esta última el tronco se eleva habitualmente mediante una articulación del respaldo. En algunos esquemas ambos extremos de la cama pueden verse poco claros: utiliza la dirección de la pendiente para identificarla. El nombre antitrendelenburg expresa precisamente una relación opuesta a Trendelenburg, por lo que memorizar ambas como pareja facilita distinguirlas.", "Si una camilla entera está inclinada con cabeza arriba, es antitrendelenburg; si solo se eleva el respaldo, piensa en Fowler.", "Anti = inclinación opuesta a Trendelenburg."], "v83": ["Genupectoral significa apoyo de rodillas y pecho; el término combina referencias a la rodilla y región pectoral. La pelvis queda elevada en relación con el tórax, y el cuerpo presenta flexión de las extremidades inferiores. Se distingue del prono porque la persona no queda extendida horizontalmente sobre el abdomen. En diagramas, la clave es observar puntos de apoyo y altura de la pelvis. Su uso clínico es específico y requiere supervisión profesional.\n\nEl término genu se relaciona con rodilla y pectoral con el pecho. En la figura característica, las rodillas y la parte anterior superior del tronco se aproximan al plano de apoyo, mientras la pelvis permanece elevada. Esto la diferencia de una persona en cuatro apoyos con el pecho levantado. También se distingue del prono porque la cadera no descansa plana. Para reconocer posturas, separa tres criterios: superficie apoyada, inclinación del cuerpo y flexión relativa de las extremidades.", "Identifica una figura apoyada sobre rodillas y pecho con cadera elevada, en lugar de una figura extendida boca abajo.", "Genu = rodilla; pectoral = pecho."], "v84": ["Un plano anatómico es una superficie imaginaria que permite describir cortes y relaciones espaciales del cuerpo. Los planos sagitales son verticales y separan porciones derecha e izquierda. Si el corte coincide con la línea media se llama sagital medio o mediano; si está desplazado lateralmente puede llamarse parasagital. No todos los cortes sagitales producen mitades iguales. Esta referencia se utiliza para estudiar estructuras y comprender imágenes anatómicas.\n\nUn corte sagital puede atravesar la línea media o situarse paralelo a ella. En ambos casos separa porciones derecha e izquierda, aunque solo el sagital medio produce mitades de referencia. La orientación se define respecto a la posición anatómica y no cambia si el paciente se encuentra acostado. Las imágenes médicas pueden mostrar cortes sagitales de estructuras como columna o encéfalo. Imaginar un plano vertical que avanza desde adelante hacia atrás ayuda a recordar esta división.", "Imagina una lámina vertical que atraviesa el cuerpo de delante hacia atrás y separa derecha de izquierda.", "Sagital: derecha e izquierda, no anterior y posterior."], "v85": ["El plano frontal o coronal es vertical y divide el cuerpo en porciones anterior y posterior. Puede estar ubicado en distintas posiciones de profundidad. Es diferente del sagital, que separa derecha e izquierda. La posición anatómica de referencia considera anterior lo que mira hacia delante y posterior lo que mira hacia atrás; estas relaciones no cambian al modificar la postura del paciente. El plano frontal ayuda a describir estructuras que se observan desde una perspectiva anterior o posterior.\n\nEl plano coronal se dispone verticalmente de lado a lado y separa regiones anteriores de posteriores. No debe confundirse con sagital: ambos son verticales, pero tienen direcciones perpendiculares entre sí. Una vista frontal muestra la superficie anterior; un corte frontal puede atravesar el interior del cuerpo a diferentes profundidades. En anatomía, una vista y un plano de corte no son exactamente lo mismo. La referencia constante permite describir la posición de estructuras aunque cambie la orientación de la imagen.", "Imagina una lámina paralela a la parte frontal de tu cuerpo que separa la cara y pecho de la región posterior.", "Coronal = frontal = anterior/posterior."], "v86": ["El plano transversal u horizontal es perpendicular al eje longitudinal del cuerpo y separa porciones superior e inferior. Los cortes axiales de muchas imágenes médicas utilizan esta orientación. Puede atravesar cabeza, tórax, abdomen o extremidades a diferentes alturas. La posición anatómica define superior como hacia la cabeza e inferior como hacia los pies; no depende de si la persona está acostada. Un plano transversal no necesita pasar por el centro exacto del cuerpo.\n\nUn corte transversal separa porciones superiores e inferiores y permite observar secciones a diferentes alturas del cuerpo. En una tomografía abdominal pueden verse órganos y músculos en un mismo nivel axial. El plano es perpendicular al eje longitudinal corporal, por lo que no se define por la orientación física de una mesa cuando la persona está acostada. La convención de visualización de imágenes puede invertir la derecha respecto a la pantalla; conserva siempre la referencia anatómica del paciente.", "Imagina un corte horizontal a la altura del ombligo: separa la porción superior de la inferior.", "Transversal = superior/inferior."], "v87": ["El plano sagital medio pasa por la línea media longitudinal del cuerpo, separándolo en mitades derecha e izquierda. Un plano sagital desplazado hacia un lado también separa regiones derecha e izquierda, pero no en mitades iguales. La línea media ayuda a comprender términos como medial (más cercano a ella) y lateral (más alejado). La simetría externa no implica que todos los órganos internos sean simétricos: corazón, hígado y bazo tienen ubicaciones particulares.\n\nEl plano medio funciona como referencia para términos medial y lateral: una estructura medial está más cerca de esta línea, mientras una lateral se aleja de ella. Las estructuras pares, como riñones, ocupan lados opuestos, pero los órganos no se distribuyen necesariamente con simetría perfecta. Un plano parasagital es paralelo al medio y divide en partes desiguales. Aprender estas relaciones permite describir localización con precisión sin depender de frases ambiguas como a este lado o hacia allá.", "Una línea imaginaria que pasa por nariz y ombligo representa la referencia media en una vista anterior.", "Todo plano medio es sagital, pero no todo sagital es medio."], "v88": ["El hipocondrio derecho es una de las tres regiones superiores del abdomen. Se sitúa bajo el reborde costal derecho, lateral al epigastrio. Se relaciona principalmente con gran parte del hígado, vesícula biliar y porciones de otras estructuras, como la flexura derecha del colon. Las nueve regiones son referencias de superficie y no cajas que contengan órganos completos. En una vista frontal, la derecha anatómica del paciente se observa a tu izquierda.\n\nEn la cuadrícula abdominal, el hipocondrio derecho se localiza por encima del flanco derecho y a la derecha del epigastrio desde la perspectiva del paciente. Parte del hígado y la vesícula se relacionan con esta zona, aunque los órganos pueden extenderse más allá de las líneas de referencia. La región se sitúa próxima a las costillas inferiores. Las regiones abdominales ayudan a comunicar localizaciones, pero no permiten identificar por sí solas el origen de un síntoma.", "En una cuadrícula 3 × 3 vista de frente, identifica la casilla superior situada a la izquierda del observador.", "Hipocondrio derecho: hígado y vesícula."], "v89": ["El epigastrio ocupa la región superior central, entre ambos hipocondrios. Se relaciona con parte del estómago, hígado, duodeno y páncreas, dependiendo de la proyección anatómica. El prefijo epi- indica una relación superior y gastr- se relaciona con estómago. No representa un órgano aislado ni equivale a todo el cuadrante superior. En la descripción de molestias, una localización epigástrica comunica una región, no un diagnóstico.\n\nEl epigastrio se sitúa entre ambos hipocondrios, por encima de la región umbilical. Parte del estómago, el páncreas y el hígado se proyectan en esta región según la anatomía individual. La palabra epi indica una ubicación superior respecto al área gástrica de referencia. No todo el estómago se encuentra en esta zona. Para memorizar la cuadrícula, comienza por las tres regiones centrales en orden superior a inferior: epigastrio, mesogastrio e hipogastrio.", "Ubica el centro de la fila superior de la cuadrícula abdominal, por encima del mesogastrio.", "Epigastrio = superior central."], "v90": ["El hipocondrio izquierdo está debajo del reborde costal izquierdo, al lado del epigastrio. Se asocia con bazo, parte del estómago, cola del páncreas y otras estructuras cercanas. El bazo participa en filtración de sangre e inmunidad, mientras el estómago pertenece al aparato digestivo. Los órganos pueden extenderse a regiones vecinas. En la vista anterior, el hipocondrio izquierdo queda a la derecha de quien observa.\n\nEsta región queda por encima del flanco izquierdo y lateral al epigastrio. Se relaciona con el bazo, porciones del estómago y la cola pancreática. El bazo es un órgano situado en profundidad, protegido parcialmente por costillas; no se confunde con el hígado, que se proyecta principalmente al lado derecho. En un dibujo frontal, el hipocondrio izquierdo puede verse a la derecha del observador. La nomenclatura utiliza el lado corporal del paciente de manera constante.", "Compara las dos esquinas superiores: hígado predominante a la derecha del paciente; bazo a la izquierda.", "Hipocondrio izquierdo: bazo y parte del estómago."], "v91": ["El flanco derecho, también llamado región lumbar derecha, pertenece a la fila media lateral del abdomen. Se localiza entre hipocondrio derecho y fosa ilíaca derecha, junto a la región umbilical. Se relaciona con el colon ascendente y con proyecciones de estructuras profundas como el riñón derecho. Los riñones son retroperitoneales y su ubicación no queda limitada a una sola casilla. El nombre lumbar en este esquema se refiere a la región abdominal lateral, no a una vértebra concreta.\n\nEl flanco derecho ocupa la fila central del abdomen, entre hipocondrio y fosa ilíaca derechos. El colon ascendente recorre parte de esa zona y el riñón derecho se localiza más profundamente en posición retroperitoneal. La proyección superficial de un órgano no significa que esté inmediatamente debajo de la piel. Recuerda que las regiones son referencias espaciales imaginarias y que los límites varían con postura, tamaño corporal y disposición de vísceras. No deben confundirse con órganos propiamente dichos.", "Identifica la casilla media del lado derecho del paciente; allí se proyecta parte del colon ascendente.", "Flanco derecho: región media lateral derecha, colon ascendente."], "v92": ["El mesogastrio o región umbilical ocupa el centro de la cuadrícula de nueve regiones. Se relaciona con asas del intestino delgado y porciones del colon transverso. El ombligo sirve como referencia superficial, aunque la posición exacta de órganos puede variar con constitución y llenado. El mesogastrio está debajo del epigastrio y encima del hipogastrio. Es la región central de la fila media, no la región superior ni inferior.\n\nLa región umbilical es la casilla central en el sistema de nueve regiones y se encuentra entre ambos flancos. Contiene la referencia superficial del ombligo y puede relacionarse con asas intestinales y porciones del colon transverso. Los términos mesogastrio y región umbilical suelen utilizarse de forma equivalente en este contexto. Si te pierdes en la cuadrícula, localiza primero el ombligo; a partir de él identifica qué región está arriba, abajo, a la derecha o izquierda del paciente.", "En un esquema de nueve casillas, encuentra la que rodea el ombligo.", "Meso = medio. Mesogastrio = región umbilical central."], "v93": ["El flanco izquierdo o región lumbar izquierda ocupa la región media lateral izquierda. Se relaciona con colon descendente y proyecciones de estructuras profundas como parte del riñón izquierdo. Está entre hipocondrio izquierdo y fosa ilíaca izquierda y lateral al mesogastrio. El colon descendente conduce contenido hacia el colon sigmoide, pero su recorrido no se limita estrictamente a una región superficial. Identificar lados exige adoptar la perspectiva del paciente.\n\nEl flanco izquierdo queda por debajo del hipocondrio izquierdo y encima de la fosa ilíaca izquierda. El colon descendente y el riñón izquierdo son referencias habituales, aunque este último se sitúa hacia la pared posterior del abdomen. Contrasta colon ascendente a la derecha con descendente a la izquierda. La clasificación topográfica no separa los órganos en compartimentos cerrados: muchas estructuras cruzan las líneas. La derecha e izquierda del dibujo siempre deben interpretarse desde la perspectiva corporal del paciente.", "Compara colon ascendente en el lado derecho y descendente en el izquierdo.", "Flanco izquierdo: medio lateral izquierdo, colon descendente."], "v94": ["La fosa ilíaca derecha o región inguinal derecha ocupa la esquina inferior derecha del paciente. Se relaciona con ciego, apéndice y, según la anatomía individual, estructuras reproductoras como el ovario derecho. El ciego forma parte inicial del intestino grueso. Esta región permite describir localizaciones anatómicas; no basta por sí sola para diagnosticar una enfermedad. Se encuentra debajo del flanco derecho y al lado del hipogastrio.\n\nLa fosa ilíaca derecha se localiza en la fila inferior, por debajo del flanco derecho y lateral al hipogastrio. Se relaciona con ciego, apéndice y estructuras pélvicas derechas según el individuo. El apéndice nace del ciego, pero su dirección y posición pueden variar. Ubicar una región es una habilidad descriptiva útil; no equivale a diagnosticar una enfermedad según el sitio de un dolor. Para identificar la imagen, encuentra primero la fila inferior y después el lado derecho del paciente.", "En una cuadrícula frontal, ubica la casilla inferior a la izquierda del observador.", "Fosa ilíaca derecha: ciego y apéndice."], "v95": ["El hipogastrio o región púbica es la región inferior central del abdomen. Se sitúa debajo del mesogastrio, entre las fosas ilíacas. Se relaciona con la vejiga urinaria cuando se proyecta hacia arriba, asas intestinales y estructuras pélvicas, incluido el útero según el contexto anatómico. La próstata se encuentra más profundamente en la pelvis, debajo de la vejiga. La proyección de órganos varía con el llenado y características individuales.\n\nEl hipogastrio se sitúa debajo del mesogastrio, entre ambas fosas ilíacas. La vejiga, especialmente cuando aumenta su volumen, puede proyectarse en esta área. También se relaciona con estructuras pélvicas como útero o próstata, según la anatomía individual. No todos estos órganos ocupan la región superficial en igual medida. El término región púbica es otra denominación utilizada en esta división. Distingue hipogastrio inferior de epigastrio superior mediante los prefijos hipo y epi.", "Identifica la casilla central de la fila inferior, justo sobre la región púbica.", "Hipo = inferior. Hipogastrio = inferior central."], "v96": ["La fosa ilíaca izquierda o región inguinal izquierda es la región inferior lateral izquierda. Se asocia especialmente con el colon sigmoide, que continúa hacia el recto, y con estructuras pélvicas izquierdas, como el ovario izquierdo cuando está presente. Está debajo del flanco izquierdo y lateral al hipogastrio. Las asociaciones sirven para estudiar proyecciones anatómicas, no para afirmar que cada órgano ocupa una sola región.\n\nLa fosa ilíaca izquierda ocupa la fila inferior a la izquierda del paciente y se continúa superiormente con el flanco izquierdo. Se relaciona frecuentemente con colon sigmoide y estructuras pélvicas izquierdas. El sigmoide conecta el colon descendente con el recto y su forma y extensión pueden variar. Comparar ambas fosas ilíacas ayuda a asociar ciego con derecha y sigmoide con izquierda. Recuerda que la división en nueve regiones es diferente del sistema de cuatro cuadrantes abdominales.", "Compara las dos regiones inferiores laterales: ciego y apéndice a la derecha; sigmoide a la izquierda.", "Fosa ilíaca izquierda: colon sigmoide."]};
const UNIT_INTRO=["Conoce cómo evolucionó la enfermería y qué distingue el cuidado profesional. Relacionarás dos figuras históricas con la atención centrada en la persona, las necesidades básicas y el marco de actuación profesional.", "Comprende cómo los músculos transforman energía en movimiento y cómo su estructura se relaciona con el trabajo que realizan. Diferenciarás los tres tejidos musculares, sus características y adaptaciones.", "Sigue el recorrido de los alimentos desde su ingreso hasta la absorción y eliminación. Distinguirás los órganos del tubo digestivo, sus glándulas auxiliares y los movimientos que permiten procesar nutrientes.", "Estudia la organización de los órganos reproductores femeninos y la coordinación hormonal entre ovarios y útero. Diferenciarás ovulación, fecundación, implantación y menstruación.", "Conoce la anatomía y las funciones reproductoras y endocrinas masculinas. Seguirás el recorrido de los espermatozoides y distinguirás estructuras urinarias y reproductoras.", "Comprende la célula como unidad de la vida. Relaciona sus componentes con sus funciones, su especialización y renovación, y reconoce ejemplos de alteraciones celulares.", "Explora la barrera que protege al cuerpo del ambiente. Distingue las capas de la piel, sus componentes, la pigmentación y su participación en sensibilidad y regulación térmica.", "Sigue la circulación de la sangre por las cavidades, válvulas y vasos. Entenderás por qué el corazón alterna llenado y contracción, y cómo los componentes sanguíneos realizan funciones diferentes.", "Descubre la relación entre drenaje de líquidos y defensa inmunitaria. Distingue el trabajo de vasos, ganglios, timo, bazo y linfocitos B y T.", "Entiende cómo las hormonas comunican órganos distantes y mantienen el equilibrio del organismo. Estudia las glándulas, su ubicación, funciones y relación con reproducción, glucemia y estrés.", "Estudia el esqueleto como estructura viva y dinámica. Conoce la remodelación ósea, el cráneo, la columna, la mano y las funciones mecánicas y metabólicas de los huesos.", "Sigue la formación de orina desde la filtración renal hasta su eliminación. Distingue la función de riñones, uréteres, vejiga y uretra, y relaciona el sistema con el equilibrio interno.", "Aprende a reconocer posturas a partir de la superficie corporal apoyada, la inclinación del tronco y la disposición de las extremidades. Este módulo es de identificación anatómica, no de ejecución de maniobras clínicas.", "Aprende el lenguaje espacial del cuerpo. Utiliza los planos sagital, frontal y transversal para describir de forma consistente divisiones y relaciones entre estructuras.", "Ubica las nueve regiones del abdomen y asocia órganos representativos con ellas. Distingue regiones de cuadrantes y recuerda que la derecha e izquierda corresponden al paciente."];

function pending(){let a=Object.entries(S.sessions);return a.length?`<h2 class="section">Actividades pendientes</h2><div class="stack">${a.map(([k,q])=>`<button class="unit" onclick="go('quiz','${esc(k)}')"><span class="num">↗</span><span><span class="unit-title">${esc(q.title)}</span><small>${q.answers.filter(x=>x!==null).length}/${q.items.length} respondidas · continuar</small></span><span class="arrow">›</span></button>`).join('')}</div>`:''}function home(){let c=continuation(),ex=S.history.filter(h=>h.kind==='exam');let err=Object.keys(S.errors).filter(k=>S.errors[k]>0).length;return `<div class="card hero"><div class="house-title">DR. H.O.U.S.E.</div><p class="house-sub"><b>H</b>abilidades <b>O</b>perativas y <b>U</b>rgencias en <b>S</b>ervicios de <b>E</b>nfermería</p><div class="eyebrow">Tu espacio de estudio · Primer examen parcial</div><h1>${S.studentName?`Hola, ${esc(S.studentName)}.`:`Aprende enfermería,<br>un paso a la vez.`}</h1><p>Estudia lo esencial, practica y comprueba tu preparación.</p><p style="font-size:.78rem;opacity:.9">Proyecto educativo de Grupo Educativo Kamina</p><div class="row between"><strong>Avance general</strong><strong>${progress()}%</strong></div>${bar(progress())}<small style="color:#d5efea">Lecturas completadas y dominio demostrado, con el mismo peso.</small></div>${profileCard()}<div class="card"><div class="eyebrow">Tu siguiente paso</div><h2>${esc(c.title)}</h2><p class="muted">${esc(c.desc)}</p><button class="primary" style="width:100%" onclick="${c.action}">${S.last?'Continuar donde me quedé':'Comenzar a estudiar'} →</button></div><div class="grid grid4 metrics"><div class="card"><div class="metric">${completed()}/15</div><small>Unidades leídas</small></div><div class="card"><div class="metric">${mastered()}/15</div><small>Unidades con ≥80%</small></div><div class="card"><div class="metric">${ex.length}</div><small>Simulacros completos</small></div><div class="card"><div class="metric">${err}</div><small>Conceptos por reforzar</small></div></div>${pending()}<h2 class="section">¿Qué quieres hacer?</h2><div class="grid grid3 home-tiles">${tile('course','Estudiar','15 unidades, explicaciones y prácticas')}${tile('exams','Simuladores','Tres niveles y diferentes versiones')}${tile('atlas','Anatomía visual','Posiciones, planos y regiones','◉')}${tile('review','Repasar','Errores, tarjetas y preguntas abiertas')}${tile('progress','Mi avance','Resultados y plan de estudio')}${tile('library','Biblioteca','Videos y apuntes')}</div>${S.history.length?'':`<div class="card section"><h3>¿Quieres saber por dónde empezar?</h3><p class="muted">Haz un diagnóstico de 15 preguntas para identificar tus primeras áreas de refuerzo.</p><button onclick="startDiagnostic()">Hacer diagnóstico</button></div>`}${homeOptions()}`}

function studyIndex(t,atLesson=false){let read=readCount(),total=totalCards();return `<aside class="study-sidebar no-print"><details class="study-index" ${(!atLesson||innerWidth>=600)?'open':''}><summary><span>Índice del curso<small class="index-location">${t}. ${esc(TITLES[t-1])}</small></span><span class="index-count">${read}/${total} ✓</span></summary><div class="index-inner"><div class="row between"><small>Mini temas leídos</small><small>${pct(read,total)}%</small></div>${bar(pct(read,total))}<div class="index-legend"><span>✓ Leído</span><span>● Ahora</span><span>○ Pendiente</span></div>${TITLES.map((name,j)=>{let x=j+1,u=unit(x),ls=lessons(x),done=u.read.length===ls.length,active=t===x;return `<details class="index-unit" ${active?'open':''}><summary class="${active?'index-active':''} ${done?'index-done':''}"><span class="index-icon">${done?'✓':active?'●':'○'}</span><span class="index-unit-label">${x}. ${esc(name)}<small>${u.read.length}/${ls.length} leídos</small></span></summary><div class="index-mini"><button class="index-overview" onclick="openStudyUnit(${x})">Ir a esta unidad →</button>${ls.map((l,i)=>{let current=atLesson&&active&&u.pos===i;return `<button class="index-topic ${current?'current':''} ${u.read.includes(i)?'seen':''}" ${current?'aria-current="step"':''} onclick="indexJump(${x},${i})"><span class="index-icon">${u.read.includes(i)?'✓':current?'●':'○'}</span><span>${i+1}. ${esc(l.q)}${current?'<small class="here-label">Estás aquí</small>':''}</span></button>`}).join('')}<button class="index-overview" onclick="startUnit(${x})">Evaluar unidad →</button></div></details>`}).join('')}</div></details></aside>`}

function currentStudyUnit(){let l=S.last;if(l?.type==='lesson'&&l.t>=1&&l.t<=15)return l.t;if(l?.type==='quiz'&&S.sessions[l.key]?.t)return S.sessions[l.key].t;return TITLES.findIndex((_,i)=>unit(i+1).read.length<lessons(i+1).length)+1||1}
function studyLayout(t,content,atLesson=false){return `<div class="study-layout">${studyIndex(t,atLesson)}<div class="study-main">${content}</div></div>`}
function course(){let t=currentStudyUnit(),u=unit(t);return studyLayout(t,heading('Curso de enfermería','Elige una unidad en el índice o continúa donde te quedaste.')+`<div class="card"><div class="eyebrow">Tu ubicación en el curso</div><h2>${esc(TITLES[t-1])}</h2><p class="muted">Mini tema ${u.pos+1}: ${esc(lessons(t)[u.pos].q)}</p><button class="primary" onclick="go('lesson',${t})">Continuar estudiando →</button></div><div class="card"><div class="row between"><strong>Lectura del curso</strong><strong>${readCount()}/${totalCards()} mini temas</strong></div>${bar(pct(readCount(),totalCards()))}<div class="field"><label for="courseSearch">Buscar tema o concepto</label><input id="courseSearch" placeholder="Ej. corazón, insulina, huesos" value="${esc(searchValue)}" oninput="searchValue=this.value;drawUnits()"></div></div><div id="unitsList" class="stack">${unitsList()}</div><div class="card section no-print"><h3>Opciones del curso</h3><button class="danger" onclick="resetAll()">Comenzar de nuevo el curso</button></div>`)}
function unitsList(){let query=searchValue.trim().toLocaleLowerCase('es');let list=TITLES.map((name,i)=>({name,t:i+1})).filter(({name,t})=>!query||`${name} ${topic(t).map(b=>b.a+' '+b.e).join(' ')} ${lessons(t).map((_,i)=>expandedFor(t,i).join(' ')).join(' ')}`.toLocaleLowerCase('es').includes(query));return list.length?list.map(({name,t})=>{let u=unit(t),n=lessons(t).length,[label,cl]=unitStatus(t);return `<button class="unit" onclick="go('lesson',${t})"><span class="num">${String(t).padStart(2,'0')}</span><span><span class="unit-title">${name}</span><small>${u.read.length}/${n} mini temas · ${u.last!==null?'Última evaluación '+u.last+'%':'Sin evaluación'}</small>${bar(pct(u.read.length,n))}</span><span><span class="pill ${cl}">${label}</span><span class="arrow" aria-hidden="true"> ›</span></span></button>`}).join(''):'<div class="card">No hay coincidencias. Prueba con otro término.</div>'}function drawUnits(){$('unitsList').innerHTML=unitsList()}
function videoLink(t){let v=VIDEOS[t];return `${v?`<a href="https://www.youtube.com/watch?v=${v[0]}" target="_blank" rel="noopener noreferrer">▶ ${esc(v[1])}</a><br>`:''}<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(QUERIES[t-1]+' español')}" target="_blank" rel="noopener noreferrer">${v?'Buscar más videos':'▶ Buscar videos de este tema'} en YouTube ↗</a>`}
function regionSVG(index=-1){let cells='';for(let i=0;i<9;i++){let x=52+(i%3)*72,y=48+Math.floor(i/3)*52;cells+=`<rect x="${x}" y="${y}" width="72" height="52" fill="${i===index?'#70c7b5':'#f1f7f5'}" stroke="#2e6663" stroke-width="1.6"/><text x="${x+36}" y="${y+31}" text-anchor="middle" font-size="16" font-weight="700" fill="#193d3a">${i+1}</text>`}return `<svg viewBox="0 0 320 235" role="img" aria-label="Esquema de nueve regiones, vista frontal del paciente${index>=0?', región '+(index+1)+' resaltada':''}"><text x="52" y="28" font-size="12" fill="#214d49">Derecha paciente</text><text x="268" y="28" text-anchor="end" font-size="12" fill="#214d49">Izquierda paciente</text>${cells}<text x="160" y="221" font-size="12" text-anchor="middle" fill="#214d49">Vista anterior · esquema</text></svg>`}function diagram(t){if(t===11)return `<div class="imgbox"><img src="${IMGS.skull}" alt="Esquema lateral de los huesos principales del cráneo"><small>Vista lateral del cráneo. Complementa con la lista completa de huesos.</small></div>`;if(t===13)return `<div class="imgbox"><img src="${IMGS.posiciones}" alt="Posiciones anatómicas distribuidas en dos columnas"><small>Identifica cada postura por orientación e inclinación.</small></div>`;if(t===14)return `<div class="imgbox"><img src="${IMGS.planos}" alt="Tres planos anatómicos sobre una figura humana"><small>Tres planos de referencia.</small></div>`;if(t===15)return `<div class="imgbox">${regionSVG()}<small>Vista frontal: la derecha del paciente queda a la izquierda del observador.</small></div>`;let flows={3:['Boca','Esófago','Estómago','Intestino delgado','Intestino grueso'],4:['Menstruación','Fase folicular','Ovulación','Fase lútea'],5:['Testículo','Epidídimo','Deferente','Conducto eyaculador','Uretra'],7:['Epidermis','Dermis','Hipodermis'],8:['Cuerpo','Corazón derecho','Pulmones','Corazón izquierdo','Cuerpo'],12:['Riñones','Uréteres','Vejiga','Uretra']};return flows[t]?`<div class="svgflow">${flows[t].map((x,i)=>`${i?'<b aria-hidden="true">→</b>':''}<span>${x}</span>`).join('')}</div>`:''}
function expandedFor(t,i){let l=lessons(t)[i];return LESSON_EXPANDED[typeof l.n==='number'?String(l.n):'v'+topic(t)[i].id]}
function expandedParagraphs(str){return str.split(/\n\s*\n/).flatMap(part=>{let sentences=part.match(/[^.!?]+(?:[.!?]+(?=\s|$)|$)/g)||[part];let cut=Math.ceil(sentences.length/2);return [sentences.slice(0,cut).join('').trim(),sentences.slice(cut).join('').trim()].filter(Boolean)})}

function markFullSection(t,i){let u=unit(t);if(!u.read.includes(i))u.read.push(i);u.pos=Math.min(lessons(t).length-1,i+1);save();let y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});notify('Mini tema marcado como leído')}
function finishFull(t){let u=unit(t);if(u.read.length<lessons(t).length&&!confirm('¿Ya terminaste de leer todos los mini temas de esta unidad?'))return;u.read=lessons(t).map((_,i)=>i);u.pos=u.read.length-1;save();startUnit(t)}
function chapterCard(t,i,full=false){let l=lessons(t)[i],d=expandedFor(t,i),u=unit(t),done=u.read.includes(i);return `<div class="card lesson-card full-chapter" id="chapter-${i}"><div class="eyebrow">Mini tema ${i+1} de ${lessons(t).length}${done?' · Leído ✓':''}</div><h2>${esc(l.q)}</h2><span class="concept-label">Respuesta breve</span><div class="answer-text">${esc(l.a)}</div><div class="development"><h3>Explicación</h3>${expandedParagraphs(d[0]).map(p=>`<p>${esc(p)}</p>`).join('')}</div>${t===13&&topic(t)[i]?.img?`<div class="imgbox smallimg"><img src="${IMGS[topic(t)[i].img]}" alt="Ilustración de la posición anatómica descrita"></div>`:''}${t===15?`<div class="imgbox">${regionSVG(i)}</div>`:''}${t===11&&l.n===58?diagram(t):''}${t===14?diagram(t):''}<div class="study-example"><strong>Ejemplo para comprender</strong><p>${esc(d[1])}</p></div><div class="study-memory"><strong>Qué debes recordar</strong><p>${esc(d[2])}</p></div><div class="row no-print study-action"><button class="quiet" onclick="speak(${t},${i})">🔊 Escuchar lección</button><button class="quiet" onclick="favorite(${t},${i})">${S.favorites.includes(t+':'+i)?'★ Guardado':'☆ Guardar concepto'}</button><a class="yt-mini" href="https://www.youtube.com/results?search_query=${encodeURIComponent(TITLES[t-1]+' '+l.q+' '+(t>=13?l.a:'')+' enfermería explicación español')}" target="_blank" rel="noopener noreferrer">▶ Buscar video en YouTube</a><button ${done?'disabled':''} class="${done?'':'primary'}" onclick="${full?'markFullSection':'markMini'}(${t},${i})">${done?'✓ Mini tema leído':'Marcar como leído'}</button></div></div>`}
function lesson(t){let u=unit(t),ls=lessons(t),i=u.pos,n=ls.length,done=u.read.includes(i),full=true;return studyLayout(t,`<div class="reading"><div class="row between no-print">${back('course','Todas las unidades')}</div><div class="eyebrow">Unidad ${t} de 15${S.studentName?` · ${esc(S.studentName)}`:''}</div><h1>${TITLES[t-1]}</h1><div class="lesson-intro"><h3>Qué aprenderás</h3><p>${esc(UNIT_INTRO[t-1])}</p></div><div class="row between study-count"><small>${full?'Lectura completa':`Mini tema ${i+1} de ${n}`} · ${u.read.length===n?'Unidad leída':'En estudio'}</small><small>${u.read.length} de ${n} leídos</small></div>${bar(pct(u.read.length,n))}${ls.map((_,j)=>chapterCard(t,j,true)).join('')}<div class="btnrow no-print"><button class="primary" onclick="finishFull(${t})">Terminar lectura y evaluar unidad</button></div><div class="card section"><h3>Lo indispensable para el examen</h3><p>${esc(EXTRA[t])}</p>${diagram(t)}</div><div class="card"><h3>Video de apoyo</h3><p class="muted">Abre YouTube en otra pestaña. Tu avance queda guardado.</p>${videoLink(t)}<p class="muted" style="margin-top:12px">Si quieres profundizar más: <a href="${t===1?'https://openstax.org/books/fundamentals-nursing/pages/1-5-selected-nursing-theorist':'https://openstax.org/details/books/anatomy-and-physiology-2e'}" target="_blank" rel="noopener noreferrer">Lectura académica complementaria (inglés)</a></p></div><div class="card"><h3>Comprueba lo aprendido</h3><p class="muted">${u.last!==null?'Último resultado: '+u.last+'%. ':''}${S.sessions['unit-'+t]?'Tienes una evaluación pendiente.':'Responde una práctica con explicación de cada respuesta.'}</p><div class="btnrow"><button class="primary" onclick="startUnit(${t})">${S.sessions['unit-'+t]?'Continuar evaluación':'Evaluar esta unidad'}</button><button onclick="newUnit(${t})">Cambiar examen de esta unidad</button></div>${unitVersionsPanel(t)}${t===15?`<div class="hintbox"><h3>Evaluación final del curso</h3><p>Cuando termines las unidades, practica con 64 preguntas de todo el curso.</p><button class="primary" onclick="startFinal()">${S.sessions.final?'Continuar evaluación final':'Iniciar evaluación final'}</button></div>`:''}</div><div class="card section no-print"><h3>Opciones de esta unidad</h3><button class="danger" onclick="resetUnit(${t})">Comenzar de nuevo esta unidad</button></div></div>`,true)}
function lessonJump(t,i){unit(t).pos=i;S.last={type:'lesson',t};save();go('lesson',t,false);document.getElementById('chapter-'+i)?.scrollIntoView({block:'start',behavior:'instant'})}function lessonNext(t){let u=unit(t);if(!u.read.includes(u.pos))u.read.push(u.pos);if(u.pos===lessons(t).length-1){save();startUnit(t)}else lessonJump(t,u.pos+1)}function favorite(t,i){let k=t+':'+i;if(S.favorites.includes(k))S.favorites=S.favorites.filter(x=>x!==k);else S.favorites.push(k);save();render();notify('Favoritos actualizados')}function speak(t,i){if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){notify('La lectura en voz alta no está disponible en este dispositivo.');return}speechSynthesis.cancel();let l=lessons(t)[i],v=new SpeechSynthesisUtterance(l.q+'. '+l.a+'. '+expandedFor(t,i).join('. '));v.lang='es-MX';v.rate=.92;speechSynthesis.speak(v)}function resetUnit(t){if(!confirm('¿Reiniciar lectura y evaluaciones de esta unidad? Se borrarán también las respuestas abiertas y el repaso de este tema. Tus simulacros generales, favoritos y apuntes se conservan.'))return;if(S.real?.errors)GUIDE.forEach((g,i)=>{if(g.t===t)delete S.real.errors[i]});delete S.units[t];delete S.sessions['unit-'+t];delete S.next['unit-'+t];GUIDE.forEach((g,i)=>{if(g.t===t)delete S.guide[i]});if(GUIDE[S.guide.pos]?.t===t)delete S.guide.pos;S.history=S.history.filter(h=>!(h.kind==='unit'&&h.t===t));for(let b of topic(t)){delete S.errors[b.id];delete S.stats[b.id];delete S.flash[b.id];for(let h of S.history){for(let d of h.details.filter(d=>d.id===b.id)){let st=S.stats[b.id]||{right:0,total:0,last:0};st.total++;st.right+=d.ok?1:0;st.last=h.date;S.stats[b.id]=st;S.errors[b.id]=Math.max(0,(S.errors[b.id]||0)+(d.ok?-1:1))}}}S.last={type:'lesson',t};save();go('lesson',t);notify('Unidad reiniciada')}
// Four independent balanced versions, each with 20 different concepts, per difficulty.
function fixedVersions(){let v=[[],[],[],[]];for(let t=1;t<=15;t++){let a=shuffle(topic(t).filter(b=>!b.supplemental),rng(871+t));for(let j=0;j<4;j++)v[j].push(a[j].id);let rest=a.slice(4);rest.forEach((b,j)=>v[(j+t)%4].push(b.id))}return v.map((a,j)=>[...a.slice(0,15),...shuffle(a.slice(15),rng(2026+j)).slice(0,5)])}
// Construct each version from one question per unit, then assign remaining questions to the shortest pool.
function buildVersions(){let v=[[],[],[],[]],rem=[];for(let t=1;t<=15;t++){let a=shuffle(topic(t).filter(b=>!b.supplemental),rng(871+t));for(let j=0;j<4;j++)v[j].push(a[j].id);rem.push(...a.slice(4).map(b=>b.id))}rem=shuffle(rem,rng(20261123));for(let j=0;j<4;j++)v[j].push(...rem.slice(j*5,j*5+5));return v}
const VERSIONS=buildVersions();
function balanced(count,random=Math.random,avoid=[]){let excluded=new Set(avoid),sel=[],used=new Set();const sort=a=>[...shuffle(a.filter(b=>!excluded.has(b.id)),random),...shuffle(a.filter(b=>excluded.has(b.id)),random)];let ts=shuffle(TITLES.map((_,i)=>i+1),random);for(let t of ts){if(sel.length>=count)break;let b=sort(topic(t))[0];if(b){sel.push(b.id);used.add(b.id)}}for(let b of sort(BANK)){if(sel.length>=count)break;if(!used.has(b.id)){used.add(b.id);sel.push(b.id)}}return shuffle(sel,random)}

function allowReplace(key){return !S.sessions[key]||confirm('Hay una evaluación sin terminar. ¿Deseas sustituirla? No se borrarán tus resultados anteriores.')}function startExam(level,version=null,force=false){let key='exam-'+level;if(!force&&!allowReplace(key))return;let n=Number(S.next[key])||0;let v=version===null?n:version;let ids;if(v<4)ids=VERSIONS[v];else{let old=S.sessions[key]?.items.map(x=>x.id)||[...S.history].reverse().find(x=>x.kind==='exam'&&x.level===level)?.items?.map(x=>x.id)||[];ids=balanced(20,Math.random,old)}S.next[key]=Math.max(n,v+1);makeSession(key,'exam',`Simulacro ${LEVELS[level]} · ${v<4?'Versión '+(v+1):'Combinación '+(v+1)}`,ids,level,{version:v,seed:v<4?12345+level*100+v:seed(),timed:examMinutes>0,limit:examMinutes*60})}
function nextExam(level){let key='exam-'+level,q=S.sessions[key];if(!allowReplace(key))return;let next=Math.max(Number(S.next[key])||0,(q?.version??-1)+1);startExam(level,next,true)}function repeatPending(key){let q=S.sessions[key];if(!q||!confirm('¿Reiniciar este mismo examen? Se borrarán solo las respuestas de este intento.'))return;q.answers=q.items.map(()=>null);q.checked=q.items.map(()=>false);q.marked=q.items.map(()=>false);q.pos=0;q.elapsed=0;save();go('quiz',key)}function repeatHistory(id){let h=S.history.find(x=>x.id===id);if(!h||!h.items)return;let key=h.key;if(!allowReplace(key))return;S.sessions[key]={key,kind:h.kind,title:h.title,level:h.level,t:h.t,version:h.version,seed:h.seed,visual:h.visual,practice:h.practice,timed:h.timed,limit:h.limit,elapsed:0,created:Date.now(),items:JSON.parse(JSON.stringify(h.items)),answers:h.items.map(()=>null),checked:h.items.map(()=>false),marked:h.items.map(()=>false),pos:0};save();go('quiz',key)}function startUnit(t){let key='unit-'+t;if(S.sessions[key])return go('quiz',key);let v=Number(S.next[key])||0;beginUnitVersion(t,v)}function newUnit(t){let key='unit-'+t;let last=S.sessions[key]?.version??[...S.history].reverse().find(h=>h.kind==='unit'&&h.t===t)?.version??-1;let v=Math.max(Number(S.next[key])||0,last+1,1);let prev=S.sessions[key]?.items||[...S.history].reverse().find(h=>h.kind==='unit'&&h.t===t)?.items;let sig=items=>items.map(x=>x.id+':'+x.level).sort().join(',');if(prev)while(sig(unitVersion(t,v).items)===sig(prev))v++;beginUnitVersion(t,v)}function startDiagnostic(){if(S.sessions.diagnostic)return go('quiz','diagnostic');makeSession('diagnostic','diagnostic','Diagnóstico inicial',balanced(15),0)}function customExam(){if(!allowReplace('custom'))return;let t=Number($('customTopic').value),n=Number($('customCount').value),l=Number($('customLevel').value),p=$('customMode').value==='1';let pairs=t?questionPairs(t,l===-1?3:l,n):null,ids=pairs?pairs.map(x=>x.id):balanced(n);let q=buildSession('custom','custom','Exa const API='https://script.google.com/macros/s/AKfycbwmrjFeHBHHexEAhOVrXRLDSqwtwfghOfLZvRPzHhXG7bI4lEm9ftA7KSNfZjB7vz-M4Q/exec';

async function api(accion,datos={}){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({accion,...datos}),signal:controller.signal,redirect:'follow'});let j=await r.json();if(!j.ok){let e=new Error(j.mensaje||'Error del servidor');e.code=j.codigo;throw e}return j}finally{clearTimeout(timer)}}
const overlay=document.createElement('div');overlay.id='cloudGate';overlay.style.cssText='position:fixed;inset:0;z-index:9999;overflow:auto;background:var(--bg,#111d21);padding:24px;display:grid;place-items:center';document.body.append(overlay);

function gate(register=false){overlay.style.display='grid';document.querySelector('header').inert=true;$('main').inert=true;$('bottomnav').inert=true;overlay.innerHTML=`<div class="card" style="width:min(100%,440px);margin:auto"><div class="house-title">DR. H.O.U.S.E.</div><h2>${register?'Crear nueva cuenta':'Iniciar sesión'}</h2><form id="cloudForm" class="stack" autocomplete="on">${register?'<label>Nombre<input name="nombre" id="registerName" required maxlength="120" autocomplete="name" autocapitalize="characters"></label><label>Correo electrónico<input name="correo" id="registerEmail" type="email" required maxlength="254" autocomplete="email" autocapitalize="none" spellcheck="false"></label>':''}${register?'<label>Usuario<input name="usuario" id="registerUsername" required minlength="4" maxlength="40" pattern="[A-Za-z0-9._-]{4,40}" autocomplete="username" autocapitalize="characters" spellcheck="false"></label>':'<label>Usuario / Correo<input name="usuario" id="loginUsername" required minlength="4" maxlength="254" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="USUARIO O CORREO"></label>'}<label>Contraseña<input name="contrasena" id="cloudPassword" type="password" required minlength="4" maxlength="128" autocomplete="${register?'new-password':'current-password'}"></label><label><input type="checkbox" onchange="this.form.contrasena.type=this.checked?'text':'password'"> Mostrar contraseña</label><p class="muted">Nombre, correo y usuario se convierten automáticamente a MAYÚSCULAS. La contraseña conserva exactamente las mayúsculas y minúsculas que escribas.</p>${register?'<label><input name="acepta" type="checkbox" required> Guardaré mis credenciales y utilizaré un correo electrónico al que tenga acceso.</label>':''}<button class="primary" type="submit">${register?'Registrarme':'Entrar'}</button></form><p id="cloudMessage" role="status"></p><button type="button" onclick="recoveryGate()">${register?'¿Ya registraste tu correo? Recuperar cuenta':'Olvidé mis datos de acceso'}</button><button onclick="gate(${!register})">${register?'Ya tengo cuenta':'Crear nueva cuenta'}</button><p class="muted">¿Ya estudiabas en la versión anterior? Crea tu cuenta e importa tu llave.</p></div>`;let f=$('cloudForm');for(let n of ['nombre','correo','usuario'])if(f.elements[n])f.elements[n].addEventListener('input',e=>{let x=e.target,a=x.selectionStart,b=x.selectionEnd;x.value=x.value.toUpperCase();try{x.setSelectionRange(a,b)}catch(e){}});f.onsubmit=async e=>{e.preventDefault();if(cloudBusy)return;cloudBusy=true;let btn=f.querySelector('button[type=submit]');btn.disabled=true;$('cloudMessage').textContent='Conectando…';let d=Object.fromEntries(new FormData(f));d.acepta=!!d.acepta;for(const k of ['nombre','correo','usuario'])if(typeof d[k]==='string')d[k]=d[k].trim().toUpperCase();try{if(register)await api('registrar',d);let r=await api('iniciarSesion',d);await cloudEnter(r)}catch(e){$('cloudMessage').textContent=e.message==='Failed to fetch'?'No se pudo conectar. Revisa internet e implementación.':e.message}finally{cloudBusy=false;btn.disabled=false}}}
function recoveryGate(email='',step=1){
 if(cloudBusy)return;
 const previous=overlay.querySelector('input[name="correo"],input[name="usuario"]');
 if(!email&&previous&&previous.value.includes('@'))email=previous.value.trim();
 overlay.innerHTML=`<div class="card" style="width:min(100%,440px);margin:auto"><div class="house-title">DR. H.O.U.S.E.</div><h2>${step===1?'Recuperar cuenta':'Establecer nueva contraseña'}</h2><p>${step===1?'Escribe el correo registrado. Recibirás tu usuario y un código de verificación.':'Consulta tu correo (también la carpeta de spam). Si solo olvidaste tu usuario, puedes regresar al inicio de sesión. El código vence en 15 minutos.'}</p><form id="recoveryForm" class="stack" autocomplete="on"><label>Correo electrónico<input name="correo" type="email" required maxlength="254" autocomplete="email" ${step===2?'readonly':''}></label>${step===2?'<label>Código de verificación<input name="codigo" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000"></label><label>Nueva contraseña<input name="nuevaContrasena" type="password" required minlength="4" maxlength="128" autocomplete="new-password"></label><label>Confirmar nueva contraseña<input name="confirmarContrasena" type="password" required minlength="4" maxlength="128" autocomplete="new-password"></label><label><input type="checkbox" onchange="this.form.nuevaContrasena.type=this.form.confirmarContrasena.type=this.checked?\'text\':\'password\'"> Mostrar contraseñas</label>':''}<button class="primary" type="submit">${step===1?'Enviar datos de recuperación':'Actualizar contraseña'}</button></form><p id="recoveryMessage" role="status" aria-live="polite"></p>${step===2?'<button id="recoveryAgain" type="button">Solicitar otro código / cambiar correo</button>':''}<button id="recoveryBack" type="button">Regresar al inicio de sesión</button></div>`;
 const f=$('recoveryForm'),msg=$('recoveryMessage'),back=$('recoveryBack'),again=$('recoveryAgain');
 f.elements.correo.value=email;back.onclick=()=>{if(!cloudBusy)gate(false)};if(again)again.onclick=()=>recoveryGate(f.elements.correo.value,1);
 f.onsubmit=async e=>{e.preventDefault();if(cloudBusy)return;const d=Object.fromEntries(new FormData(f));d.correo=d.correo.trim();if(step===2&&d.nuevaContrasena!==d.confirmarContrasena){msg.textContent='Las contraseñas no coinciden.';return;}cloudBusy=true;const btn=f.querySelector('button[type=submit]');btn.disabled=true;back.disabled=true;if(again)again.disabled=true;msg.textContent=step===1?'Solicitando correo…':'Verificando código…';let result=null;try{result=await api(step===1?'solicitarRecuperacion':'restablecerContrasena',d)}catch(err){msg.textContent=err.name==='AbortError'?'La solicitud tardó demasiado. Revisa tu correo antes de volver a intentarlo.':err.message}finally{cloudBusy=false;btn.disabled=false;back.disabled=false;if(again)again.disabled=false}if(result){if(step===1){recoveryGate(d.correo,2);$('recoveryMessage').textContent=result.mensaje||'Revisa tu correo.';}else{gate(false);$('loginUsername').value=d.correo.toUpperCase();$('cloudMessage').textContent=result.mensaje||'Contraseña actualizada. Inicia sesión.';}}};
}
async function cloudEnter(r){if(r.llave&&!validate(r.llave))throw Error('La llave de la nube no es compatible. No se sobrescribirá.');let u=r.usuario,local=null,meta=null;try{local=JSON.parse(localStorage.getItem(KEY+':'+u));meta=JSON.parse(localStorage.getItem(KEY+':meta:'+u))}catch(e){}let useLocal=local&&validate(local)&&meta?.dirty;if(useLocal&&meta.revision!==r.revision){if(!confirm('Hay avances locales pendientes y una revisión diferente en la nube. Aceptar conserva los avances locales para exportarlos; Cancelar carga la nube (la copia local se conserva aparte).')){try{localStorage.setItem(KEY+':conflict:'+u,JSON.stringify(local))}catch(e){throw Error('No se pudo respaldar la copia local.')}useLocal=false}else{let blob=new Blob([JSON.stringify(local)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='LLAVE_CONFLICTO_'+u+'.json';a.click();throw Error('Respaldo local preparado. Vuelve a entrar y elige cargar la nube; luego podrás importar la llave si corresponde.')}}cloudAccount={usuario:u,nombre:String(r.nombre||u).toUpperCase(),token:r.token};cloudRevision=r.revision;cloudLast=r.actualizado||'';S=useLocal?local:r.llave||initial();S.studentName=cloudAccount.nombre;cloudDirty=!!useLocal;clearTransient();localSave();try{localStorage.setItem(KEY+':meta:'+u,JSON.stringify({revision:cloudRevision,dirty:cloudDirty,last:cloudLast}))}catch(e){}overlay.style.display='none';document.querySelector('header').inert=false;$('main').inert=false;$('bottomnav').inert=false;controls.style.display="flex";$('cloudName').textContent=cloudAccount.nombre;go('home');cloudStatus();if(!r.llave&&!useLocal){let old=JSON.parse(legacy);if((old.history.length||Object.keys(old.units).some(k=>old.units[k].read?.length)||Object.keys(old.notes).length||Object.keys(old.sessions).length||old.real?.current)&&confirm('Se detectó avance de la versión anterior en este dispositivo. ¿Te pertenece y quieres recuperarlo?')){S=old;S.studentName=cloudAccount.nombre;save();go('home');cloudSync()}}}
function cloudSync(){let account=cloudAccount;if(!account)return Promise.resolve(false);let run=async()=>{if(cloudAccount!==account)return false;for(let t=1;t<=TITLES.length;t++)unit(t);let snapshot=JSON.stringify(S);try{let r=await api('guardarAvance',{token:account.token,revision:cloudRevision,llave:JSON.parse(snapshot)});cloudRevision=r.revision;cloudLast=r.actualizado;cloudDirty=JSON.stringify(S)!==snapshot;localSave();try{localStorage.setItem(KEY+':meta:'+account.usuario,JSON.stringify({revision:cloudRevision,dirty:cloudDirty,last:cloudLast}))}catch(e){}cloudStatus();notify('Avance guardado en la nube');return true}catch(e){cloudDirty=true;cloudStatus();notify('No se sincronizó: '+e.message+'. Tu avance local se conserva.');return false}};cloudQueue=cloudQueue.then(run,run);return cloudQueue}
async function cloudExit(){if(cloudLeaving||!cloudAccount)return false;cloudLeaving=true;const areas=[document.querySelector('header'),$('main'),$('bottomnav')];const previous=areas.map(e=>e.inert);areas.forEach(e=>e.inert=true);try{if(document.activeElement instanceof HTMLElement)document.activeElement.blur();await cloudQueue;let saved=false;for(let attempt=0;attempt<4;attempt++){if(!await cloudSync())break;if(!cloudDirty){saved=true;break}}if(!saved){alert('No se pudo confirmar el guardado completo en la nube. Tu avance local se conserva. Vuelve a intentar o exporta tu llave.');return false}try{await api('cerrarSesion',{token:cloudAccount.token})}catch(e){}cloudAccount=null;S=initial();clearTransient();controls.style.display="none";gate();return true}finally{cloudLeaving=false;if(cloudAccount)areas.forEach((e,i)=>e.inert=previous[i])}}
for(const name of ['markMini','markFullSection','lessonNext','finishFull']){let original=window[name];if(typeof original==='function')window[name]=function(t,...args){let before=unit(t).read.length;let result=original(t,...args);if(before<lessons(t).length&&unit(t).read.length===lessons(t).length)cloudSync();return result}}
const oldFinish=finish;finish=function(...args){let n=S.history.length;let r=oldFinish(...args);if(S.history.length>n)cloudSync();return r};const oldCloseReal=closeReal;closeReal=function(...args){let n=realState().history.length;let r=oldCloseReal(...args);if(realState().history.length>n)cloudSync();return r};
