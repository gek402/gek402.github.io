o, hipófisis, pineal, tiroides, paratiroides, timo, suprarrenales, páncreas, ovarios y testículos.", "t": 10}, {"n": 48, "q": "¿Qué sustancias se conocen popularmente como hormonas de la felicidad?", "a": "Dopamina, serotonina, endorfinas y oxitocina. «Hormonas de la felicidad» es una expresión popular, no una clasificación endocrina formal.", "t": 10}, {"n": 49, "q": "Explica la función de la insulina en el control de la glucosa.", "a": "La insulina favorece la captación de glucosa en tejidos sensibles y su almacenamiento, contribuyendo a reducir la glucemia.", "t": 10}, {"n": 50, "q": "¿Qué gónadas intervienen en la función reproductora femenina?", "a": "Los ovarios producen ovocitos y hormonas sexuales, como estrógenos y progesterona.", "t": 10}, {"n": 51, "q": "¿Qué gónadas intervienen en la función reproductora masculina?", "a": "Los testículos producen espermatozoides y testosterona.", "t": 10}, {"n": 52, "q": "Nombra dos hormonas relevantes para el ciclo reproductivo femenino.", "a": "Estrógenos y progesterona intervienen en regulación del ciclo y cambios endometriales; también existen en otros sexos.", "t": 10}, {"n": 53, "q": "¿Qué glándulas se sitúan encima de los riñones?", "a": "Las suprarrenales se sitúan sobre los riñones; no son parte del tejido renal.", "t": 10}, {"n": 54, "q": "Define el sistema esquelético.", "a": "El sistema esquelético proporciona soporte, protección y movimiento en conjunto con músculos y articulaciones.", "t": 11}, {"n": 55, "q": "Distingue las células que forman, mantienen y reabsorben tejido óseo.", "a": "Osteoblastos forman hueso nuevo; osteocitos mantienen hueso maduro y osteoclastos reabsorben matriz.", "t": 11}, {"n": 56, "q": "Identifica el hueso de mayor longitud del organismo.", "a": "El fémur se ubica en el muslo y es el hueso más largo del cuerpo humano.", "t": 11}, {"n": 57, "q": "¿Cómo se denomina la vértebra C1?", "a": "Atlas es C1, sostiene el cráneo; axis es C2.", "t": 11}, {"n": 58, "q": "Dibuja el cráneo e identifica sus principales huesos.", "a": "Neurocráneo (8): frontal, 2 parietales, 2 temporales, occipital, esfenoides, etmoides. Cara (14): 2 nasales, 2 maxilares, 2 cigomáticos, 2 lagrimales, 2 palatinos, 2 cornetes nasales inferiores, vómer y mandíbula.", "t": 11}, {"n": 59, "q": "¿Cuántos huesos tiene habitualmente el esqueleto de una persona adulta?", "a": "El esqueleto adulto típico tiene 206 huesos; puede haber variaciones anatómicas.", "t": 11}, {"n": 60, "q": "Explica las funciones de sostén, protección y movimiento del esqueleto.", "a": "Además de soporte, protección y movimiento, almacena minerales y aloja médula que produce células sanguíneas.", "t": 11}, {"n": 61, "q": "¿Cuántas vértebras se reconocen habitualmente y cómo se agrupan por regiones?", "a": "33 segmentos típicos: 7 cervicales, 12 torácicas, 5 lumbares, 5 sacras y 4 coccígeas. En adulto se cuentan 26 huesos de la columna al considerar las fusiones.", "t": 11}, {"n": 62, "q": "Clasifica los huesos de la mano y señala cuántos integran cada grupo.", "a": "8 carpianos (escafoides, semilunar, piramidal, pisiforme, trapecio, trapezoide, grande y ganchoso), 5 metacarpianos, 14 falanges.", "t": 11}, {"n": 63, "q": "Describe el propósito del aparato urinario e identifica los órganos que filtran la sangre.", "a": "El aparato urinario elimina desechos y regula agua, electrolitos y equilibrio interno. Los riñones filtran la sangre y forman orina.", "t": 12}, {"n": 64, "q": "Explica la función fundamental de los riñones.", "a": "Los riñones regulan también presión arterial y eritropoyesis; filtran, reabsorben y secretan sustancias para formar orina.", "t": 12}];
const EXTRA={"1": "Recuerda estas dos figuras: Nightingale (historia y cuidado) y Henderson (modelo de 14 necesidades). No confundas la norma de enfermería con la del expediente clínico.", "2": "Recuerda: el esquelético mueve el cuerpo; el liso actúa en vísceras; el cardíaco bombea sangre. La hipertrofia se refiere a tamaño, no al número de fibras.", "3": "Ruta simplificada: boca → faringe → esófago → estómago → intestino delgado → intestino grueso → recto. El hígado ayuda a la digestión produciendo bilis; el páncreas aporta secreciones digestivas.", "4": "Internos: ovarios, trompas uterinas, útero y vagina. Externos: monte del pubis, labios mayores y menores, clítoris y vestíbulo (orificios uretral y vaginal). Ciclo de ejemplo: menstruación (día 1), fase folicular, ovulación alrededor del día 14, fase lútea y nuevo sangrado si no hay embarazo. No todos los ciclos duran 28 días.", "5": "Ruta de los espermatozoides: testículo → epidídimo → conducto deferente → conducto eyaculador → uretra. Distingue uretra (salida al exterior) de uréter (riñón a vejiga).", "6": "Procariota: sin núcleo membranoso; eucariota: con núcleo membranoso (animal y vegetal). No hay una vida útil universal: epitelio intestinal, pocos días; eritrocitos, unos 120 días; muchas neuronas, décadas.", "7": "De fuera hacia dentro: epidermis, dermis y tejido subcutáneo o hipodermis. Melanocito = célula; melanina = pigmento.", "8": "Trayecto: cuerpo → aurícula derecha → tricúspide → ventrículo derecho → válvula pulmonar → pulmones → aurícula izquierda → mitral → ventrículo izquierdo → válvula aórtica → aorta → cuerpo. Arteria = sale del corazón; vena = llega al corazón. La sangre venosa sistémica tiene menos oxígeno y más CO₂ que la arterial sistémica; la circulación pulmonar es una excepción.", "9": "Vasos y ganglios linfáticos, timo y bazo participan en drenaje y defensa. B: anticuerpos (a través de células plasmáticas). T: coordinación y citotoxicidad según subtipo. El timo madura T; el bazo filtra sangre.", "10": "Principales glándulas y estructuras endocrinas: hipotálamo, hipófisis, pineal, tiroides, paratiroides, timo, suprarrenales, páncreas, ovarios y testículos. Insulina ayuda a reducir glucemia. Estrógenos y progesterona participan en reproducción; «hormonas de la felicidad» es un término popular.", "11": "Neurocráneo (8): frontal, 2 parietales, 2 temporales, occipital, esfenoides, etmoides. Cara (14): 2 nasales, 2 maxilares, 2 cigomáticos, 2 lagrimales, 2 palatinos, 2 cornetes nasales inferiores, vómer y mandíbula. Columna: 7 cervicales, 12 torácicas, 5 lumbares, 5 sacras, 4 coccígeas (típico). Mano: 8 carpianos (escafoides, semilunar, piramidal, pisiforme, trapecio, trapezoide, grande y ganchoso), 5 metacarpianos, 14 falanges. Dibuja el cráneo de perfil y etiqueta los huesos visibles; revisa los restantes por lista.", "12": "Ruta: riñones → uréteres → vejiga → uretra → exterior. Filtrar no significa que todo lo filtrado se elimine: los riñones recuperan sustancias útiles y regulan la composición de la sangre.", "13": "Posiciones que debes reconocer: supino, lateral, prono, Fowler/semifowler, Sims, litotomía, Trendelenburg, genupectoral y antitrendelenburg. Los decúbitos prono y lateral también tienen variantes quirúrgicas. Identifica la orientación del tronco y la inclinación de la camilla; no practiques maniobras clínicas sin supervisión.", "14": "Sagital: derecha/izquierda. Medio: mitades iguales. Frontal/coronal: anterior/posterior. Transversal: superior/inferior. Piensa en tres cortes perpendiculares.", "15": "No confundas cuatro cuadrantes con nueve regiones. En una vista frontal, el lado derecho del paciente queda a la izquierda del observador. Los órganos pueden ocupar más de una región: las asociaciones son orientativas."};

'use strict';
const LESSON_EXPANDED={"1": ["Florence Nightingale contribuyó a transformar el cuidado de personas enfermas en una actividad organizada y basada en la observación. Durante la guerra de Crimea, en el siglo XIX, trabajó con soldados heridos y promovió mejoras en higiene, ventilación, limpieza, alimentación y organización hospitalaria. Recorrió las salas durante la noche, de donde proviene su sobrenombre. Empleó estadísticas para estudiar la mortalidad y favoreció la formación profesional de enfermeras. Su enfoque ambiental sostiene que las condiciones del entorno influyen en el bienestar y la recuperación.\n\nAntes de su trabajo, muchos centros de atención carecían de condiciones sanitarias adecuadas. Nightingale observó que el ambiente influía en la recuperación y promovió limpieza, ventilación, agua segura, descanso y una alimentación apropiada. También utilizó registros estadísticos para estudiar resultados y defender cambios institucionales. Su aporte no consistió únicamente en atender enfermos, sino en organizar el cuidado mediante observación sistemática. De ahí la relación entre enfermería, prevención de infecciones y evaluación de la calidad asistencial.", "Dos salas pueden ofrecer el mismo tratamiento, pero sus condiciones de higiene y descanso influyen en la experiencia y salud del paciente.", "Nightingale: ambiente, higiene, observación y profesionalización."], "2": ["Virginia Henderson propuso que enfermería ayuda a la persona a recuperar o conservar su independencia cuando le faltan fuerza, voluntad o conocimientos. Las 14 necesidades comprenden respirar; comer y beber; eliminar desechos; moverse y mantener posturas; dormir y descansar; vestirse; conservar la temperatura corporal; higiene y protección de la piel; evitar peligros; comunicarse; vivir según creencias y valores; trabajar y sentirse realizado; recrearse; aprender y utilizar recursos de salud. El modelo integra dimensiones físicas, emocionales, sociales y espirituales.\n\nEl modelo distingue necesidades físicas, psicológicas, sociales y espirituales. Una persona puede respirar adecuadamente y, sin embargo, necesitar ayuda para vestirse, comunicarse o aprender. La tarea del personal consiste en identificar qué necesidad está afectada y qué capacidad conserva el individuo. La independencia es el objetivo siempre que sea posible; cuando no lo es, el apoyo se adapta. Esta perspectiva evita reducir al paciente a una enfermedad y permite comprender por qué el cuidado debe individualizarse.", "Una persona puede comer sin ayuda, pero necesitar apoyo para asearse y caminar. Valorar cada necesidad permite adaptar el cuidado.", "La meta es favorecer autonomía, no hacer todo por la persona."], "3": ["La práctica profesional requiere conocimientos, responsabilidad y límites de actuación. La NOM-019-SSA3-2013 establece características y especificaciones mínimas de la práctica de enfermería dentro del Sistema Nacional de Salud. Distingue niveles de formación y actividades de acuerdo con las competencias. Las intervenciones independientes corresponden al ámbito propio de enfermería; las dependientes requieren indicación de un profesional facultado; las interdependientes se realizan en colaboración. La norma no sustituye la formación ni permite realizar procedimientos fuera de las competencias correspondientes.\n\nUna norma oficial mexicana establece requisitos y criterios de observancia dentro de su ámbito. En enfermería es importante reconocer que las funciones se relacionan con la preparación académica y la competencia profesional. El cuidado requiere comunicación, registro de observaciones y coordinación con el equipo de salud. Distingue una norma de práctica profesional de una teoría de enfermería: una regula aspectos de la actividad, mientras la otra ofrece un marco conceptual para comprender las necesidades. Consulta siempre el texto oficial aplicable.", "Observar y comunicar cambios forma parte del cuidado; ejecutar una indicación clínica exige actuar dentro de las competencias y protocolos aplicables.", "NOM-019-SSA3-2013: práctica de enfermería."], "4": ["La enfermería integra conocimientos científicos, habilidades de cuidado, comunicación y principios éticos. Atiende a personas sanas y enfermas en cualquier etapa de la vida, considerando familia y comunidad. La promoción de salud favorece condiciones saludables; la prevención busca disminuir riesgos; el cuidado durante la enfermedad atiende necesidades y colabora con el equipo. La rehabilitación favorece la recuperación de capacidades y los cuidados paliativos buscan aliviar el sufrimiento. Dignidad, privacidad y autonomía deben respetarse en todo momento.\n\nLa promoción busca fortalecer hábitos y condiciones que favorecen el bienestar; la prevención procura disminuir riesgos de enfermedad; la recuperación atiende necesidades durante el restablecimiento y el acompañamiento también incluye situaciones de enfermedad crónica o final de vida. Una intervención de enfermería no se reduce a ejecutar una técnica: implica comprender la situación, escuchar a la persona y valorar sus respuestas. El trabajo autónomo y el colaborativo se complementan dentro del ámbito de competencia de cada integrante del equipo.", "Educar sobre higiene es promoción y prevención; acompañar a una persona durante su recuperación es cuidado. Ambos pertenecen a enfermería.", "No se limita al hospital ni al cumplimiento de indicaciones: también educa, previene y acompaña."], "5": ["Los músculos esqueléticos se distribuyen por cabeza, cuello, tronco y extremidades. Cada músculo contiene fibras agrupadas en fascículos, rodeados por tejido conectivo. Muchos se unen a los huesos mediante tendones y producen movimiento al generar tensión. También sostienen la postura, estabilizan articulaciones y generan calor. La cifra aproximada de 650 depende de cómo se cuenten subdivisiones y variaciones anatómicas. El músculo liso y el cardíaco también son tejidos musculares, pero no se cuentan como músculos esqueléticos individuales.\n\nLa cantidad exacta depende de cómo se cuenten músculos individuales, variantes anatómicas y grupos musculares. Los músculos se organizan en fascículos formados por fibras largas; los tejidos conectivos que los rodean transmiten fuerza hacia los tendones. Algunos actúan sobre articulaciones y otros, como los de la expresión facial, mueven la piel. En conjunto permiten postura, locomoción, respiración y generación de calor. Por eso aprender su número aproximado no sustituye conocer sus funciones.", "Al caminar trabajan numerosos músculos de las piernas, abdomen y espalda, no solo los del pie.", "650 es una aproximación de músculos esqueléticos."], "6": ["La miología estudia los músculos, su ubicación, forma, inserciones, relaciones y función. Permite comprender cómo trabajan con huesos y articulaciones. La anatomía describe la estructura; la fisiología explica el funcionamiento. Por ejemplo, la miología identifica el bíceps braquial y su participación en la flexión del codo; la fisiología explica la contracción de sus fibras. Los músculos trabajan en grupos que colaboran o se oponen para controlar movimientos.\n\nPara describir un músculo se consideran su origen e inserción, la dirección de sus fibras y las articulaciones sobre las que actúa. Un flexor disminuye el ángulo de una articulación y un extensor lo aumenta. Los músculos agonistas producen un movimiento y los antagonistas realizan la acción opuesta o ayudan a controlarla. Por ejemplo, al flexionar el codo intervienen músculos flexores y al extenderlo cambia la participación muscular. La miología conecta la descripción anatómica con el movimiento observable.", "Al flexionar y extender el codo, bíceps y tríceps intervienen de manera coordinada.", "Miología: músculos; osteología: huesos; artrología: articulaciones."], "7": ["Los tres tejidos musculares contienen proteínas contráctiles, pero difieren en su organización y control. El esquelético posee fibras largas, estriadas y generalmente multinucleadas, bajo control del sistema nervioso somático. El liso tiene células fusiformes sin estriaciones visibles y forma paredes de vísceras y vasos. El cardíaco presenta estriaciones, células ramificadas y uniones que coordinan el latido. La contracción requiere energía en forma de ATP. El músculo esquelético participa también en reflejos, aunque se clasifique como voluntario.\n\nEn el músculo esquelético las unidades contráctiles se ordenan regularmente y producen estrías visibles. En el cardíaco también existen estrías, pero las células se ramifican y se conectan entre sí para coordinar la contracción. En el liso, la organización de las proteínas contráctiles no produce las mismas bandas visibles. El músculo liso permite cambios de diámetro en vasos y desplazamiento de contenido visceral. La clasificación no depende solamente del movimiento voluntario, sino también de la estructura microscópica.", "Levantar la mano: esquelético; mover alimento por el intestino: liso; impulsar sangre: cardíaco.", "Estriado no siempre significa voluntario: el corazón también es estriado."], "8": ["El tamaño muscular depende en parte del tamaño de sus fibras. Ante cargas repetidas y recuperación adecuada, las fibras pueden aumentar su contenido de proteínas contráctiles y su sección transversal: esto es hipertrofia. No equivale a formar más células, proceso denominado hiperplasia. La atrofia es la disminución de tamaño, como puede ocurrir con inmovilización prolongada. No toda hipertrofia es saludable: algunas formas cardíacas son una adaptación a sobrecarga.\n\nEl entrenamiento de fuerza genera una demanda mecánica que activa procesos celulares de adaptación. Cuando la síntesis de proteínas contráctiles supera su degradación durante un periodo suficiente, aumenta el tamaño de las fibras. No equivale a hiperplasia, que significa aumento en el número de células, ni a inflamación transitoria. La atrofia representa una disminución de tamaño asociada, entre otras causas, a desuso. El aumento muscular depende de la carga, la recuperación, los nutrientes y las características individuales.", "Un brazo que gana volumen por entrenamiento puede presentar hipertrofia; uno inmovilizado puede perderlo por atrofia.", "Hipertrofia: tamaño. Hiperplasia: número. Atrofia: disminución de tamaño."], "9": ["El miocardio es la capa muscular de la pared cardíaca. Sus células presentan estriaciones y discos intercalares que permiten conexión mecánica y eléctrica. Células especializadas inician impulsos que se propagan por el corazón; señales nerviosas autónomas y hormonales modifican frecuencia y fuerza. La abundancia de mitocondrias y el suministro constante de oxígeno favorecen actividad sostenida. La contracción debe coordinarse para facilitar primero el llenado y luego la expulsión de sangre.\n\nLos discos intercalares conectan las células cardíacas y favorecen el paso de señales eléctricas y la transmisión de fuerza. El sistema de conducción establece una secuencia de activación que permite coordinar aurículas y ventrículos. El miocardio posee numerosas mitocondrias y depende de un suministro continuo de oxígeno para sostener su actividad. Su contracción involuntaria es modulada por señales nerviosas y hormonales, aunque el ritmo se origina normalmente en células especializadas del propio corazón.", "A diferencia del bíceps, el corazón no necesita una decisión consciente para iniciar cada contracción.", "Miocardio: estriado, involuntario, ramificado, rítmico y resistente a la fatiga."], "10": ["El aparato digestivo transforma alimentos complejos en moléculas que el organismo puede incorporar. Sus funciones son ingestión, propulsión, digestión mecánica y química, absorción y eliminación de residuos. El tubo incluye boca, faringe, esófago, estómago, intestinos, recto y ano. Las glándulas salivales, hígado, vesícula y páncreas aportan secreciones o almacenan bilis. Los nutrientes absorbidos se distribuyen por sangre o linfa. El intestino grueso recupera agua y electrolitos y participa en formar heces.\n\nLa digestión mecánica fragmenta y mezcla alimentos sin transformar necesariamente sus moléculas. La química utiliza enzimas y otras sustancias para degradar carbohidratos, proteínas y grasas. La absorción transfiere nutrientes hacia sangre o linfa; no es lo mismo que ingerir ni digerir. El intestino grueso recupera parte del agua y contribuye a formar las heces. Órganos auxiliares como hígado y páncreas aportan sustancias que facilitan estos procesos aunque los alimentos no pasen por ellos.", "Al comer una tortilla, el almidón se transforma en azúcares sencillos aprovechables por el organismo.", "Digestión descompone; absorción incorpora; eliminación expulsa residuos."], "11": ["En la boca los dientes cortan y trituran el alimento. La lengua lo mezcla con saliva y forma un bolo que puede deglutirse. La amilasa salival inicia la degradación del almidón. El bolo pasa por faringe y esófago al estómago, donde el ácido, la pepsina y los movimientos musculares continúan el procesamiento, especialmente de proteínas. La digestión mecánica cambia el tamaño de partículas; la química descompone moléculas mediante enzimas. Por eso la digestión comienza antes de llegar al estómago.\n\nLa saliva humedece el alimento y facilita su deslizamiento, además de contener sustancias que inician la degradación del almidón. La masticación aumenta la superficie expuesta a enzimas. Después, la deglución permite trasladar el bolo hacia la faringe y el esófago, donde el transporte continúa mediante contracciones musculares. Al llegar al estómago se mezcla con jugo gástrico y se transforma en quimo. Por ello, la boca participa activamente en la digestión y no es solamente una entrada.", "Masticar pan durante un tiempo puede producir un sabor algo dulce por la degradación del almidón.", "Boca: comienzo de digestión mecánica y química."], "12": ["El intestino delgado se divide en duodeno, yeyuno e íleon. En el duodeno el contenido se mezcla con bilis y secreciones pancreáticas. Las enzimas intestinales completan gran parte de la digestión. Pliegues, vellosidades y microvellosidades aumentan la superficie de absorción. Los carbohidratos se transforman en monosacáridos, como glucosa, galactosa y fructosa, que atraviesan el epitelio y llegan a la sangre portal. La absorción de estos nutrientes ocurre principalmente en el intestino delgado, con participación importante de duodeno y yeyuno.\n\nLa pared intestinal posee pliegues, vellosidades y microvellosidades que amplían la superficie disponible para absorber nutrientes. Las moléculas de glucosa y otros monosacáridos atraviesan las células del epitelio intestinal y pasan a capilares. Desde allí, gran parte de la sangre intestinal se dirige al hígado mediante el sistema porta. Muchas grasas siguen inicialmente una ruta linfática diferente. Conviene distinguir el sitio donde se digiere un nutriente del lugar donde sus productos se incorporan al organismo.", "El estómago procesa y mezcla; el intestino delgado permite el paso de nutrientes al medio interno.", "No confundas digestión de azúcares con absorción."], "13": ["El hígado es una glándula grande situada bajo el diafragma, principalmente a la derecha. Produce bilis, procesa nutrientes, almacena glucógeno y participa en la transformación de sustancias y síntesis de proteínas plasmáticas. La vesícula almacena y concentra bilis, que facilita la emulsificación de grasas. En cuatro cuadrantes, el hígado ocupa sobre todo el superior derecho; en nueve regiones, el hipocondrio derecho y parte del epigastrio. Puede extenderse a otras regiones.\n\nEl hígado recibe sangre de la vena porta y de la arteria hepática. Participa en el metabolismo de nutrientes, almacena glucógeno, sintetiza diversas proteínas plasmáticas y produce bilis. Esta última facilita la dispersión de grasas en el intestino; no es una enzima. La vesícula biliar almacena y concentra la bilis. Anatómicamente, el hígado ocupa principalmente la región superior derecha y se extiende hacia el epigastrio, de modo que su tamaño supera los límites de una sola región.", "En una vista anterior, la derecha del paciente aparece a tu izquierda.", "Hígado: superior derecho. La bilis facilita la digestión de grasas, pero no es una enzima."], "14": ["El peristaltismo consiste en ondas coordinadas de contracción y relajación de las paredes del tubo digestivo. El músculo liso circular y longitudinal desplaza el contenido. El sistema nervioso entérico y señales autónomas y hormonales regulan el movimiento. También existe segmentación, que mezcla el contenido y favorece el contacto con la mucosa. En el esófago, el peristaltismo lleva el bolo al estómago. Motilidad y secreciones trabajan juntas.\n\nEl tubo digestivo contiene capas musculares cuya actividad está coordinada por el sistema nervioso entérico y otras señales. Cuando un segmento se contrae detrás de su contenido y otro se relaja delante, se facilita la propulsión. En el intestino también existen movimientos de segmentación, que mezclan el contenido y favorecen su contacto con la mucosa. El peristaltismo ocurre incluso en el esófago, por lo que no depende exclusivamente de la gravedad ni es exclusivo del intestino.", "Imagina una onda de presión que avanza por un tubo y empuja su contenido.", "Peristaltismo impulsa; segmentación mezcla."], "15": ["El aparato reproductor femenino posee órganos internos y genitales externos. Los internos participan en producción de ovocitos, transporte, fecundación, gestación y menstruación. Los externos forman la vulva, relacionada con protección y sensibilidad. El orificio uretral se encuentra en el vestíbulo, pero pertenece al aparato urinario. La vagina comunica el cuello uterino con el exterior y es diferente de la vulva. Esta división permite describir las estructuras sin confundir su localización o su función.\n\nLos genitales internos se sitúan principalmente dentro de la pelvis y comprenden ovarios, trompas, útero y vagina. Los externos se agrupan bajo el término vulva y protegen la entrada al aparato genital. La anatomía reproductora también está estrechamente relacionada con la vejiga, la uretra y el recto, aunque pertenecen a otros sistemas. Esta proximidad explica por qué conviene aprender la posición relativa de los órganos y no confundir la abertura uretral con la abertura vaginal.", "Ovarios y útero son internos; labios mayores y menores son externos.", "Vulva: conjunto externo. Vagina: conducto interno."], "16": ["Los ovarios contienen folículos y producen hormonas. Las trompas facilitan el transporte del ovocito hacia el útero. El útero posee una pared muscular o miometrio, un revestimiento interno o endometrio y un cuello o cérvix. La vagina es un conducto muscular elástico. Externamente, el monte del pubis cubre la región anterior, los labios delimitan el vestíbulo y el clítoris participa en la sensibilidad. Las aberturas uretral y vaginal son distintas.\n\nEl útero se divide en fondo, cuerpo y cuello uterino o cérvix. La vagina conecta el cuello con el exterior, mientras las trompas se relacionan con la región superior uterina y con los ovarios. Entre los componentes externos están los labios mayores y menores, el clítoris y el vestíbulo. Cada estructura cumple una función particular: producción de gametos, transporte, protección o participación en reproducción. El término vulva no designa el canal vaginal; es el conjunto externo.", "Dibuja ovarios a los lados, trompas hacia el útero, cuello uterino y vagina; etiqueta cada estructura.", "Ovarios producen; trompas transportan; útero aloja; vagina comunica."], "17": ["Las trompas uterinas o salpinges presentan infundíbulo con fimbrias, ampolla, istmo y segmento uterino. Las fimbrias ayudan a aproximar el ovocito liberado a la abertura de la trompa. Los cilios y contracciones del músculo liso favorecen su desplazamiento. La fecundación suele ocurrir en la ampolla, cuando se unen los gametos. Después, el embrión temprano continúa hacia el útero. Fecundación e implantación son procesos diferentes: la implantación normal ocurre en el endometrio.\n\nLas fimbrias se encuentran en el extremo de la trompa próximo al ovario y favorecen la captación del ovocito tras su liberación. Los cilios del epitelio y las contracciones de músculo liso contribuyen al desplazamiento hacia el útero. La ampolla es una región frecuente de fecundación. Si esta ocurre, el embrión temprano continúa su recorrido antes de implantarse en el endometrio. Ovulación, fecundación e implantación son acontecimientos distintos que suceden en estructuras diferentes.", "Ovario libera el ovocito; trompa lo transporta; útero ofrece el sitio habitual de implantación.", "Trompa: transporte y lugar frecuente de fecundación; útero: gestación."], "18": ["Los folículos ováricos se desarrollan bajo señales hormonales. En un ciclo ovulatorio la FSH favorece crecimiento folicular y aumenta la producción de estrógenos. Un aumento de LH desencadena la liberación del ovocito del folículo dominante. Suele liberarse un ovocito secundario. Los ciclos varían entre personas y a lo largo de la vida; 28 días es un ejemplo didáctico, no una regla fija. También existen ciclos sin ovulación. La ovulación no es menstruación.\n\nDurante el desarrollo folicular aumenta la producción de estradiol y, en determinadas condiciones, se desencadena un aumento de hormona luteinizante que precede a la ovulación. No todos los ciclos duran 28 días ni todos presentan ovulación. El día 14 es una referencia aproximada para un ciclo típico de esa duración. Después de la liberación, el folículo restante se transforma en cuerpo lúteo, con actividad hormonal. La maduración del ovocito y su liberación están relacionadas, pero no son idénticas.", "En un ciclo de 28 días se suele ilustrar la ovulación cerca del día 14; no debe asumirse para todos.", "Habitualmente una ovulación por ciclo; la fecha puede variar."], "19": ["El endometrio es la mucosa que recubre la cavidad uterina. La capa basal permanece durante la menstruación y permite regenerar el revestimiento. La capa funcional responde a hormonas: crece por influencia de estrógenos y adquiere características secretoras con progesterona. Si no se establece un embarazo, disminuyen estas hormonas y se desprende parte de la capa funcional. El miometrio, en cambio, es músculo liso y genera contracciones uterinas.\n\nDebajo del endometrio se encuentra el miometrio, una capa de músculo liso que participa en contracciones uterinas; hacia el exterior existe una cubierta serosa en gran parte del órgano. La capa funcional endometrial cambia en respuesta a estrógenos y progesterona: prolifera, se vuelve secretora y puede desprenderse. La basal conserva tejido que permite regenerarla. Por ello, la menstruación no implica la pérdida completa del endometrio ni el desprendimiento de toda la pared uterina.", "Piensa en una superficie renovable que conserva una base para volver a crecer.", "Basal regenera; funcional se modifica y desprende; miometrio contrae."], "20": ["El ciclo ovárico y uterino ocurren en paralelo. El día 1 corresponde al inicio del sangrado. En fase folicular crece un folículo y aumentan estrógenos, que estimulan el crecimiento endometrial. El aumento de LH desencadena ovulación. Luego se forma el cuerpo lúteo, que produce progesterona y favorece la fase secretora del endometrio. Si no se establece embarazo, el cuerpo lúteo involuciona, bajan las hormonas y comienza otro sangrado. La ovulación y menstruación son eventos distintos.\n\nEn la fase folicular se desarrolla un folículo ovárico y aumenta el estradiol, favoreciendo la proliferación endometrial. Tras la ovulación, la fase lútea se caracteriza por la actividad del cuerpo lúteo y la progesterona, que contribuye a la transformación secretora del endometrio. Si no se establece un embarazo, disminuye la actividad hormonal y se inicia un nuevo sangrado. Distingue las fases del ovario de las fases de la mucosa uterina: están coordinadas, pero tienen nombres y funciones diferentes.", "Modelo de 28 días: menstruación al inicio, ovulación cerca de la mitad y fase lútea después.", "Folículo → ovulación → cuerpo lúteo → descenso hormonal → menstruación."], "21": ["Los testículos son las gónadas masculinas y se encuentran habitualmente en el escroto. En los túbulos seminíferos se forman espermatozoides mediante espermatogénesis; las células de Sertoli les dan apoyo. Las células de Leydig producen testosterona bajo estímulo de LH. FSH y testosterona contribuyen al mantenimiento de la espermatogénesis. El epidídimo recibe los espermatozoides y participa en su maduración y almacenamiento. El escroto ayuda a mantener condiciones térmicas adecuadas para su producción.\n\nLos túbulos seminíferos alojan células germinales y células de Sertoli, que favorecen el desarrollo de los espermatozoides. En el tejido entre los túbulos se encuentran células de Leydig, encargadas de sintetizar testosterona. La hipófisis interviene mediante FSH y LH. Los espermatozoides pasan posteriormente al epidídimo, donde adquieren características necesarias para su función. La localización escrotal ayuda a mantener condiciones térmicas favorables para la espermatogénesis. La función endocrina y reproductiva se complementan.", "Un testículo cumple una función reproductiva y otra endocrina; el epidídimo no sustituye ninguna.", "Testículos: gametos y testosterona. Epidídimo: maduración y almacenamiento."], "22": ["Los conductos deferentes son tubos musculares que continúan desde el epidídimo. Sus contracciones ayudan a transportar espermatozoides hacia los conductos eyaculadores. Las vesículas seminales y la próstata aportan secreciones que forman parte del semen. Los espermatozoides son células; el semen es la mezcla de células con secreciones. El recorrido termina en la uretra. Los deferentes no transportan orina y no deben confundirse con los uréteres.\n\nEl recorrido de los espermatozoides continúa desde el epidídimo hacia cada conducto deferente. Cerca de la próstata, este se une con el conducto de la vesícula seminal para formar el conducto eyaculador. Las secreciones de glándulas accesorias contribuyen al volumen y composición del semen. El conducto deferente no produce espermatozoides, ni lleva orina desde la vejiga. Para memorizar la ruta, distingue producción en testículo, maduración en epidídimo y transporte por conductos.", "Sigue el recorrido: testículo → epidídimo → deferente → conducto eyaculador → uretra.", "Deferente lleva espermatozoides; uréter lleva orina del riñón a vejiga."], "23": ["La uretra conecta la vejiga con el exterior. En la anatomía masculina atraviesa próstata, suelo pélvico y pene; participa en la salida de orina y semen, en momentos diferentes. Los uréteres son dos conductos que transportan orina desde los riñones hasta la vejiga. La vejiga almacena orina y los esfínteres contribuyen a controlar su salida. La uretra no fabrica orina ni la lleva desde los riñones.\n\nLos uréteres desembocan en la vejiga y la uretra sale de ella. En el varón, la uretra pasa por la próstata y el pene y también conduce semen durante la eyaculación, en momentos distintos de la micción. En la mujer, es más corta y posee una abertura propia en el vestíbulo vulvar. Los esfínteres y la musculatura de la vejiga participan en el control urinario. No confundas el nombre uretra con uréter, aunque ambos sean conductos.", "Si un conducto une riñón y vejiga, es uréter; si comunica vejiga y exterior, es uretra.", "Uréteres entran a vejiga; uretra sale de vejiga."], "24": ["El pene está formado por tejidos eréctiles, dos cuerpos cavernosos y un cuerpo esponjoso que rodea parte de la uretra. Participa en la micción y reproducción. Durante la erección aumenta el llenado sanguíneo de sus tejidos. En la reproducción por coito vaginal, el semen se deposita normalmente en la vagina; los espermatozoides pueden avanzar por el cuello uterino hacia útero y trompas. El pene no deposita directamente espermatozoides en el útero.\n\nLos cuerpos cavernosos y el cuerpo esponjoso contienen espacios vasculares que pueden llenarse de sangre durante la erección. El cuerpo esponjoso rodea la uretra y forma el glande en su extremo. La erección y la eyaculación son fenómenos fisiológicos distintos, regulados mediante mecanismos vasculares y nerviosos. El semen se deposita habitualmente en la vagina, no directamente en el útero. Desde allí, los espermatozoides pueden avanzar por el cuello uterino hacia otras estructuras del aparato reproductor.", "Distingue el órgano que permite depositar semen del conducto por el que sale.", "Pene: órgano; uretra: conducto; semen: fluido con células y secreciones."], "25": ["La hiperplasia prostática benigna consiste en crecimiento no canceroso de la próstata, que puede dificultar el paso de orina. La prostatitis reúne procesos inflamatorios de distintas causas. El varicocele consiste en dilatación de venas del cordón espermático; la criptorquidia es falta de descenso de uno o ambos testículos al escroto. Estas alteraciones afectan estructuras diferentes y no son equivalentes. Conocer su significado facilita comprender términos médicos, aunque los síntomas por sí solos no permiten establecer un diagnóstico.\n\nLa próstata rodea parte de la uretra y aporta secreciones al semen. Su crecimiento puede dificultar el flujo urinario, mientras que la prostatitis implica inflamación y puede tener distintas causas. Otras alteraciones incluyen el varicocele, relacionado con dilatación venosa, y la criptorquidia, cuando un testículo no ha descendido adecuadamente. Estudiar estas diferencias ayuda a relacionar cada afección con la estructura comprometida. Los síntomas no permiten establecer por sí solos un diagnóstico y requieren valoración profesional.", "Relaciona próstata con hiperplasia/prostatitis, venas con varicocele y descenso testicular con criptorquidia.", "Hiperplasia benigna no equivale a prostatitis ni a cáncer."], "26": ["La célula es la unidad fundamental del organismo. La membrana plasmática delimita su contenido y regula intercambios; el citoplasma contiene componentes que realizan funciones; en células eucariotas típicas, el núcleo guarda gran parte del ADN. Las mitocondrias participan en producción de ATP, los ribosomas sintetizan proteínas y otros orgánulos las procesan o transportan. Las células se especializan: neuronas transmiten señales, fibras musculares generan fuerza y eritrocitos transportan gases. Células organizadas forman tejidos; varios tejidos constituyen órganos.\n\nLas células del organismo se especializan en tareas diferentes. Una neurona transmite señales, una célula muscular genera fuerza y una célula epitelial forma barreras. En las células eucariotas, el núcleo almacena información genética; las mitocondrias contribuyen a la producción de ATP; el retículo endoplasmático y el aparato de Golgi participan en síntesis y procesamiento de moléculas. La coordinación de estas estructuras permite conservar la actividad celular. Tejidos, órganos y sistemas surgen de la organización de células especializadas.", "El corazón incluye tejido muscular, conectivo, nervioso y vasos, todos formados por células especializadas.", "Célula → tejido → órgano → sistema → organismo."], "27": ["Las células intercambian materia y energía con el medio. La nutrición incluye obtención de sustancias y metabolismo; las mitocondrias participan en transformar energía química en ATP. La relación permite responder a señales químicas, eléctricas o mecánicas. La reproducción celular, cuando ocurre, produce nuevas células. La mitosis contribuye a crecimiento y renovación de tejidos. No todas las células maduras conservan capacidad de dividirse. Mantener condiciones internas adecuadas permite el funcionamiento normal.\n\nLa membrana controla intercambios mediante mecanismos como difusión, transporte facilitado y transporte activo. Las células obtienen energía química y responden a señales de su entorno mediante receptores. La reproducción celular permite crecimiento y reparación en muchos tejidos, pero no todas las células maduras se dividen. Por ejemplo, algunas células diferenciadas dependen de células precursoras para renovarse. La función de relación incluye percibir cambios, transmitir información y ajustar la actividad interna para conservar condiciones compatibles con la vida.", "Una fibra muscular responde a estímulos, utiliza ATP al contraerse y depende de nutrientes y oxígeno.", "Nutrición, relación y reproducción; la división depende del tipo celular."], "28": ["Las células procariotas carecen de núcleo delimitado por membrana; su ADN se encuentra en una región llamada nucleoide. Las bacterias son ejemplos. Las eucariotas poseen en su organización típica núcleo y orgánulos especializados; incluyen animales, plantas, hongos y protistas. Las células animales no poseen pared celular ni cloroplastos; las vegetales típicas poseen pared y las fotosintéticas contienen cloroplastos. Un eritrocito humano maduro pierde su núcleo por especialización, pero procede de células eucariotas.\n\nLas bacterias son ejemplos de procariotas y poseen membrana, material genético y ribosomas, aunque carecen de núcleo delimitado. Las células humanas son eucariotas; la mayoría contiene núcleo y organelos membranosos, con excepciones como los eritrocitos maduros. Las células vegetales también son eucariotas y suelen poseer pared celular y cloroplastos en tejidos fotosintéticos. La distinción fundamental no es tamaño ni forma, sino organización interna del material genético y compartimentos celulares. Ambas categorías realizan funciones biológicas esenciales.", "Una bacteria y una célula de piel tienen membrana y material genético, aunque su organización interna sea diferente.", "Procariota no significa sin ADN: significa sin núcleo membranoso."], "29": ["La piel posee dos capas principales, epidermis y dermis, y por debajo se encuentra la hipodermis. La epidermis es epitelial, carece de vasos y forma una barrera protectora. La dermis contiene tejido conectivo, vasos, nervios, folículos y glándulas. La hipodermis posee tejido adiposo y conectivo, que ayudan a aislamiento, amortiguación y unión con estructuras profundas. El sistema tegumentario protege, percibe estímulos y regula temperatura; el sudor y flujo sanguíneo cutáneo contribuyen a controlar el calor.\n\nLa epidermis está formada principalmente por queratinocitos y carece de vasos sanguíneos propios. La dermis contiene fibras de colágeno y elastina, vasos, receptores sensitivos y anexos como folículos y glándulas. La hipodermis, situada por debajo, contiene tejido conectivo y grasa que amortiguan y aíslan. La piel participa en protección frente al medio, percepción y regulación de temperatura. En anatomía estricta, la hipodermis es subcutánea; en explicaciones introductorias suele presentarse como una tercera capa asociada.", "Una lesión superficial afecta estructuras diferentes de otra que llega a la dermis, donde hay vasos y nervios.", "De superficial a profundo: epidermis, dermis, hipodermis. Esta última está debajo de la piel propiamente dicha."], "30": ["La melanina es un pigmento sintetizado por melanocitos, situados principalmente en la capa basal de la epidermis. Se transfiere en melanosomas a los queratinocitos. Su cantidad, tipo y distribución contribuyen al color de la piel y absorben parte de la radiación ultravioleta. El color también depende de circulación sanguínea y carotenoides. La exposición solar puede estimular cambios de pigmentación, pero la melanina no proporciona protección absoluta frente a radiación UV.\n\nLos melanocitos transfieren pigmento en estructuras llamadas melanosomas a los queratinocitos. Las diferencias de color dependen en parte de la cantidad, tipo y distribución de melanina, no simplemente del número de melanocitos. La exposición a radiación ultravioleta puede estimular su producción; el pigmento contribuye a limitar daño, pero no ofrece protección completa. Otros factores, como la hemoglobina y el caroteno, también influyen en el aspecto de la piel. Melanocito designa la célula y melanina el pigmento.", "Melanocito es la célula productora; melanina es la sustancia pigmentaria.", "Distingue célula, producto y función de protección parcial."], "31": ["La duración celular depende de especialización y exigencias del tejido. El epitelio intestinal se renueva en pocos días porque está expuesto al contenido digestivo. Los eritrocitos circulan unos 120 días y después se retiran de la circulación. La renovación epidérmica ocurre a lo largo de semanas; muchas neuronas pueden persistir décadas. Células madre y progenitoras permiten reemplazar numerosas células perdidas. Los tejidos no poseen idéntica capacidad regenerativa.\n\nLos tejidos expuestos a desgaste, como el epitelio intestinal, requieren renovación frecuente por células precursoras. Los eritrocitos circulan durante meses antes de ser retirados, principalmente por células del sistema fagocítico. Algunas neuronas persisten durante décadas y no se sustituyen fácilmente. La apoptosis es un mecanismo regulado de muerte celular que contribuye al mantenimiento de tejidos. Por lo tanto, no existe una duración única para todas las células; depende de su función, ambiente y capacidad de renovación.", "Compara el revestimiento intestinal, sometido a desgaste, con una neurona que conserva conexiones especializadas.", "No existe una vida celular universal: aprende ejemplos y unidades de tiempo."], "32": ["Una enfermedad puede surgir al alterarse procesos como regulación de división, expresión genética o transporte. En el cáncer, cambios acumulados permiten que ciertas células proliferen sin los controles normales y algunas invadan tejidos. En anemia falciforme, una variante hereditaria de hemoglobina puede deformar eritrocitos en determinadas condiciones, afectando su circulación y supervivencia. Los mecanismos son distintos: uno implica crecimiento desregulado; el otro, alteración de una proteína sanguínea.\n\nEn el cáncer se alteran mecanismos que normalmente controlan proliferación, supervivencia y comportamiento celular. La anemia falciforme, en cambio, se relaciona con una variante hereditaria de la hemoglobina que afecta las propiedades de los eritrocitos. Son ejemplos de alteraciones celulares diferentes: una afecta el control del crecimiento y otra modifica una proteína y la función de una célula especializada. Comprender estos mecanismos es más útil que memorizar solamente nombres de enfermedades. La confirmación diagnóstica corresponde a profesionales de salud.", "La forma del eritrocito influye en su paso por vasos pequeños; la división celular influye en la organización tisular.", "Cáncer: proliferación desregulada. Falciforme: hemoglobina y eritrocitos alterados."], "33": ["El sistema cardiovascular transporta oxígeno, nutrientes, señales químicas y desechos. El corazón es una bomba; arterias llevan sangre desde él, capilares permiten intercambio con tejidos y venas devuelven sangre. Dos circuitos conectados lo organizan: pulmonar, entre corazón y pulmones, y sistémico, entre corazón y resto del cuerpo. Las paredes arteriales soportan presiones relativamente mayores; muchas venas poseen válvulas que ayudan al retorno. La sangre es el medio de transporte.\n\nLas arterias conducen sangre desde el corazón y las venas la llevan hacia él; los capilares permiten intercambio de sustancias con los tejidos. La circulación pulmonar comunica el corazón con los pulmones, mientras la sistémica lo conecta con el resto del organismo. La sangre transporta además células defensivas y participa en regulación térmica y coagulación. El flujo requiere una diferencia de presión generada por la actividad cardíaca. Cada componente cumple una tarea y depende del funcionamiento de los demás.", "El oxígeno incorporado en pulmones llega al corazón y desde allí se distribuye hacia tejidos.", "Corazón, vasos y sangre forman un circuito integrado."], "34": ["Cuatro cavidades cardíacas se separan mediante tabiques y válvulas. Las aurículas reciben sangre; los ventrículos la expulsan. La aurícula derecha recibe sangre sistémica y la envía al ventrículo derecho por tricúspide. Este impulsa sangre hacia pulmones. La aurícula izquierda recibe sangre de venas pulmonares y la envía al ventrículo izquierdo por mitral. El ventrículo izquierdo posee pared muscular más gruesa y bombea a la aorta y al cuerpo.\n\nLa aurícula derecha recibe sangre que vuelve del organismo y la dirige al ventrículo derecho mediante la válvula tricúspide. Este ventrículo la impulsa hacia los pulmones. Las venas pulmonares llevan sangre a la aurícula izquierda, que se comunica con el ventrículo izquierdo por la mitral. Desde allí sale hacia la aorta. El ventrículo izquierdo posee una pared muscular más gruesa porque debe impulsar sangre por la circulación sistémica. Memoriza el recorrido como un circuito, no como cuatro nombres aislados.", "Sigue una gota: aurícula derecha → ventrículo derecho → pulmones → aurícula izquierda → ventrículo izquierdo → cuerpo.", "Aurícula recibe; ventrículo expulsa. Derecha hacia pulmones; izquierda hacia cuerpo."], "35": ["En diástole ventricular los ventrículos se relajan y baja su presión. Las válvulas semilunares se cierran; cuando la presión auricular supera la ventricular se abren las auriculoventriculares. La sangre pasa a los ventrículos principalmente de forma pasiva y la contracción auricular contribuye al llenado final. No significa que el corazón deje de funcionar: es una etapa necesaria del ciclo. La duración de las fases varía con la frecuencia cardíaca.\n\nAl principio de la relajación ventricular existe un intervalo en el que ambas clases de válvulas están cerradas: disminuye la presión sin cambiar el volumen ventricular. Cuando se abren las válvulas auriculoventriculares, comienza el llenado. En condiciones habituales, la mayor parte del llenado ocurre antes de la contracción auricular, que aporta volumen adicional. Si aumenta la frecuencia cardíaca, puede acortarse el tiempo disponible para llenado. Recuerda que aurículas y ventrículos tienen fases de contracción y relajación coordinadas, no simultáneas en todo momento.", "Una bomba necesita recibir líquido antes de impulsarlo. La diástole facilita ese llenado.", "Diástole: relajación y llenado ventricular."], "36": ["Durante sístole ventricular aumenta la tensión del miocardio y se eleva la presión interna. Tricúspide y mitral se cierran, evitando retroceso a aurículas. Al inicio existe un breve periodo con todas las válvulas cerradas. Cuando la presión ventricular supera la arterial, se abren las semilunares y se expulsa sangre hacia ambos circuitos. Luego los ventrículos se relajan y las semilunares se cierran para comenzar otro ciclo.\n\nLa sístole ventricular inicia con la contracción a volumen prácticamente constante mientras las válvulas permanecen cerradas. Cuando la presión ventricular supera la de los vasos de salida, se abren las válvulas aórtica y pulmonar. La sangre es expulsada durante la fase de eyección. Al caer la presión se cierran estas válvulas y comienza la relajación. El volumen expulsado en cada latido se denomina volumen sistólico; junto con la frecuencia cardíaca determina el gasto cardíaco.", "El ventrículo izquierdo genera presión suficiente para impulsar sangre por la circulación sistémica.", "Sístole: contracción; la eyección empieza al abrirse las semilunares."], "37": ["Las válvulas cardíacas favorecen el flujo unidireccional según diferencias de presión. Tricúspide y mitral comunican aurículas y ventrículos; pulmonar y aórtica comunican ventrículos y arterias. Durante la fase de eyección, la pulmonar permite salida del ventrículo derecho al tronco pulmonar; la aórtica permite salida del izquierdo a aorta. Las auriculoventriculares permanecen cerradas. Al cerrarse después las semilunares, impiden el retorno de sangre a los ventrículos.\n\nLas válvulas no se abren por una orden muscular propia: se mueven según la diferencia de presión entre las cavidades y los vasos. Los músculos papilares y cuerdas tendinosas ayudan a evitar que las válvulas auriculoventriculares se inviertan durante la contracción. Las semilunares se sitúan en las salidas ventriculares y no tienen ese mismo sistema de cuerdas. Su cierre impide el retroceso desde aorta y tronco pulmonar. Dibuja dos rutas de salida para recordar a qué ventrículo corresponde cada válvula.", "Ventrículo derecho y salida: pulmonar. Ventrículo izquierdo y salida: aórtica.", "Auriculoventriculares: entrada ventricular. Semilunares: salida."], "38": ["Los eritrocitos o hematíes son células especializadas en transporte de gases. En la madurez tienen forma de disco bicóncavo y carecen de núcleo, lo que favorece flexibilidad y espacio para hemoglobina. Esta proteína contiene hierro y se une reversiblemente al oxígeno en pulmones; en tejidos libera parte del oxígeno. Los eritrocitos también contribuyen al transporte de CO₂, gran parte del cual circula como bicarbonato en plasma. La médula ósea produce eritrocitos nuevos.\n\nLa forma bicóncava del eritrocito aumenta la relación entre superficie y volumen y facilita el intercambio gaseoso. La hemoglobina fija oxígeno de manera reversible; además, los eritrocitos contribuyen al transporte de dióxido de carbono, gran parte del cual circula como bicarbonato. Se forman en médula ósea mediante eritropoyesis, estimulada en parte por eritropoyetina renal. Su ausencia de núcleo en madurez deja espacio para hemoglobina. No deben confundirse con leucocitos, que cumplen funciones inmunitarias, ni con plaquetas.", "Al pasar por capilares de un músculo, los eritrocitos ayudan a entregar oxígeno necesario para metabolismo.", "Eritrocito = hematíe = glóbulo rojo; hemoglobina = proteína transportadora."], "39": ["La sangre obtiene su color de la hemoglobina. Con mayor oxigenación suele ser rojo brillante; con menor oxigenación, rojo oscuro, no azul. En circuito sistémico las arterias generalmente llevan sangre más oxigenada y las venas sangre con menos oxígeno y más CO₂. En circuito pulmonar se invierte esa relación habitual: arterias pulmonares llevan sangre menos oxigenada y venas pulmonares llevan sangre más oxigenada. Arteria y vena se definen por dirección de flujo, no por oxigenación.\n\nLa sangre venosa suele contener menos oxígeno y más dióxido de carbono que la arterial sistémica, pero ambas contienen ambos gases. Las venas pulmonares son una excepción importante a la asociación habitual entre vena y sangre poco oxigenada; las arterias pulmonares conducen sangre hacia los pulmones con menor oxigenación. La sangre humana no es azul: el aspecto azulado de ciertas venas visibles depende de efectos ópticos en la piel. Arteria y vena se definen por dirección del flujo, no por color.", "En un dibujo los vasos azules son una convención; la sangre real continúa siendo roja.", "Arteria sale; vena vuelve. Recuerda la excepción pulmonar."], "40": ["La sangre es tejido conectivo líquido. El plasma representa aproximadamente 55% del volumen y contiene agua, proteínas, nutrientes, hormonas y electrolitos. Los elementos formes ocupan alrededor de 45%, principalmente eritrocitos, junto con leucocitos y plaquetas. Los leucocitos participan en defensa; las plaquetas son fragmentos celulares que contribuyen a hemostasia. El hematocrito mide la fracción ocupada por eritrocitos y puede variar. El suero se obtiene tras coagulación y difiere del plasma en ciertos factores de coagulación.\n\nEl plasma contiene agua, electrolitos, nutrientes, proteínas y productos de desecho. Entre sus proteínas se encuentran albúmina, globulinas y fibrinógeno. Los eritrocitos transportan gases; los leucocitos participan en defensa y las plaquetas, fragmentos celulares, intervienen en la hemostasia. Al separar una muestra de sangre pueden distinguirse capas relacionadas con estos componentes. Los porcentajes de plasma y elementos formes son aproximados y dependen del hematocrito y otras condiciones. No confundas plasma con suero, que se obtiene después de la coagulación.", "Al centrifugar sangre anticoagulada, se distingue plasma arriba y eritrocitos en el fondo.", "Plasma transporta; eritrocitos gases; leucocitos defensa; plaquetas hemostasia."], "41": ["Parte del líquido que sale de capilares hacia tejidos no regresa directamente a los vasos sanguíneos. Los capilares linfáticos recogen ese exceso, que recibe el nombre de linfa, y lo transportan por vasos hacia conductos que desembocan en la circulación venosa. Los ganglios filtran linfa y facilitan encuentros entre células inmunitarias y sustancias extrañas. El sistema linfático también participa en absorción intestinal de grasas mediante vasos especializados. A diferencia del corazón, no posee una bomba central; el movimiento corporal, las contracciones de vasos y válvulas contribuyen al flujo.\n\nLos capilares linfáticos captan líquido intersticial y lo trasladan a vasos mayores que finalmente desembocan en la circulación venosa. Los ganglios situados a lo largo del recorrido contienen células defensivas que examinan sustancias presentes en la linfa. La contracción muscular, las válvulas linfáticas y otros mecanismos favorecen el desplazamiento. El sistema también absorbe parte de las grasas intestinales mediante vasos especializados. Cuando se altera el drenaje, puede acumularse líquido en los tejidos; esta es una relación entre circulación y equilibrio hídrico.", "Si el drenaje linfático se altera, puede acumularse líquido en tejidos. Esto permite comprender la función de drenaje.", "Linfa: líquido; ganglio: filtro inmunitario; vasos: transporte."], "42": ["El timo es un órgano linfoide situado en la parte anterior del tórax, detrás del esternón. Precursores de linfocitos originados en médula ósea llegan allí para madurar como linfocitos T. Durante la selección, se favorecen células capaces de reconocer señales adecuadas y se eliminan muchas que reaccionan intensamente contra componentes propios. Esto contribuye a tolerancia inmunitaria. El timo es especialmente activo durante infancia y juventud y disminuye de tamaño con la edad, aunque conserva actividad.\n\nLos precursores de linfocitos T se originan en médula ósea y migran al timo. Allí atraviesan procesos de selección que favorecen células capaces de reconocer señales inmunitarias y limitan aquellas con respuestas peligrosas contra componentes propios. El órgano es especialmente activo durante etapas tempranas de la vida y cambia con la edad. A diferencia del bazo, su tarea destacada no es filtrar eritrocitos envejecidos. El timo pertenece al conjunto de órganos relacionados con el desarrollo inmunitario.", "La médula ósea genera precursores; el timo es un lugar de maduración y selección de linfocitos T.", "T de timo: recuerda dónde maduran los linfocitos T."], "43": ["El bazo se encuentra principalmente en el hipocondrio izquierdo, cerca del estómago. Su pulpa roja interviene en eliminar eritrocitos envejecidos y reciclar componentes; su pulpa blanca contiene tejido inmunitario que responde a sustancias presentes en la sangre. También puede almacenar parte de las plaquetas. A diferencia de los ganglios linfáticos, que filtran linfa, el bazo examina sangre. Su función conecta los sistemas cardiovascular, hematológico e inmunitario.\n\nLa pulpa roja del bazo contiene estructuras que facilitan retirar eritrocitos envejecidos y recuperar componentes útiles como el hierro. La pulpa blanca reúne células inmunitarias que responden a antígenos transportados por la sangre. A diferencia de los ganglios, el bazo vigila principalmente sangre y no linfa. Se ubica cerca de las costillas inferiores izquierdas. Sus funciones explican por qué aparece tanto al estudiar el sistema linfático como al analizar el mantenimiento de componentes sanguíneos.", "Un eritrocito envejecido puede ser retirado al pasar por el bazo; una sustancia extraña sanguínea puede activar respuestas inmunes.", "Bazo filtra sangre; ganglio filtra linfa; timo madura T."], "44": ["Los linfocitos B forman parte de la inmunidad adaptativa. Se originan y maduran principalmente en médula ósea. Sus receptores reconocen antígenos específicos. Al activarse mediante señales apropiadas, pueden multiplicarse y diferenciarse en células plasmáticas productoras de anticuerpos o en células de memoria. Los anticuerpos se unen a antígenos y pueden neutralizar agentes o facilitar su eliminación por otros mecanismos. La memoria inmunitaria favorece respuestas posteriores más rápidas ante el mismo antígeno.\n\nUn linfocito B puede reconocer un antígeno mediante receptores específicos. Después de recibir señales apropiadas, algunas células se diferencian en plasmáticas que secretan anticuerpos y otras se convierten en células de memoria. Los anticuerpos pueden neutralizar sustancias, marcar microorganismos y colaborar con otros mecanismos inmunitarios. La memoria contribuye a una respuesta más eficaz ante determinados contactos posteriores. La denominación inmunidad humoral se relaciona con moléculas presentes en líquidos corporales, a diferencia de mecanismos celulares mediados por linfocitos T.", "Una vacuna puede estimular respuestas adaptativas y memoria sin que sea necesario padecer la enfermedad que intenta prevenir.", "B: anticuerpos mediante células plasmáticas y memoria inmunitaria."], "45": ["Los linfocitos T maduran en el timo y participan en respuestas adaptativas. Los T colaboradores (CD4) emiten señales que ayudan a coordinar otras células, incluidos linfocitos B. Los T citotóxicos (CD8) reconocen y eliminan determinadas células infectadas o alteradas. Los T reguladores ayudan a limitar respuestas excesivas contra el propio organismo. Los T no realizan todos la misma tarea y no son los principales productores de anticuerpos. La inmunidad funciona mediante cooperación de muchos tipos celulares.\n\nLos linfocitos T colaboradores coordinan respuestas mediante señales que influyen en otras células inmunitarias. Los citotóxicos pueden eliminar células infectadas o alteradas, mientras otros subtipos regulan la intensidad de la respuesta. Las células T reconocen antígenos en contextos moleculares específicos, y no fabrican anticuerpos como función principal. Algunos linfocitos permanecen como células de memoria. Los grupos B y T cooperan: no son dos sistemas completamente separados, sino participantes de la inmunidad adaptativa.", "Si una célula está infectada por un virus, ciertos linfocitos T pueden reconocerla y eliminarla; los B contribuyen mediante anticuerpos.", "T colaboradores coordinan; citotóxicos eliminan células; reguladores moderan."], "46": ["El sistema endocrino regula actividades corporales mediante señales químicas llamadas hormonas. Las células endocrinas liberan hormonas al medio interno, generalmente hacia la sangre. Estas viajan hasta tejidos con receptores capaces de reconocerlas. Regulan crecimiento, metabolismo, reproducción, equilibrio de líquidos y respuesta al estrés. Muchas secreciones se ajustan por retroalimentación negativa: cuando se alcanza un efecto suficiente, se reduce el estímulo hormonal. Las glándulas exocrinas, en contraste, liberan secreciones por conductos o hacia superficies.\n\nUna glándula endocrina libera señales al medio interno, a diferencia de una exocrina que secreta por conductos hacia superficies o cavidades. Las hormonas circulan y actúan sobre células con receptores adecuados; por ello no todos los tejidos responden igual a una misma sustancia. Muchas rutas utilizan retroalimentación negativa: el resultado de una señal reduce estímulos que la originaron. Este mecanismo ayuda a mantener variables dentro de rangos fisiológicos. El sistema endocrino coopera con el nervioso en la regulación corporal.", "Cuando aumenta la glucosa después de comer, la secreción de insulina contribuye a regularla.", "Hormona: señal. Receptor: reconoce señal. Retroalimentación: ajusta respuesta."], "47": ["El hipotálamo conecta regulación nerviosa y endocrina; la hipófisis libera hormonas que controlan diversas funciones y glándulas. La pineal produce melatonina vinculada al ritmo sueño-vigilia. La tiroides regula aspectos del metabolismo y las paratiroides contribuyen al control de calcio. El timo tiene funciones inmunitarias y produce señales asociadas a maduración celular. Las suprarrenales participan en estrés y equilibrio de sales; el páncreas endocrino regula glucosa; ovarios y testículos producen hormonas sexuales. No todas las estructuras endocrinas son glándulas exclusivamente endocrinas.\n\nLas glándulas se distribuyen en diferentes regiones: hipófisis y pineal en el encéfalo, tiroides y paratiroides en el cuello, suprarrenales sobre riñones y páncreas en abdomen. Las gónadas poseen además funciones reproductivas. El páncreas es mixto porque produce secreciones digestivas y hormonas. El hipotálamo organiza numerosas señales que influyen en la hipófisis. Para aprenderlas, asocia cada órgano a una hormona representativa y una función, por ejemplo tiroides con regulación metabólica e islotes pancreáticos con glucemia.", "Localiza tiroides en cuello, suprarrenales sobre riñones y páncreas en abdomen; relaciona cada ubicación con una función.", "Aprende glándula, ubicación y función, no únicamente nombres."], "48": ["Dopamina, serotonina, endorfinas y oxitocina suelen agruparse popularmente como sustancias vinculadas al bienestar. La dopamina participa en motivación, recompensa y movimiento. La serotonina interviene en diversos procesos, incluido estado de ánimo y funciones digestivas. Las endorfinas son péptidos relacionados con modulación del dolor. La oxitocina interviene en contracciones uterinas, eyección de leche y algunos comportamientos sociales. No son una clasificación endocrina formal ni una garantía de felicidad; sus efectos dependen de contexto, receptores y circuitos biológicos.\n\nLa dopamina participa en circuitos de movimiento, aprendizaje y motivación; la serotonina interviene en diversas funciones, como sueño y regulación del estado de ánimo. Las endorfinas son péptidos relacionados con modulación del dolor y la oxitocina interviene en contracciones uterinas, eyección de leche y conductas sociales. Cada sustancia posee múltiples funciones y mecanismos complejos; no existe una correspondencia simple entre una molécula y una emoción. Algunas funcionan como neurotransmisores además de otras funciones de señalización.", "La oxitocina tiene una función reproductiva además de sus asociaciones sociales; una sola sustancia puede cumplir funciones distintas.", "Memoriza los cuatro nombres sin confundir neurotransmisores, neuropéptidos y hormonas."], "49": ["La insulina es producida por células beta de los islotes pancreáticos. Tras aumentar la glucemia, su liberación favorece entrada de glucosa a tejidos sensibles, como músculo y tejido adiposo, y el almacenamiento de nutrientes. También disminuye la producción hepática de glucosa. El glucagón, producido por células alfa, ayuda a elevar glucemia cuando es necesario mediante acciones sobre el hígado. Este equilibrio contribuye a mantener niveles adecuados de glucosa. La diabetes implica alteraciones en producción o acción de insulina, según su tipo.\n\nDespués de ingerir carbohidratos, la glucemia puede aumentar y estimular liberación de insulina. En músculo y tejido adiposo, esta hormona favorece mecanismos de entrada de glucosa; también promueve almacenamiento y reduce producción hepática de glucosa. El glucagón, producido por otras células pancreáticas, ayuda a aumentar la disponibilidad de glucosa durante el ayuno. Ambos participan en el equilibrio metabólico. La insulina no destruye azúcar ni todas las células dependen de ella de la misma forma para captar glucosa.", "Después de una comida, parte de la glucosa se utiliza y parte se almacena; la insulina facilita esa regulación.", "Insulina contribuye a bajar glucemia; glucagón contribuye a elevarla."], "50": ["Los ovarios cumplen una función reproductiva y otra endocrina. Contienen folículos que alojan ovocitos; durante su desarrollo producen estrógenos. Después de ovulación, el cuerpo lúteo produce progesterona y también estrógenos. Estas señales influyen en ciclo menstrual y preparación endometrial, además de otros tejidos. La actividad ovárica se regula por señales del hipotálamo y la hipófisis, incluidas FSH y LH. Una glándula puede tener funciones distintas a la secreción hormonal, como producir gametos.\n\nLas células de los folículos ováricos producen hormonas que intervienen en la regulación del ciclo y en diversos tejidos. Tras la ovulación, el cuerpo lúteo secreta especialmente progesterona, además de estrógenos. FSH y LH, procedentes de la hipófisis, coordinan estas etapas. El ovario no debe confundirse con el útero: el primero produce gametos y señales endocrinas; el segundo participa en menstruación y gestación. La función hormonal ovárica cambia a lo largo de las etapas de la vida.", "La liberación de un ovocito es función reproductiva; producir estrógenos y progesterona es función endocrina.", "Ovario = gónada que produce ovocitos y hormonas."], "51": ["Los testículos producen gametos y hormonas. Sus células de Leydig secretan testosterona bajo estímulo de LH, mientras las células de Sertoli colaboran en el desarrollo espermático bajo influencias hormonales que incluyen FSH. La testosterona participa en desarrollo y mantenimiento de características sexuales, tejido muscular y óseo y funciones reproductivas. La hipófisis y el hipotálamo regulan estas señales mediante mecanismos de retroalimentación. Los espermatozoides y testosterona son productos diferentes de estructuras celulares distintas.\n\nLa testosterona participa en el desarrollo y mantenimiento de características sexuales y contribuye a la función reproductiva. Las células de Leydig responden principalmente a LH, mientras FSH y testosterona participan en mecanismos relacionados con las células de Sertoli y la espermatogénesis. El hipotálamo y la hipófisis reciben señales de retroalimentación que regulan esta actividad. Estudiar testículo como glándula endocrina implica comprender su producción hormonal, no solamente la formación de gametos. Ambas funciones ocurren en compartimentos distintos del mismo órgano.", "Un testículo cumple al mismo tiempo una función endocrina y una reproductiva.", "Testículos = espermatozoides y testosterona; Leydig = testosterona."], "52": ["Los estrógenos intervienen en crecimiento endometrial durante la fase proliferativa y participan en mantenimiento óseo y otras funciones. La progesterona predomina funcionalmente después de ovulación y favorece un endometrio secretor. Ambas hormonas se producen en distintas proporciones durante el ciclo, y también están presentes en organismos de ambos sexos. Sus variaciones coordinan cambios del útero con actividad ovárica. No conviene memorizar que cada hormona realiza una sola tarea ni que son exclusivas de un sexo.\n\nLos estrógenos contribuyen al desarrollo de características sexuales y a la salud de diversos tejidos, incluidos los huesos. La progesterona participa en cambios endometriales y en condiciones relacionadas con la gestación. Su concentración varía durante el ciclo; no permanecen en niveles constantes. Ambas hormonas existen también en otros organismos humanos en diferentes concentraciones. La expresión hormonas femeninas es una simplificación escolar para referirse a su importancia en fisiología reproductora ovárica, no significa que sean exclusivas de las mujeres.", "Tras ovulación, el cuerpo lúteo aporta progesterona que favorece la preparación endometrial.", "Estrógenos: proliferación endometrial. Progesterona: fase secretora."], "53": ["Las glándulas suprarrenales se ubican encima de ambos riñones, pero son órganos endocrinos independientes del tejido renal. Cada una posee corteza y médula. La corteza produce hormonas como aldosterona, que participa en equilibrio de sodio y potasio, y cortisol, vinculado con metabolismo y respuesta al estrés. La médula produce catecolaminas como adrenalina y noradrenalina. Las funciones suprarrenales se relacionan con regulación cardiovascular y del medio interno; los riñones, por su parte, filtran sangre y forman orina.\n\nLa corteza suprarrenal posee regiones productoras de mineralocorticoides, glucocorticoides y andrógenos. La aldosterona participa en regulación de sodio y potasio; el cortisol interviene en metabolismo y respuesta al estrés. La médula libera catecolaminas como adrenalina y noradrenalina. Aunque la glándula está situada sobre el riñón, no forma orina ni pertenece funcionalmente al aparato urinario. Sus hormonas pueden influir en procesos renales y cardiovasculares. La ubicación anatómica y la función de un órgano son criterios distintos.", "Una pregunta sobre glándulas encima de los riñones se refiere a suprarrenales, no a los riñones mismos.", "Corteza: cortisol y aldosterona, entre otras. Médula: catecolaminas."], "54": ["El esqueleto comprende huesos, cartílagos y articulaciones. Se divide en axial, que incluye cráneo, columna y caja torácica, y apendicular, que incluye extremidades y sus cinturas. Los huesos son órganos vivos con vasos, nervios, células y matriz mineralizada. La matriz aporta resistencia; los cartílagos y articulaciones permiten diferentes grados de movimiento. Los tendones conectan músculo y hueso y los ligamentos conectan huesos entre sí. La estructura combina firmeza con movilidad.\n\nLos huesos contienen tejido vivo, vasos, nervios y células capaces de remodelar su matriz. El tejido compacto proporciona resistencia y el esponjoso se organiza en trabéculas que distribuyen cargas. Las articulaciones conectan elementos esqueléticos y presentan distintos grados de movilidad. Los cartílagos proporcionan soporte flexible y, en articulaciones sinoviales, contribuyen a reducir fricción. El esqueleto axial organiza el eje corporal y el apendicular comprende extremidades y sus cinturas. No es una estructura inerte ni únicamente mineral.", "La caja torácica protege corazón y pulmones; las articulaciones y músculos permiten movimientos respiratorios.", "Axial = eje del cuerpo; apendicular = extremidades y cinturas."], "55": ["El hueso se remodela durante toda la vida. Los osteoblastos producen matriz orgánica que después se mineraliza; algunos quedan incorporados y se convierten en osteocitos. Los osteocitos mantienen la matriz y participan en detectar cargas mecánicas. Los osteoclastos reabsorben tejido óseo, liberando componentes minerales y permitiendo renovación. El equilibrio entre formación y reabsorción contribuye a conservar la estructura y adaptarla a demandas del cuerpo. El hueso no es un material inerte.\n\nLos osteoblastos secretan osteoide, una matriz rica en colágeno que se mineraliza. Algunos quedan incorporados y se convierten en osteocitos, sensibles a las cargas mecánicas. Los osteoclastos reabsorben tejido mineralizado mediante mecanismos especializados. La remodelación alterna resorción y formación, adaptando el hueso y contribuyendo al equilibrio mineral. Durante crecimiento y reparación, la actividad de estas células se coordina con otras señales. Distingue formar, mantener y reabsorber: son funciones diferentes, aunque todas participan en un mismo proceso.", "Cuando se renueva una pequeña región de hueso, osteoclastos retiran tejido y osteoblastos forman nueva matriz.", "Osteoblasto construye; osteocito mantiene; osteoclasto reabsorbe."], "56": ["El fémur se ubica entre la cadera y la rodilla. Su cabeza se articula con el acetábulo de la pelvis; su extremo inferior participa en la articulación de la rodilla con la tibia y la rótula. Como hueso largo, posee diáfisis o cuerpo y extremos llamados epífisis. Su estructura permite soportar cargas y transmitir fuerzas durante la marcha. Es el hueso de mayor longitud del cuerpo humano; no debe confundirse con tibia, situada en la pierna debajo de la rodilla.\n\nEl extremo proximal del fémur incluye cabeza, cuello y trocánteres, que sirven como referencias articulares y musculares. Su cuerpo o diáfisis transmite cargas entre cadera y rodilla. En el extremo distal, los cóndilos se articulan principalmente con la tibia y la superficie anterior se relaciona con la rótula. El fémur es un hueso largo por su organización estructural, no solamente por medir mucho. Sus características permiten combinar resistencia, movilidad y soporte del peso corporal.", "En un dibujo de extremidad inferior, identifica primero la cadera y rodilla: el hueso entre ambas es el fémur.", "Fémur = muslo; tibia y peroné = pierna anatómica."], "57": ["El atlas es la primera vértebra cervical (C1), de forma anular, situada inmediatamente debajo del cráneo. Se articula con los cóndilos occipitales y contribuye a sostener la cabeza y permitir movimientos de flexión y extensión. La segunda vértebra, axis (C2), tiene una proyección llamada diente u odontoides que permite rotación del atlas y cabeza. Ambas tienen características particulares respecto a otras vértebras. La médula espinal pasa por el conducto vertebral.\n\nEl atlas forma articulaciones con los cóndilos occipitales, que permiten movimientos como la flexión y extensión de la cabeza. A diferencia de muchas vértebras, presenta arcos anterior y posterior y carece de un cuerpo vertebral típico. La segunda vértebra, axis o C2, posee una apófisis odontoides que facilita la rotación en la articulación con C1. Ambos huesos protegen estructuras nerviosas y sostienen el cráneo. Para el examen, relaciona atlas con primera cervical y axis con segunda cervical.", "El gesto de asentir se relaciona en parte con la articulación entre cráneo y atlas; la rotación incluye la articulación atlas-axis.", "C1 = atlas; C2 = axis."], "58": ["El cráneo protege encéfalo y proporciona soporte a estructuras faciales. El neurocráneo incluye ocho huesos: frontal, occipital, esfenoides, etmoides, dos parietales y dos temporales. Los catorce faciales son dos nasales, maxilares, cigomáticos, lagrimales, palatinos y cornetes inferiores, más vómer y mandíbula. El frontal forma la frente; parietales ocupan regiones superiores y laterales; temporales se sitúan lateralmente; occipital en región posterior e inferior. Maxilares sostienen dientes superiores y mandíbula los inferiores. Los huesos profundos no se ven completos en un perfil simple.\n\nEl neurocráneo incluye frontal, occipital, esfenoides, etmoides, dos parietales y dos temporales. Entre los huesos faciales se encuentran maxilares, cigomáticos, nasales, lagrimales, palatinos, cornetes inferiores, vómer y mandíbula. Las suturas unen muchos huesos craneales y permiten reconocer límites en una ilustración. No todos los huesos pueden observarse desde una vista lateral: algunos son internos o se distinguen mejor desde la base. Practica identificando primero frontal, parietal, temporal, occipital y mandíbula antes de añadir estructuras pequeñas.", "Dibuja el perfil; etiqueta frente, bóveda superior, sien, nuca, pómulo, nariz, maxilar y mandíbula. Después enumera los huesos profundos aparte.", "8 neurocraneales + 14 faciales = 22, sin contar huesecillos del oído."], "59": ["El adulto típico presenta 206 huesos: 80 en el esqueleto axial y 126 en el apendicular. Durante crecimiento, diversas piezas óseas se fusionan; por ello el número de elementos óseos cambia respecto a etapas tempranas de la vida. También pueden existir variaciones anatómicas, como huesos sesamoideos adicionales. La cifra clásica se utiliza como referencia de anatomía general. Contar vértebras fusionadas como segmentos o como huesos adultos explica algunas diferencias de conteo.\n\nLos 80 huesos axiales incluyen cráneo y estructuras asociadas, columna, costillas y esternón. Los 126 apendiculares comprenden las cinturas escapular y pélvica, junto con las extremidades. Al nacer, ciertos elementos aún no se han fusionado; esto explica diferencias entre el recuento infantil y adulto. También existen variantes anatómicas,
