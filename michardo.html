<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Michardo y la Tableta para Miss Paty</title>
<style>
:root{
  --bg:#0f1424;--bg2:#1a2340;--panel:#182341;--panel2:#24325a;--line:#6f87bb;--ink:#eef5ff;
  --gold:#ffd36b;--mint:#73dccd;--rose:#ff9db2;--danger:#ff6f7d;--shadow:#09101f;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at top,#26345d 0,#0a1020 60%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px}
.top{width:min(1120px,100%);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#b8c7ea;padding:0 4px;letter-spacing:.8px}
.top b{color:#fff}
#frame{position:relative;width:min(1120px,100%,calc((100dvh - 104px)*16/9));max-height:calc(100dvh - 104px);aspect-ratio:16/9;border:3px solid #5e71a3;border-radius:18px;overflow:hidden;box-shadow:0 20px 0 #050b17,0 30px 70px #0008;background:#0e1530}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#hud{display:none;position:absolute;inset:10px 10px auto 10px;z-index:2;justify-content:space-between;align-items:flex-start;pointer-events:none}
.panel{background:#0e1934eb;border:2px solid #6f87bb;border-radius:12px;padding:8px 12px;box-shadow:0 4px 0 #071022;font-size:14px;font-weight:900;text-shadow:1px 2px 0 #0007}
#hudLeft span{color:#ffd77e}
#hudRight span{color:#8ff1de}
#overlay{position:absolute;inset:0;z-index:10;background:linear-gradient(135deg,#091225dd,#151b38cc);display:flex;align-items:center;justify-content:center;padding:18px}
#overlay.hidden{display:none}
.card{width:min(760px,95%);max-height:100%;overflow:auto;padding:22px;border:3px solid #8bb2d9;border-radius:22px;background:linear-gradient(180deg,#243a64,#15223f);box-shadow:0 12px 0 #0a1021,0 22px 60px #0009;text-align:center}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#0e1d39;border:1px solid #526ea8;color:#8feadb;font-weight:800;letter-spacing:1.5px;font-size:11px;text-transform:uppercase}
h1{margin:12px 0 8px;font-size:clamp(28px,5vw,48px);line-height:1.02;color:#ffdf8e;text-shadow:3px 4px 0 #814a71}
h2{margin:10px 0;font-size:clamp(22px,3.4vw,32px);color:#ffdd8c}
p{margin:10px auto;max-width:640px;line-height:1.55;font-size:clamp(13px,1.8vw,17px)}
.hero{font-size:clamp(50px,8vw,90px);line-height:1;filter:drop-shadow(0 8px 0 #071022)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.btn{border:2px solid #fce0a1;background:linear-gradient(#ffd77d,#eeaa63);color:#27334d;font-weight:900;border-radius:12px;padding:11px 18px;box-shadow:0 5px 0 #9e6648;min-height:44px}
.btn.secondary{background:linear-gradient(#36517e,#23365a);border-color:#7da0ce;color:#ecf6ff;box-shadow:0 5px 0 #132340}
.btn:active{transform:translateY(2px);box-shadow:0 3px 0 #132340}
#dialog{display:none;position:absolute;left:4%;right:4%;bottom:4%;z-index:6;background:#101b33f6;border:3px solid #ffda8f;border-radius:14px;padding:14px 18px;box-shadow:0 6px 0 #071022}
#speaker{font-size:14px;font-weight:900;color:#ffd97e}
#dialogText{margin-top:6px;font-size:clamp(12px,1.8vw,18px);line-height:1.48;min-height:44px}
#dialogHint{text-align:right;color:#acbddf;font-size:11px;margin-top:4px}
.controls{width:min(1120px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px}
.group{display:flex;gap:8px}
.ctrl{min-width:52px;min-height:48px;border-radius:12px;border:2px solid #6e87bd;background:linear-gradient(#354f7f,#1c2a4e);box-shadow:0 4px 0 #0b1630;font-size:20px;font-weight:900;user-select:none}
.ctrl.small{font-size:12px;min-width:74px}
.ctrl:active,.ctrl.active{transform:translateY(2px);box-shadow:0 2px 0 #0b1630;background:linear-gradient(#4a6b95,#223458)}
.footer{font-size:11px;color:#99aad0;text-align:center}
.note{font-size:12px;color:#bcd0f1}
.list{display:grid;gap:8px;text-align:left;max-width:620px;margin:14px auto 0}
.list div{background:#10203f;border:1px solid #536fa6;border-radius:10px;padding:10px 12px}
.optionGrid{display:grid;gap:10px;max-width:620px;margin:14px auto 0}
.optionBtn{text-align:left;border:2px solid #7599c5;background:#193050;border-radius:12px;padding:12px;font-weight:800;color:#eef6ff}
.optionBtn:hover{background:#213d68}
@media(max-width:680px){.top{font-size:9px}.ctrl{min-width:46px;min-height:44px}.ctrl.small{min-width:64px;font-size:11px}.footer{font-size:10px}.card{padding:14px}}

/* Adaptación real a pantalla: el lienzo cambia la anchura lógica sin distorsionar a Michardo. */
html,body{height:100%;overscroll-behavior:none}
#app{height:100vh;height:100dvh;min-height:0}
#frame{min-height:0;flex-shrink:1}
.controls .group{align-items:center}
.movement{grid-area:move}.actions{grid-area:actions}.utilities{grid-area:utility}
.utilities{gap:6px}
.utilities .ctrl{font-size:11px;min-width:82px}
.ctrl{touch-action:none;-webkit-tap-highlight-color:transparent}
.card{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
#dialog{overflow:auto;max-height:62%;overscroll-behavior:contain}
@media (min-width: 900px) and (pointer:fine){.controls{gap:10px}.utilities{margin-left:auto}}
@media (hover:none), (pointer:coarse){
 .ctrl{min-height:58px;min-width:58px;font-size:24px}
 .ctrl.small{font-size:12px;min-width:72px}
 .btn,.optionBtn{min-height:50px}
}
@media (max-width: 900px) and (orientation:portrait){
 .top{gap:8px;font-size:10px;letter-spacing:0;flex-wrap:wrap;justify-content:center;text-align:center}
 #app{padding:4px;gap:5px;justify-content:stretch}
 #frame{width:100%;height:auto;max-height:none;flex:1 1 auto;aspect-ratio:auto;border-radius:12px;border-width:2px;box-shadow:none}
 #overlay{padding:8px;align-items:stretch}

 .card h2{font-size:clamp(20px,5vw,28px)}
 .card p{font-size:clamp(14px,3.7vw,17px);line-height:1.45}
 .hero{font-size:clamp(34px,9vw,60px)}
 .badge{font-size:10px;letter-spacing:.6px}
 .row{margin-top:10px}
 .btn{padding:10px 12px;font-size:14px;min-height:46px}
 #hud{inset:5px 5px auto 5px;gap:4px}
 .panel{padding:5px 7px;border-width:1px;font-size:11px;line-height:1.4;box-shadow:none}
 #dialog{left:2%;right:2%;bottom:2%;border-width:2px;padding:12px;border-radius:9px;max-height:55%}
 #speaker{font-size:14px}
 #dialogText{font-size:15px;min-height:0}
 #dialogHint{font-size:11px}
 .controls{width:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"utility utility" "move actions";gap:5px;flex:0 0 auto;min-height:0}
 .movement{grid-area:move;justify-content:flex-start}
 .actions{grid-area:actions;justify-content:flex-end}
 .utilities{grid-area:utility;justify-content:space-between;flex-wrap:nowrap}
 .group{gap:7px}
 .ctrl,.ctrl.small{min-width:0;min-height:62px;padding:5px;border-radius:12px;font-size:24px;flex:1 1 0}
 .utilities .ctrl{min-height:42px;font-size:11px;flex:0 1 auto;padding:4px 12px}
 .actions .ctrl.small{font-size:12px}
 .footer{display:none}
}
@media (max-width:900px) and (orientation:portrait){
 .top{flex:0 0 auto;min-height:22px}
 #frame{min-height:205px}
 .controls{padding:2px 2px max(5px,env(safe-area-inset-bottom));}
 .ctrl,.ctrl.small{min-height:72px}
 .utilities .ctrl{min-height:45px}
}
@media (max-width:920px) and (orientation:landscape){
 .top,.footer{display:none}
 #app{padding:2px;gap:2px;flex-direction:row;align-items:stretch}
 #frame{flex:1;min-width:0;width:auto;max-height:none;aspect-ratio:auto;border-radius:8px;box-shadow:none}
 .controls{flex:0 0 166px;width:166px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"utility utility" "move move" "actions actions";gap:5px;align-content:center;min-height:0;padding:2px;overflow:hidden}
 .controls .group{gap:5px;min-width:0;width:100%;justify-content:stretch}
 .controls .group .ctrl{width:0;min-width:0;flex:1 1 0;padding:2px}
 .ctrl,.ctrl.small{min-height:50px;font-size:21px}
 .actions .ctrl.small{font-size:11px}
 .utilities .ctrl{min-height:36px;font-size:9px;padding:4px;}
 .card{padding:12px}
 .card p{font-size:13px;margin:6px auto}

@media(max-height:440px) and (orientation:landscape){
 .controls{flex-basis:140px;width:140px}

 #dialogText{font-size:13px}
}
</style>
</head>
<body>
<div id="app">

  <div id="frame">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="hud"><div class="panel" id="hudLeft"></div><div class="panel" id="hudRight"></div></div>
    <div id="overlay"><div class="card" id="overlayCard"></div></div>
    <div id="dialog"><div id="speaker"></div><div id="dialogText"></div><div id="dialogHint">E / ENTER / TOCAR PARA CONTINUAR ▸</div></div>
  </div>
  <div class="controls">
    <div class="group movement">
      <button class="ctrl" data-key="left">◀</button>
      <button class="ctrl" data-key="right">▶</button>
    </div>
    <div class="group actions">
      <button class="ctrl small" data-key="throw">🐟 LANZAR</button>
      <button class="ctrl" data-key="jump">⬆</button>
    </div>
    <div class="group utilities">
      <button class="ctrl small" data-key="interact">CONTINUAR / HABLAR</button>
      <button class="ctrl small" data-key="pause">Ⅱ PAUSA</button>
    </div>
  </div>
  <div class="footer">A / D o flechas para moverte · ESPACIO para saltar · F/X para lanzar pescadito · E para interactuar · P para pausa</div>
</div>

function initLevel(index){
  levelIndex=index;
  state='play';
  levelCompletePending=false;
  resetHero();
  const lvl=levelData[levelIndex];
  lvl.npcs.forEach(n=>n.talked=false);
  lvl.collectibles.forEach(o=>o.taken=false);
  lvl.enemies.forEach(e=>{e.alive=true;e.v=(e.type==='drone'?85:60)*(Math.random()<.5?-1:1);});
  if(lvl.question) lvl.question.answered=false;
  updateHUD();
  overlay.classList.add('hidden'); hud.style.display='flex';
  if(index===0){
    // El juego comienza inmediatamente; los estudiantes hablan automáticamente al acercarse.

    notify('¡Encuentra a Miss Paty! Camina con A/D o ←/→.', 4);

    notify(`${levelTitles[index]} · ${lvl.goalText}`, 4);

}

function showDialog(lines, done){
  keys.left=keys.right=keys.jump=keys.throw=false;
  dialogQueue=lines.slice(); dialogPos=0; onDialogEnd=done||null; dialogBox.style.display='block'; state='dialog'; renderDialogLine();
}
function renderDialogLine(){
  const line=dialogQueue[dialogPos]; speakerEl.textContent=line.who; dialogTextEl.textContent=line.text;
}
function advanceDialog(){
  if(state!=='dialog') return;
  dialogPos++;
  if(dialogPos>=dialogQueue.length){ dialogBox.style.display='none'; state='play'; const fn=onDialogEnd; onDialogEnd=null; if(fn) fn(); }

function askQuestion(question, callback){
  state='question'; overlay.classList.remove('hidden'); hud.style.display='none'; activeQuestion={question,callback};
  overlayCard.innerHTML=`<div class="badge">Pregunta TICs</div><div class="hero">💡</div><h2>${question.asker}</h2><p>${question.prompt}</p><div class="optionGrid">${question.options.map((opt,i)=>`<button class="optionBtn" data-opt="${i}">${String.fromCharCode(65+i)}. ${opt}</button>`).join('')}</div><p class="note" id="qmsg">Elige una opción para continuar.</p>`;
  overlayCard.querySelectorAll('[data-opt]').forEach(btn=>btn.onclick=()=>{
    const selected=+btn.dataset.opt;
    if(selected===question.answer){
      question.answered=true; score+=60; beep(860,.15,'triangle'); $('qmsg').textContent='✓ '+question.ok;
      overlayCard.querySelectorAll('[data-opt]').forEach(b=>b.disabled=true);
      const next=document.createElement('button'); next.className='btn'; next.textContent='Seguir';
      next.onclick=()=>{ overlay.classList.add('hidden'); hud.style.display='flex'; state='play'; if(callback) callback(true);};

    } else {
      $('qmsg').textContent='✗ '+question.fail; beep(180,.18,'square');
    }
  });
}

function beep(freq=440,duration=.08,type='square',volume=.02){
  if(musicMuted) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!beep.ctx) beep.ctx=new AC();
    const ac=beep.ctx, o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=volume;
    o.connect(g); g.connect(ac.destination);
    const now=ac.currentTime; o.start(now); g.gain.setValueAtTime(volume,now); g.gain.exponentialRampToValueAtTime(.0001,now+duration); o.stop(now+duration+0.01);
  }catch(e){}
}

function drawHero(){
  if(!hero || (invuln>0 && Math.floor(invuln*12)%2===0)) return;
  // Recupera exactamente el estilo de Michardo de la primera aventura:
  // orejas triangulares rosadas, ojos verdes grandes, hocico rosado,
  // marcas atigradas, collar morado y cascabel dorado.
  drawClassicCat(hero.x+1, hero.y-3, 0.65, Math.abs(hero.vx)>0?hero.step:0);
  if(hero.hasTablet){
    // La tableta viaja segura con un moño junto a Michardo.
    rect(hero.x-6,hero.y+12,9,15,'#415784');
    rect(hero.x-4,hero.y+14,5,11,'#b4e6f4');
    rect(hero.x-5,hero.y+10,4,3,'#ef7aab');
    rect(hero.x-1,hero.y+10,4,3,'#ef7aab');
  }
}

function drawWorld(){
  drawBackground();
  const lvl=levelData[levelIndex];
  ctx.save(); ctx.translate(-camX,0);
  lvl.platforms.forEach(p=>drawPlatform(p,lvl.theme));
  lvl.spikes.forEach(drawSpike);
  lvl.collectibles.forEach(o=>{if(!o.taken) drawCollectible(o);});
  lvl.npcs.forEach(n=>{
    if(n.type==='student') drawStudent(n.x,n.y);
    else if(n.type==='bird') drawBird(n.x,n.y);
    else if(n.type==='cat') drawOtherCat(n.x,n.y);
    else if(n.type==='paty') drawPaty(n.x,n.y);
    if(Math.abs(hero.x-n.x)<80 && Math.abs(hero.y-n.y)<80) text(n.talked?'✓ AMIGO':'CHARLA',n.x+18,n.y-48,12,'#fff7b4','center');
  });
  lvl.enemies.forEach(e=>{ if(e.alive){ if(e.type==='bug') drawBug(e.x,e.y); else drawDrone(e.x,e.y);} });
  // gate
  const gx=lvl.gate.x;
  roundRect(gx-18,lvl.gate.y-72,36,72,10,lvl.finale?'#9be2c3':'#8bbaf3');
  rect(gx-6,lvl.gate.y-54,12,14,'#f8f8ff');
  text(lvl.finale?'META':'PREGUNTA',gx,lvl.gate.y-82,12,'#fff2ba','center');
  if(Math.abs(hero.x-gx)<80) text('E: pregunta final',gx,lvl.gate.y-95,12,'#fff6b9','center');
  // projectiles and particles
  projectiles.forEach(p=>drawCollectible({x:p.x,y:p.y,type:'fish'}));
  drawHero();
  particles.forEach(p=>rect(p.x,p.y,p.size,p.size,p.color));
  ctx.restore();
  // top progress bar
  const progress=Math.min(1, hero.x/(lvl.width-120));
  const barWidth=Math.min(340,Math.max(90,W-50)); roundRect((W-barWidth)/2,16,barWidth,12,6,'#0f1c36c0'); roundRect((W-barWidth)/2+4,19,(barWidth-8)*progress,6,3,lvl.theme); if(W>570)text('Misión: llevar la tableta a Miss Paty',W/2,50,14,'#eef7ff','center');
}

function solidAt(x,y,w,h){
  const lvl=levelData[levelIndex];
  for(const p of lvl.platforms){
    if(x+w>p[0] && x<p[0]+p[2] && y+h>p[1] && y<p[1]+p[3]) return p;
  }
  return null;
}

function updateHero(dt){
  const lvl=levelData[levelIndex];
  hero.vx=(keys.left?-1:0)+(keys.right?1:0);
  if(hero.vx!==0) hero.dir=hero.vx>0?1:-1;
  const speed=230;
  hero.x += hero.vx*speed*dt;
  hero.x=Math.max(0,Math.min(lvl.width-hero.w, hero.x));
  if((keys.jump)&&hero.ground&&!jumpLatch){ hero.vy=-620; hero.ground=false; jumpLatch=true; beep(520,.08,'triangle'); }
  if(!keys.jump) jumpLatch=false;
  hero.vy += gravity*dt; if(hero.vy>900) hero.vy=900;
  const oldY=hero.y;
  hero.y += hero.vy*dt;
  hero.ground=false;
  for(const p of lvl.platforms){
    if(hero.x+hero.w>p[0]+4 && hero.x<p[0]+p[2]-4 && oldY+hero.h<=p[1]+8 && hero.y+hero.h>=p[1] && hero.vy>=0){
      hero.y=p[1]-hero.h; hero.vy=0; hero.ground=true;
    }
  }
  if(hero.y>H+50){ loseLife(); hero.x=Math.max(50,hero.x-120); hero.y=100; hero.vy=0; }
  hero.step += dt*12*Math.abs(hero.vx);
  camX += (Math.max(0,Math.min(lvl.width-W, hero.x-Math.max(110,W*.32))) - camX)*Math.min(1,dt*5);

  // Los encuentros son AUTOMÁTICOS: al acercarse a un personaje,
  // se reproduce toda su conversación una sola vez por nivel.
  // No hace falta presionar E. La E queda disponible para los portales.
  for(const npc of lvl.npcs){
    if(npc.talked) continue;
    if(Math.abs(hero.x+17-(npc.x+17))<68 && Math.abs(hero.y+16-(npc.y-18))<76){
      npc.talked=true;
      keys.left=keys.right=keys.jump=keys.throw=false;
      if(npc.type==='paty' && lvl.finale){
        showDialog([
          {who:'Miss Paty',text:'¡Michardo, mi precioso gatito! ¡Encontraste mi tableta y llegaste hasta aquí!'},
          {who:'Michardo',text:'¡Miau! Los alumnos del Colegio Anglo Mexiquense me la confiaron para entregártela.'},
          {who:'Miss Paty',text:'¡Qué equipo tan maravilloso! Antes del abrazo, resuelve nuestro último reto de TICs.'}
        ],()=>askQuestion(lvl.question,()=>{
          showDialog([
            {who:'Miss Paty',text:'¡Perfecto! La tecnología nos ayuda a aprender, crear y comunicarnos.'},
            {who:'Narrador',text:'Miss Paty recibe la tableta, se arrodilla y abraza con muchísimo cariño a Michardo.'},
            {who:'Michardo',text:'¡Miaaau! ¡Misión cumplida!'}
          ],()=>finishLevel());
        }));
      }else{
        showDialog((npc.dialog||[]).map(t=>({who:npc.name,text:t})));
      }
      return;
    }
  }

  // collect
  lvl.collectibles.forEach(o=>{
    if(!o.taken && Math.abs(hero.x+17-o.x)<28 && Math.abs(hero.y+17-o.y)<28){
      o.taken=true;
      if(o.type==='fish'){ fishAmmo+=2; score+=20; beep(720,.08,'triangle'); spawnBurst(o.x,o.y,'#8fd3ff',8); }
      else if(o.type==='bow'){ rescued++; score+=25; beep(840,.08,'triangle'); spawnBurst(o.x,o.y,'#ff8eb0',10); }
      else if(o.type==='heart'){ hearts=Math.min(maxHearts, hearts+1); score+=30; beep(640,.09,'triangle'); spawnBurst(o.x,o.y,'#ff7f97',8); }
      updateHUD();
    }
  });
  // spikes
  lvl.spikes.forEach(s=>{ if(hero.x+hero.w>s[0] && hero.x<s[0]+s[2] && hero.y+hero.h>s[1]-16) loseLife(); });
  // enemies
  lvl.enemies.forEach(e=>{
    if(!e.alive) return;
    e.x += e.v*dt;
    if(e.x<e.min||e.x>e.max) e.v*=-1;
    if(Math.abs(hero.x+17-e.x)<24 && Math.abs(hero.y+17-e.y)<24) loseLife();
  });
  // throw fish
  if(keys.throw && !throwLatch){
    if(fishAmmo>0){
      fishAmmo--; throwLatch=true; projectiles.push({x:hero.x+hero.w/2,y:hero.y+14,vx:hero.dir*360,vy:-20,life:1.5}); beep(460,.07,'square'); updateHUD();
    }
  }
  if(!keys.throw) throwLatch=false;
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if(p.life<=0){ projectiles.splice(i,1); continue; }
    for(const e of lvl.enemies){
      if(e.alive && Math.abs(p.x-e.x)<18 && Math.abs(p.y-e.y)<18){ e.alive=false; projectiles.splice(i,1); score+=45; spawnBurst(e.x,e.y,'#ffd36b',14); beep(270,.08,'sawtooth'); updateHUD(); break; }
    }
  }
  // particles
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; p.vy+=220*dt; if(p.life<=0) particles.splice(i,1); }
  if(invuln>0) invuln-=dt;
}

function interact(){
  if(state==='dialog'){ advanceDialog(); return; }
  if(state!=='play') return;
  const lvl=levelData[levelIndex];
  // Los encuentros con estudiantes, animales y Miss Paty son automáticos.
  // E/Enter sólo sirven para iniciar el reto de salida al final del nivel.
  if(Math.abs(hero.x-lvl.gate.x)<70 && Math.abs(hero.y-lvl.gate.y)<110){
    if(lvl.finale){
      if(!lvl.question.answered){
        notify('Encuentra primero a Miss Paty para entregar la tableta.',3.5);
      }else finishLevel();
      return;
    }
    if(!lvl.question.answered){
      askQuestion(lvl.question,()=>finishLevel());
    } else finishLevel();
  }
}

function update(dt){
  if(state==='play') updateHero(dt);
  gameTime += dt;
}

function render(){
  ctx.clearRect(0,0,W,H);
  if(!hero || state==='menu'||state==='paused'||state==='lose'||state==='leveldone'||state==='question'){
    drawBackground(); ctx.save(); ctx.translate(0,0); drawHeroAtMenu(); ctx.restore();
  } else {
    drawWorld();
    if(notification && gameTime<notificationUntil){
      roundRect(185,65,590,32,12,'#0e1934dd');
      text(notification,480,87,15,'#fff5d3','center');
    }
  }
}

function drawHeroAtMenu(){
  // Portada con el mismo personaje de la versión original.
  const previewHero=hero;
  hero={dir:1};
  drawClassicCat(155,333,2.05,0);
  hero=previewHero;
}

function gameLoop(ts){
  resizeGame(); const dt=Math.min(0.033, ((ts-lastTime)||16)/1000); lastTime=ts;
  update(dt); render(); requestAnimationFrame(gameLoop);
}

const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',Space:'jump',KeyW:'jump',KeyE:'interact',Enter:'interact',KeyP:'pause',Escape:'pause',KeyF:'throw',KeyX:'throw'};
document.addEventListener('keydown',e=>{const k=keyMap[e.code]; if(!k) return; e.preventDefault(); if(k==='interact'&&!e.repeat) interact(); else if(k==='pause'&&!e.repeat){ if(state==='paused'){overlay.classList.add('hidden'); state='play'; hud.style.display='flex';} else pauseMenu(); } else { keys[k]=true; }});
document.addEventListener('keyup',e=>{const k=keyMap[e.code]; if(k && keys[k]!==undefined) keys[k]=false;});
document.querySelectorAll('[data-key]').forEach(btn=>{
  const k=btn.dataset.key;
  btn.addEventListener('pointerdown',e=>{e.preventDefault(); try{btn.setPointerCapture(e.pointerId)}catch(err){} btn.classList.add('active'); if(k==='interact') interact(); else if(k==='pause'){ if(state==='paused'){overlay.classList.add('hidden'); state='play'; hud.style.display='flex';} else pauseMenu(); } else keys[k]=true;});
  const off=()=>{btn.classList.remove('active'); if(keys[k]!==undefined) keys[k]=false;};
  btn.addEventListener('pointerup',off); btn.addEventListener('pointercancel',off); btn.addEventListener('lostpointercapture',off);
});
dialogBox.addEventListener('click',advanceDialog);

showMenu();
resizeGame();
requestAnimationFrame(gameLoop);
})();
</script>
</body>
